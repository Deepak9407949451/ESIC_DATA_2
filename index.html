        </tbody>
      </table>
    </section>
    <section class="page page-two">
      <h2 class="section-heading"><span>II.</span> (Non-package Rates) For procedures done (not existing in the list of packages rates)</h2>
      <table class="wide-form-table nonpackage-table">
        <colgroup><col style="width:8.5%"><col style="width:33%"><col style="width:19%"><col style="width:19%"><col style="width:20.5%"></colgroup>
        <thead><tr><th>S. No.</th><th>Chargeable Procedure</th><th>Amt. Claimed</th><th>Amount<br>Admitted</th><th>Remarks</th></tr></thead>
        <tbody id="nonpackage-rows"><tr><td>1</td><td><textarea class="wrap-textarea" aria-label="Non-package chargeable procedure"></textarea></td><td><input aria-label="Non-package amount claimed"></td><td><input aria-label="Non-package amount admitted"></td><td><textarea class="wrap-textarea" aria-label="Non-package remarks"></textarea></td></tr></tbody>
      </table>
      <button type="button" class="add-row-button" id="add-nonpackage-row">Add non-package procedure row</button>
      <h2 class="section-heading additional-heading"><span>III.</span> Additional Procedure Done with rationale and documented permission</h2>
      <table class="wide-form-table additional-table">
        <colgroup><col style="width:7.5%"><col style="width:15.5%"><col style="width:11.5%"><col style="width:12.5%"><col style="width:9.5%"><col style="width:12.5%"><col style="width:13%"><col style="width:18%"></colgroup>
        <thead><tr><th>S. No.</th><th>Chargeable<br>Procedure</th><th>CGHS<br>Code no<br>with page<br>no&nbsp; (1)</th><th>Other if<br>not on (1)<br>prescribed<br>code no<br>with page no</th><th>Rate</th><th>Amt.<br>Claimed</th><th>Amount<br>Admitted</th><th>Remarks</th></tr></thead>
        <tbody id="additional-rows"><tr><td><input aria-label="Additional procedure serial number" value="1"></td><td><textarea class="wrap-textarea" aria-label="Additional chargeable procedure"></textarea></td><td><textarea class="wrap-textarea" aria-label="Additional CGHS code"></textarea></td><td><textarea class="wrap-textarea" aria-label="Other additional code"></textarea></td><td><input aria-label="Additional procedure rate"></td><td><input aria-label="Additional amount claimed"></td><td><input aria-label="Additional amount admitted"></td><td><textarea class="wrap-textarea" aria-label="Additional procedure remarks"></textarea></td></tr></tbody>
      </table>
      <button type="button" class="add-row-button" id="add-additional-row">Add additional procedure row</button>
      <table class="amount-table total-table">
        <tbody>
          <tr><th>Total Amount Claimed (I+II+III)</th><td><input aria-label="Total amount claimed"></td></tr>
          <tr><th>Amount Claimed Rs.</th><td><input aria-label="Total amount claimed in rupees"></td></tr>
          <tr><th></th><td></td></tr>
        </tbody>
      </table>
      <div class="signature-row">
        <strong>Sign/Thumb impression of patient</strong>
        <strong>Sign &amp; Stamp of Authorized Signatory</strong>
      </div>
      <div class="official-use">(For Official use for ESIC)</div>
      <div class="official-signatures">
        <span>Signature of Dealing Assistant</span>
        <span>Signature of Superintendent</span>
      </div>
    </section>
  </main>
  <script>
    document.querySelector('#print-form')?.addEventListener('click', () => window.print());
    let activeField = null;
    const formFields = 'input, textarea, select';
    const heightControls = document.querySelector('#field-height-controls');
    function positionHeightControls(field) {
      if (!heightControls || !field) return;
      const rect = field.getBoundingClientRect();
      heightControls.hidden = false;
      const controlsRect = heightControls.getBoundingClientRect();
      const left = Math.min(window.innerWidth - controlsRect.width - 8, Math.max(8, rect.right + 8));
      const top = Math.min(window.innerHeight - controlsRect.height - 8, Math.max(8, rect.top));
      heightControls.style.left = \`\${left}px\`;
      heightControls.style.top = \`\${top}px\`;
    }
    document.addEventListener('focusin', (event) => { if (!event.target.matches(formFields)) return; activeField = event.target; positionHeightControls(activeField); });
    document.addEventListener('click', (event) => {
      if (event.target.matches(formFields)) { activeField = event.target; positionHeightControls(activeField); }
      else if (!event.target.closest('#field-height-controls')) { if (heightControls) heightControls.hidden = true; }
    });
    heightControls?.addEventListener('pointerdown', (event) => event.preventDefault());
    function adjustFieldHeight(amount) {
      if (!activeField) return;
      const currentHeight = activeField.getBoundingClientRect().height;
      activeField.style.height = \`\${Math.max(24, Math.min(300, currentHeight + amount))}px\`;
      positionHeightControls(activeField);
    }
    document.querySelector('#increase-height')?.addEventListener('click', () => adjustFieldHeight(8));
    document.querySelector('#decrease-height')?.addEventListener('click', () => adjustFieldHeight(-8));
    window.addEventListener('resize', () => positionHeightControls(activeField));
    window.addEventListener('scroll', () => positionHeightControls(activeField), true);
    document.querySelector('#toggle-bold')?.addEventListener('click', () => {
      if (!activeField) return;
      const isBold = getComputedStyle(activeField).fontWeight === '700';
      activeField.style.fontWeight = isBold ? 'normal' : 'bold';
      document.querySelector('#toggle-bold')?.setAttribute('aria-pressed', String(!isBold));
      updatePrintValue(activeField);
    });
    function adjustTextSize(amount) {
      if (!activeField) return;
      const currentSize = parseFloat(getComputedStyle(activeField).fontSize);
      activeField.style.fontSize = \`\${Math.max(8, Math.min(32, currentSize + amount))}px\`;
      updatePrintValue(activeField);
    }
    document.querySelector('#increase-text')?.addEventListener('click', () => adjustTextSize(2));
    document.querySelector('#decrease-text')?.addEventListener('click', () => adjustTextSize(-2));
    function autoGrowWrapTextarea(textarea) {
      textarea.style.height = 'auto';
      textarea.style.height = \`\${textarea.scrollHeight}px\`;
    }
    document.querySelectorAll('.wrap-textarea').forEach(autoGrowWrapTextarea);
    document.addEventListener('input', (event) => {
      if (event.target instanceof HTMLTextAreaElement && event.target.matches('.wrap-textarea')) {
        autoGrowWrapTextarea(event.target);
      }
    });
    window.addEventListener('beforeprint', () => {
      document.querySelectorAll('.wrap-textarea').forEach(autoGrowWrapTextarea);
    });
    document.querySelector('#add-package-row')?.addEventListener('click', () => {
      const rows = document.querySelector('#package-rows');
      if (!rows) return;
      const rowNumber = rows.rows.length + 1;
      const labels = ['serial number', 'chargeable procedure', 'CGHS code', 'other package code', 'rate', 'amount claimed', 'remarks'];
      const row = rows.rows[0].cloneNode(true);
      row.querySelectorAll('input, textarea').forEach((field, index) => {
        field.value = '';
        field.setAttribute('aria-label', \`Package item \${rowNumber} \${labels[index]}\`);
        if (field instanceof HTMLTextAreaElement) autoGrowWrapTextarea(field);
      });
      rows.appendChild(row);
    });
    document.querySelector('#add-nonpackage-row')?.addEventListener('click', () => {
      const rows = document.querySelector('#nonpackage-rows');
      if (!rows) return;
      const rowNumber = rows.rows.length + 1;
      const labels = ['chargeable procedure', 'amount claimed', 'amount admitted', 'remarks'];
      const row = rows.rows[0].cloneNode(true);
      row.querySelectorAll('textarea, input').forEach((field, index) => {
        field.value = '';
        field.setAttribute('aria-label', \`Non-package item \${rowNumber} \${labels[index]}\`);
        if (field instanceof HTMLTextAreaElement) autoGrowWrapTextarea(field);
      });
      row.cells[0].textContent = String(rowNumber);
      rows.appendChild(row);
    });
    document.querySelector('#add-additional-row')?.addEventListener('click', () => {
      const rows = document.querySelector('#additional-rows');
      if (!rows) return;
      const rowNumber = rows.rows.length + 1;
      const row = rows.rows[0].cloneNode(true);
      row.querySelectorAll('input, textarea').forEach((field) => {
        const label = field.getAttribute('aria-label') || 'Additional procedure field';
        field.value = '';
        field.setAttribute('aria-label', \`\${label} \${rowNumber}\`);
        if (field instanceof HTMLTextAreaElement) autoGrowWrapTextarea(field);
      });
      const serialNumber = row.querySelector('input');
      if (serialNumber) serialNumber.value = String(rowNumber);
      rows.appendChild(row);
    });
    function formatControlValue(control) {
      const value = control.value;
      if (!value) return '';
      if (control.type === 'date') { const [year, month, day] = value.split('-'); return \`\${day}/\${month}/\${year}\`; }
      if (control.type === 'datetime-local') { const [date, time] = value.split('T'); const [year, month, day] = date.split('-'); return \`\${day}/\${month}/\${year} \${time}\`; }
      return value;
    }
    function updatePrintValue(control) {
      const mirror = control.parentElement.querySelector('.print-value');
      if (!mirror) return;
      if (control.closest('.age-sex-row')) {
        const row = control.closest('.age-sex-row');
        const age = row.querySelector('input')?.value.trim();
        const sex = row.querySelector('select')?.value;
        mirror.textContent = [age ? \`\${age} years\` : '', sex].filter(Boolean).join(' / ');
      } else { mirror.textContent = formatControlValue(control); }
      mirror.style.fontWeight = control.style.fontWeight || 'bold';
      mirror.style.fontSize = control.style.fontSize || '';
    }
    const selectors = '.patient-table input[type="date"], .patient-table input[type="datetime-local"], .age-sex-row input, .age-sex-row select, .discharge-row select, .treatment-table select';
    document.querySelectorAll(selectors).forEach((control) => {
      updatePrintValue(control);
      control.addEventListener('input', () => updatePrintValue(control));
      control.addEventListener('change', () => { updatePrintValue(control); control.blur(); });
    });
    window.addEventListener('beforeprint', () => { document.querySelectorAll(selectors).forEach(updatePrintValue); });
  <\/script>
</body>
</html>`;
      }


      // =========================================================================
      // COMPONENTS: ERROR BOUNDARY, INVOICE CALCULATOR & REMARK/IMPLANTS MODAL
      // =========================================================================
      class ErrorBoundary extends React.Component {
        constructor(props) {
          super(props);
          this.state = { hasError: false, message: '' };
        }
        static getDerivedStateFromError(error) {
          return { hasError: true, message: error?.message || 'An unexpected error occurred.' };
        }
        componentDidCatch(error, info) {
          console.error('Application ErrorBoundary caught:', error, info);
        }
        render() {
          if (this.state.hasError) {
            return (
              <div className="flex min-h-screen items-center justify-center bg-slate-50 p-6">
                <div className="w-full max-w-lg rounded-xl border border-slate-200 bg-white p-6">
                  <h1 className="font-display text-lg font-bold text-slate-900">Something went wrong</h1>
                  <p className="mt-2 text-xs text-slate-600 break-words">{this.state.message}</p>
                  <button
                    type="button"
                    onClick={() => window.location.reload()}
                    className="mt-4 inline-flex h-9 items-center rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white hover:bg-teal-800"
                  >
                    Reload Application
                  </button>
                </div>
              </div>
            );
          }
          return this.props.children;
        }
      }

      function numberToWords(inputNum) {
        let num = Math.max(0, Math.floor(inputNum));
        if (num === 0) return 'Zero';
        const a = ['', 'One', 'Two', 'Three', 'Four', 'Five', 'Six', 'Seven', 'Eight', 'Nine', 'Ten', 'Eleven', 'Twelve', 'Thirteen', 'Fourteen', 'Fifteen', 'Sixteen', 'Seventeen', 'Eighteen', 'Nineteen'];
        const b = ['', '', 'Twenty', 'Thirty', 'Forty', 'Fifty', 'Sixty', 'Seventy', 'Eighty', 'Ninety'];
        const g = ['', 'Thousand', 'Lakh', 'Crore'];
        function convertLessThanThousand(n) {
          let str = '';
          if (n >= 100) { str += `${a[Math.floor(n / 100)]} Hundred `; n %= 100; }
          if (n >= 20) { str += `${b[Math.floor(n / 10)]} `; n %= 10; }
          if (n > 0) { str += `${a[n]} `; }
          return str.trim();
        }
        let words = '';
        let factor = 10000000;
        let idx = 3;
        while (idx > 0) {
          const amount = Math.floor(num / factor);
          if (amount > 0) {
            words += `${convertLessThanThousand(amount)} ${g[idx]} `;
            num %= factor;
          }
          factor /= idx === 1 ? 10 : 100;
          idx -= 1;
        }
        if (num > 0) words += `${convertLessThanThousand(num)} `;
        return words.trim();
      }

      function computeInvoiceRow(row) {
        const gstRate = Number.isFinite(row.gstRate) ? row.gstRate : 0;
        const mrp = Number.isFinite(row.mrp) ? row.mrp : 0;
        const qty = Number.isFinite(row.qty) ? row.qty : 0;
        const gstComponent = (mrp * gstRate) / (100 + gstRate);
        const roundedGstComponent = Math.round(gstComponent * 100) / 100;
        const rateBeforeTax = mrp - roundedGstComponent;
        return {
          ...row,
          rateExclGst: rateBeforeTax,
          amount: qty * rateBeforeTax,
          gstAmount: qty * roundedGstComponent,
        };
      }

      function InvoiceCalculatorModal({ isOpen, onClose, onUseTotalInImplants }) {
        const [isMinimized, setIsMinimized] = useState(false);
        const [copiedTotal, setCopiedTotal] = useState(false);
        const [rows, setRows] = useState([{ id: '1', gstRate: 5, mrp: 0, qty: 0 }]);

        useEffect(() => {
          if (isOpen) setIsMinimized(false);
        }, [isOpen]);

        useEffect(() => {
          if (!isOpen || isMinimized) return;
          const handleKey = (e) => {
            if (e.key === 'Escape') {
              e.stopPropagation();
              onClose();
            }
          };
          window.addEventListener('keydown', handleKey, true);
          return () => window.removeEventListener('keydown', handleKey, true);
        }, [isOpen, isMinimized, onClose]);

        const computedRows = useMemo(() => rows.map(computeInvoiceRow), [rows]);
        const totals = useMemo(() => {
          const totalQty = computedRows.reduce((sum, r) => sum + (r.qty || 0), 0);
          const totalAmount = computedRows.reduce((sum, r) => sum + r.amount, 0);
          const totalGst = computedRows.reduce((sum, r) => sum + r.gstAmount, 0);
          const splitGst = totalGst / 2;
          const grandTotal = totalAmount + totalGst;
          return {
            totalQty,
            totalAmount,
            totalGst,
            splitGst,
            grandTotal,
            grandTotalWords: `${numberToWords(Math.round(grandTotal))} Rupees Only`,
            totalGstWords: `${numberToWords(Math.round(totalGst))} Rupees Only`,
          };
        }, [computedRows]);

        if (!isOpen) return null;

        const handleRowChange = (id, field, rawValue) => {
          const parsed = field === 'qty' ? Number.parseInt(rawValue, 10) || 0 : Number.parseFloat(rawValue) || 0;
          setRows((prev) => prev.map((row) => (row.id === id ? { ...row, [field]: parsed } : row)));
        };

        const handleAddRow = () => {
          setRows((prev) => [...prev, { id: `${Date.now()}-${Math.random().toString(36).slice(2, 6)}`, gstRate: 5, mrp: 0, qty: 0 }]);
        };

        const handleRemoveLastRow = () => {
          setRows((prev) => (prev.length > 1 ? prev.slice(0, -1) : prev));
        };

        const handleCopyGrandTotal = async () => {
          try {
            await navigator.clipboard.writeText(totals.grandTotal.toFixed(2));
            setCopiedTotal(true);
            window.setTimeout(() => setCopiedTotal(false), 1800);
          } catch {}
        };

        if (isMinimized) {
          return (
            <div className="fixed bottom-5 right-5 z-[70] flex items-center gap-3 rounded-2xl border border-teal-700/30 bg-white p-3.5 text-slate-900 shadow-xl ring-1 ring-slate-900/5" role="region" aria-label="Minimized Invoice Calculator">
              <div className="flex h-10 w-10 items-center justify-center rounded-xl border border-teal-200 bg-teal-50 text-teal-700">
                <Calculator className="h-5 w-5" aria-hidden="true" />
              </div>
              <div>
                <div className="text-xs font-bold text-slate-900">
                  Invoice Calculator <span className="text-[10px] font-semibold text-teal-700">(Minimized)</span>
                </div>
                <div className="mt-0.5 font-mono text-xs font-bold text-emerald-700 tabular-nums">
                  Grand Total: ₹ {totals.grandTotal.toFixed(2)}
                </div>
              </div>
              <div className="ml-2 flex items-center gap-1.5">
                <button type="button" onClick={() => setIsMinimized(false)} className="inline-flex items-center gap-1 rounded-lg bg-teal-700 px-3 py-1.5 text-xs font-semibold text-white hover:bg-teal-800">
                  Open
                </button>
                <button type="button" onClick={onClose} aria-label="Close Invoice Calculator" className="inline-flex h-7 w-7 items-center justify-center rounded-lg border border-slate-200 bg-slate-50 text-slate-600 hover:bg-slate-100 hover:text-slate-900">
                  <X className="h-3.5 w-3.5" aria-hidden="true" />
                </button>
              </div>
            </div>
          );
        }

        return (
          <div className="fixed inset-0 z-[70] flex items-center justify-center bg-slate-950/45 p-3 backdrop-blur-[2px] sm:p-5" role="dialog" aria-modal="true" aria-labelledby="invoice-calculator-title" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="flex max-h-[92vh] w-full max-w-5xl flex-col overflow-hidden rounded-xl border border-slate-200 bg-white text-slate-800 shadow-2xl">
              <div className="flex shrink-0 items-center justify-between gap-3 border-b border-slate-200 bg-white px-5 py-3.5">
                <div className="flex items-center gap-3">
                  <div className="flex h-9 w-9 items-center justify-center rounded-lg border border-teal-200 bg-teal-50 text-teal-700">
                    <Calculator className="h-5 w-5" aria-hidden="true" />
                  </div>
                  <div>
                    <h2 id="invoice-calculator-title" className="font-display text-base font-bold text-slate-900">Invoice Calculator</h2>
                    <p className="mt-0.5 text-xs text-slate-500">Interactive GST &amp; MRP rate breakdown with automatic rupee conversion</p>
                  </div>
                </div>
                <div className="flex items-center gap-2">
                  <button type="button" onClick={() => setIsMinimized(true)} className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                    <Minus className="h-3.5 w-3.5" aria-hidden="true" /> Minimize
                  </button>
                  <button type="button" onClick={onClose} aria-label="Close Invoice Calculator" className="inline-flex h-8 w-8 items-center justify-center rounded-lg border border-slate-200 bg-white text-slate-500 hover:bg-slate-100 hover:text-slate-900">
                    <X className="h-4 w-4" aria-hidden="true" />
                  </button>
                </div>
              </div>

              <div className="register-scroll flex flex-1 flex-col gap-4 overflow-y-auto bg-slate-50/70 p-5">
                <div className="flex flex-wrap items-center justify-between gap-2.5">
                  <div className="flex flex-wrap gap-2.5">
                    <button type="button" onClick={handleAddRow} className="inline-flex items-center gap-1.5 rounded-lg bg-emerald-600 px-3.5 py-2 text-xs font-semibold text-white shadow-xs hover:bg-emerald-700">
                      <Plus className="h-3.5 w-3.5" aria-hidden="true" /> Add Item Row
                    </button>
                    <button type="button" onClick={handleRemoveLastRow} disabled={rows.length <= 1} className="inline-flex items-center gap-1.5 rounded-lg border border-rose-200 bg-rose-50 px-3.5 py-2 text-xs font-semibold text-rose-700 hover:bg-rose-100 disabled:cursor-not-allowed disabled:opacity-45">
                      <Minus className="h-3.5 w-3.5" aria-hidden="true" /> Remove Last Row
                    </button>
                  </div>
                  <button type="button" onClick={handleCopyGrandTotal} className="inline-flex items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 py-2 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                    {copiedTotal ? (<><Check className="h-3.5 w-3.5 text-emerald-600" aria-hidden="true" /> Copied ₹{totals.grandTotal.toFixed(2)}</>) : (<><Copy className="h-3.5 w-3.5" aria-hidden="true" /> Copy Grand Total</>)}
                  </button>
                </div>

                <div className="overflow-x-auto rounded-xl border border-slate-200 bg-white shadow-xs">
                  <table className="w-full min-w-[700px] border-collapse bg-white text-center text-xs">
                    <thead>
                      <tr className="border-b border-slate-200 bg-slate-100 text-[10px] font-bold uppercase tracking-wider text-slate-700">
                        <th className="w-16 border-r border-slate-200 p-3">Sl No.</th>
                        <th className="w-28 border-r border-slate-200 p-3">GST Rate (%)</th>
                        <th className="w-32 border-r border-slate-200 p-3">MRP/Marginal</th>
                        <th className="w-24 border-r border-slate-200 p-3">Quantity</th>
                        <th className="w-36 border-r border-slate-200 p-3">Rate (Excl. GST)</th>
                        <th className="w-32 border-r border-slate-200 p-3">Amount</th>
                        <th className="w-28 p-3">GST</th>
                      </tr>
                    </thead>
                    <tbody>
                      {computedRows.map((row, index) => (
                        <tr key={row.id} className="border-b border-slate-200 hover:bg-slate-50/80">
                          <td className="border-r border-slate-200 p-2 font-mono font-semibold text-teal-700 tabular-nums">{index + 1}</td>
                          <td className="border-r border-slate-200 p-1.5">
                            <input type="number" step="0.01" value={row.gstRate} onChange={(e) => handleRowChange(row.id, 'gstRate', e.target.value)} aria-label={`Row ${index + 1} GST Rate`} className="w-full rounded-md border border-slate-300 bg-white p-1.5 text-center font-mono text-xs text-slate-900 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-700/15" />
                          </td>
                          <td className="border-r border-slate-200 p-1.5">
                            <input type="number" step="0.01" value={row.mrp} onChange={(e) => handleRowChange(row.id, 'mrp', e.target.value)} aria-label={`Row ${index + 1} MRP or Marginal`} className="w-full rounded-md border border-slate-300 bg-white p-1.5 text-center font-mono text-xs text-slate-900 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-700/15" />
                          </td>
                          <td className="border-r border-slate-200 p-1.5">
                            <input type="number" step="1" value={row.qty} onChange={(e) => handleRowChange(row.id, 'qty', e.target.value)} aria-label={`Row ${index + 1} Quantity`} className="w-full rounded-md border border-slate-300 bg-white p-1.5 text-center font-mono text-xs text-slate-900 outline-none focus:border-teal-700 focus:ring-2 focus:ring-teal-700/15" />
                          </td>
                          <td className="border-r border-slate-200 p-2.5 font-mono text-slate-700 tabular-nums">{row.rateExclGst.toFixed(2)}</td>
                          <td className="border-r border-slate-200 p-2.5 font-mono font-bold text-slate-900 tabular-nums">{row.amount.toFixed(2)}</td>
                          <td className="p-2.5 font-mono font-semibold text-emerald-700 tabular-nums">{row.gstAmount.toFixed(2)}</td>
                        </tr>
                      ))}
                    </tbody>
                    <tfoot>
                      <tr className="border-b border-slate-200 bg-slate-50/70">
                        <td colSpan={5} className="border-r border-slate-200 p-2.5 text-right font-semibold text-slate-700">CGST (50% of GST):</td>
                        <td className="border-r border-slate-200 p-2.5" />
                        <td className="p-2.5 text-right font-mono font-bold text-teal-800 tabular-nums">{totals.splitGst.toFixed(2)}</td>
                      </tr>
                      <tr className="border-b border-slate-200 bg-slate-50/70">
                        <td colSpan={5} className="border-r border-slate-200 p-2.5 text-right font-semibold text-slate-700">SGST (50% of GST):</td>
                        <td className="border-r border-slate-200 p-2.5" />
                        <td className="p-2.5 text-right font-mono font-bold text-teal-800 tabular-nums">{totals.splitGst.toFixed(2)}</td>
                      </tr>
                      <tr className="border-b border-slate-200 bg-slate-100 font-bold">
                        <td colSpan={3} className="border-r border-slate-200 p-2.5 text-left text-slate-900">Total</td>
                        <td className="border-r border-slate-200 p-2.5 text-center font-mono text-slate-900 tabular-nums">{totals.totalQty}</td>
                        <td className="border-r border-slate-200 p-2.5" />
                        <td className="border-r border-slate-200 p-2.5 text-right font-mono text-slate-900 tabular-nums">{totals.totalAmount.toFixed(2)}</td>
                        <td className="p-2.5 text-right font-mono text-emerald-700 tabular-nums">{totals.totalGst.toFixed(2)}</td>
                      </tr>
                      <tr className="border-b border-slate-200 font-bold">
                        <td colSpan={5} className="border-r border-slate-200 bg-white p-3 text-right text-sm text-slate-800">TOTAL AMOUNT (Incl. GST):</td>
                        <td colSpan={2} className="border-l border-teal-200 bg-teal-50 p-3 text-right font-mono text-base font-extrabold text-teal-900 tabular-nums">₹ {totals.grandTotal.toFixed(2)}</td>
                      </tr>
                      <tr>
                        <td colSpan={7} className="bg-slate-50/70 p-4 text-left leading-relaxed">
                          <div><strong className="text-slate-600">Amount Chargeable (in words):</strong> <span className="font-semibold text-slate-900">{totals.grandTotalWords}</span></div>
                          <div className="mt-1.5"><strong className="text-slate-600">Total GST Amount (in words):</strong> <span className="font-semibold text-teal-800">{totals.totalGstWords}</span></div>
                        </td>
                      </tr>
                    </tfoot>
                  </table>
                </div>
              </div>

              <div className="flex shrink-0 flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-white px-5 py-3">
                <div className="text-xs text-slate-600">
                  Grand Total: <strong className="font-mono font-bold text-emerald-700 tabular-nums">₹ {totals.grandTotal.toFixed(2)}</strong>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  {onUseTotalInImplants && totals.grandTotal > 0 ? (
                    <button type="button" onClick={() => { onUseTotalInImplants(totals.grandTotal); onClose(); }} className="rounded-lg bg-emerald-600 px-4 py-1.5 text-xs font-semibold text-white shadow-xs hover:bg-emerald-700">
                      Use Total in Implants Table
                    </button>
                  ) : null}
                  <button type="button" onClick={() => setIsMinimized(true)} className="rounded-lg border border-slate-300 bg-white px-4 py-1.5 text-xs font-semibold text-slate-700 hover:bg-slate-50">
                    Minimize
                  </button>
                  <button type="button" onClick={onClose} className="rounded-lg bg-teal-700 px-5 py-1.5 text-xs font-semibold text-white shadow-xs hover:bg-teal-800">
                    Close Window
                  </button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function createBlankImplantRow(index) {
        return {
          id: `imp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}-${index}`,
          srNo: String(index),
          name: '',
          amount: '',
        };
      }

      function RemarkImplantsModal({ isOpen, initialMode, patientLabel, initialRemark, initialImplants, onSave, onClose }) {
        const [mode, setMode] = useState(initialMode);
        const [remarkDraft, setRemarkDraft] = useState(initialRemark);
        const [implantsDraft, setImplantsDraft] = useState(() => (initialImplants.length > 0 ? initialImplants : [createBlankImplantRow(1)]));
        const [isCalculatorOpen, setIsCalculatorOpen] = useState(false);
        const remarkInputRef = useRef(null);

        useEffect(() => {
          if (!isOpen) return;
          setMode(initialMode);
          setRemarkDraft(initialRemark);
          setImplantsDraft(initialImplants.length > 0 ? initialImplants.map((r) => ({ ...r })) : [createBlankImplantRow(1)]);
        }, [isOpen, initialMode, initialRemark, initialImplants]);

        useEffect(() => {
          if (!isOpen) return;
          const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
          window.addEventListener('keydown', handleKey);
          return () => window.removeEventListener('keydown', handleKey);
        }, [isOpen, onClose]);

        useEffect(() => {
          if (isOpen && mode === 'remark') {
            window.requestAnimationFrame(() => remarkInputRef.current?.focus());
          }
        }, [isOpen, mode]);

        const activeImplants = useMemo(() => implantsDraft.filter((r) => r.name.trim() !== '' || r.amount.trim() !== ''), [implantsDraft]);
        const implantsTotal = useMemo(() => activeImplants.reduce((sum, r) => sum + parseNumericAmount(r.amount), 0), [activeImplants]);

        if (!isOpen) return null;

        const handleUpdateImplantRow = (id, field, value) => {
          setImplantsDraft((prev) => prev.map((row) => (row.id === id ? { ...row, [field]: value } : row)));
        };
        const handleAddImplantRow = () => setImplantsDraft((prev) => [...prev, createBlankImplantRow(prev.length + 1)]);
        const handleRemoveImplantRow = (id) => {
          setImplantsDraft((prev) => {
            const next = prev.filter((row) => row.id !== id);
            if (next.length === 0) return [createBlankImplantRow(1)];
            return next.map((row, idx) => ({ ...row, srNo: String(idx + 1) }));
          });
        };
        const handleUseCalculatorTotal = (grandTotal) => {
          const formatted = grandTotal.toFixed(2);
          setImplantsDraft((prev) => {
            const emptyIdx = prev.findIndex((r) => !r.amount.trim());
            if (emptyIdx >= 0) return prev.map((row, idx) => (idx === emptyIdx ? { ...row, amount: formatted } : row));
            return [...prev, { ...createBlankImplantRow(prev.length + 1), amount: formatted }];
          });
        };
        const handleSaveAndClose = () => { onSave(remarkDraft.trim(), activeImplants); onClose(); };
        const handleSaveAndPreview = () => { onSave(remarkDraft.trim(), activeImplants); setMode('preview'); };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-[1px]" role="dialog" aria-modal="true" aria-labelledby="remark-implants-modal-title" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="flex max-h-[90vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">
              <div className="flex items-start justify-between gap-4 border-b border-slate-200 px-6 py-4">
                <div>
                  <h2 id="remark-implants-modal-title" className="font-display text-base font-bold text-slate-900">
                    Remark &amp; Implants{patientLabel ? ` — ${patientLabel}` : ''}
                  </h2>
                  <p className="mt-0.5 text-xs text-slate-500">03. Admission &amp; Discharge Timeline · Choose Remark entry, Implants table, or view Preview</p>
                </div>
                <button type="button" onClick={onClose} aria-label="Close Remark & Implants popup" className="inline-flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900">
                  <X className="h-4 w-4" aria-hidden="true" />
                </button>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-2 border-b border-slate-200 bg-slate-50 px-6 py-2.5">
                <div className="inline-flex items-center gap-1 rounded-lg bg-slate-200/70 p-1">
                  <button type="button" onClick={() => setMode('choose')} className={`rounded-md px-3 py-1 text-xs font-medium ${mode === 'choose' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>Options</button>
                  <button type="button" onClick={() => setMode('remark')} className={`inline-flex items-center gap-1.5 rounded-md px-3 py-1 text-xs font-medium ${mode === 'remark' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                    <FileText className="h-3.5 w-3.5 text-teal-700" aria-hidden="true" /> Remark
                  </button>
                  <button type="button" onClick={() => setMode('implants')} className={`inline-flex items-center gap-1.5 rounded-md px-3 py-1 text-xs font-medium ${mode === 'implants' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>
                    <Package className="h-3.5 w-3.5 text-teal-700" aria-hidden="true" /> Implants ({activeImplants.length})
                  </button>
                </div>
                <button type="button" onClick={handleSaveAndPreview} className={`inline-flex h-8 items-center gap-1.5 rounded-md border px-3 text-xs font-semibold ${mode === 'preview' ? 'border-teal-700 bg-teal-700 text-white' : 'border-teal-700/30 bg-white text-teal-800 hover:bg-teal-50'}`}>
                  <Eye className="h-3.5 w-3.5" aria-hidden="true" /> Preview
                </button>
              </div>

              <div className="register-scroll flex-1 overflow-y-auto px-6 py-5">
                {mode === 'choose' ? (
                  <div className="space-y-4">
                    <p className="text-sm font-medium text-slate-800">What would you like to enter? Select Remark or Implants below:</p>
                    <div className="grid grid-cols-1 gap-4 sm:grid-cols-2">
                      <button type="button" onClick={() => setMode('remark')} className="group flex flex-col items-start gap-2 rounded-xl border border-slate-200 bg-white p-5 text-left hover:border-teal-700 hover:bg-teal-50/40">
                        <div className="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-teal-50 text-teal-700 group-hover:bg-teal-700 group-hover:text-white">
                          <FileText className="h-5 w-5" aria-hidden="true" />
                        </div>
                        <div>
                          <div className="text-sm font-semibold text-slate-900">Remark</div>
                          <p className="mt-1 text-xs text-slate-500">Open direct entry box for clinical, referral, or admission remarks.</p>
                        </div>
                        {remarkDraft.trim() ? <div className="mt-1 text-[11px] font-medium text-teal-700 line-clamp-1">Saved: {remarkDraft.trim()}</div> : null}
                      </button>
                      <button type="button" onClick={() => setMode('implants')} className="group flex flex-col items-start gap-2 rounded-xl border border-slate-200 bg-white p-5 text-left hover:border-teal-700 hover:bg-teal-50/40">
                        <div className="inline-flex h-10 w-10 items-center justify-center rounded-lg bg-slate-100 text-slate-800 group-hover:bg-teal-700 group-hover:text-white">
                          <Package className="h-5 w-5" aria-hidden="true" />
                        </div>
                        <div>
                          <div className="text-sm font-semibold text-slate-900">Implants</div>
                          <p className="mt-1 text-xs text-slate-500">Create and enter Implants table with Sr No, Name of Implants, and Amount.</p>
                        </div>
                        {activeImplants.length > 0 ? (
                          <div className="mt-1 font-mono text-[11px] font-semibold text-teal-700 tabular-nums">
                            {activeImplants.length} {activeImplants.length === 1 ? 'implant' : 'implants'} · Total ₹{formatCurrencyValue(implantsTotal)}
                          </div>
                        ) : null}
                      </button>
                    </div>
                  </div>
                ) : mode === 'remark' ? (
                  <div className="space-y-3">
                    <label htmlFor="admission-remark-textarea" className="block text-xs font-semibold text-slate-700">Remark Entry</label>
                    <textarea ref={remarkInputRef} id="admission-remark-textarea" rows={5} value={remarkDraft} onChange={(e) => setRemarkDraft(e.target.value)} placeholder="Type admission remark, doctor note, or special case instructions..." className="w-full rounded-lg border border-slate-300 bg-white px-3.5 py-2.5 text-sm text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15" />
                    <div className="flex items-center justify-between text-xs text-slate-500">
                      <span>Remark will be saved into this patient&rsquo;s ESIC Claim entry.</span>
                      {remarkDraft.trim() ? <button type="button" onClick={() => setRemarkDraft('')} className="font-medium text-red-700 hover:underline">Clear Remark</button> : null}
                    </div>
                  </div>
                ) : mode === 'implants' ? (
                  <div className="space-y-4">
                    <div className="flex flex-wrap items-center justify-between gap-2">
                      <div>
                        <h3 className="text-sm font-semibold text-slate-900">Implants Entry Table</h3>
                        <p className="text-xs text-slate-500">Enter Sr No, Name of Implants, and Amount. Click Preview to inspect the formatted table.</p>
                      </div>
                      <div className="flex flex-wrap items-center gap-2">
                        <button type="button" onClick={handleAddImplantRow} className="inline-flex h-8 items-center gap-1.5 rounded-md border border-teal-700/30 bg-teal-50 px-3 text-xs font-semibold text-teal-900 hover:bg-teal-100 whitespace-nowrap">
                          <Plus className="h-3.5 w-3.5" aria-hidden="true" /> Add Row
                        </button>
                        <button type="button" onClick={() => setIsCalculatorOpen(true)} className="inline-flex h-8 items-center gap-1.5 rounded-md bg-teal-700 px-3 text-xs font-semibold text-white hover:bg-teal-800 whitespace-nowrap">
                          <Calculator className="h-3.5 w-3.5" aria-hidden="true" /> Invoice Calculator
                        </button>
                      </div>
                    </div>
                    <div className="overflow-x-auto rounded-lg border border-slate-200">
                      <table className="w-full border-collapse text-left text-xs">
                        <thead>
                          <tr className="border-b border-slate-200 bg-slate-50 text-slate-700">
                            <th className="w-20 px-3 py-2.5 font-semibold">Sr No</th>
                            <th className="px-3 py-2.5 font-semibold">Name of Implants</th>
                            <th className="w-36 px-3 py-2.5 text-right font-semibold">Amount (₹)</th>
                            <th className="w-12 px-2 py-2.5 text-center font-semibold">Del</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-200 bg-white">
                          {implantsDraft.map((row, idx) => (
                            <tr key={row.id}>
                              <td className="px-2 py-2">
                                <input type="text" value={row.srNo} onChange={(e) => handleUpdateImplantRow(row.id, 'srNo', e.target.value)} placeholder={String(idx + 1)} className="h-8 w-full rounded border border-slate-300 px-2 font-mono text-xs text-slate-900 tabular-nums focus:border-teal-700 focus:outline-none" />
                              </td>
                              <td className="px-2 py-2">
                                <input type="text" value={row.name} onChange={(e) => handleUpdateImplantRow(row.id, 'name', e.target.value)} placeholder="Enter implant / stent / prosthesis name..." className="h-8 w-full rounded border border-slate-300 px-2.5 text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none" />
                              </td>
                              <td className="px-2 py-2">
                                <input type="number" min="0" step="0.01" value={row.amount} onChange={(e) => handleUpdateImplantRow(row.id, 'amount', e.target.value)} placeholder="0.00" className="h-8 w-full rounded border border-slate-300 px-2.5 text-right font-mono text-xs text-slate-900 tabular-nums placeholder:text-slate-400 focus:border-teal-700 focus:outline-none" />
                              </td>
                              <td className="px-2 py-2 text-center">
                                <button type="button" onClick={() => handleRemoveImplantRow(row.id)} aria-label={`Remove implant row ${idx + 1}`} className="inline-flex h-8 w-8 items-center justify-center rounded text-slate-500 hover:bg-red-50 hover:text-red-700">
                                  <Trash2 className="h-3.5 w-3.5" aria-hidden="true" />
                                </button>
                              </td>
                            </tr>
                          ))}
                        </tbody>
                        <tfoot>
                          <tr className="border-t border-slate-200 bg-slate-50 font-semibold text-slate-900">
                            <td colSpan={2} className="px-3 py-2.5 text-right text-xs">Total Implants Amount</td>
                            <td className="px-3 py-2.5 text-right font-mono text-xs tabular-nums text-teal-800">₹{formatCurrencyValue(implantsTotal)}</td>
                            <td />
                          </tr>
                        </tfoot>
                      </table>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-5">
                    {remarkDraft.trim() ? (
                      <div className="rounded-lg border border-slate-200 bg-slate-50/70 p-4">
                        <div className="text-[11px] font-semibold uppercase tracking-wide text-slate-500">Remark</div>
                        <p className="mt-1 whitespace-pre-wrap text-sm text-slate-900">{remarkDraft.trim()}</p>
                      </div>
                    ) : null}
                    <div>
                      <div className="mb-2 flex items-center justify-between">
                        <h3 className="text-sm font-semibold text-slate-900">Implants Table Preview</h3>
                        <span className="font-mono text-xs font-medium text-slate-500 tabular-nums">{activeImplants.length} {activeImplants.length === 1 ? 'Item' : 'Items'}</span>
                      </div>
                      {activeImplants.length > 0 ? (
                        <div className="overflow-x-auto rounded-lg border border-slate-300">
                          <table className="w-full border-collapse text-left text-sm">
                            <thead>
                              <tr className="border-b border-slate-300 bg-slate-100 text-xs font-semibold text-slate-800">
                                <th className="w-20 border-r border-slate-300 px-3.5 py-2.5 text-center">Sr No</th>
                                <th className="border-r border-slate-300 px-3.5 py-2.5">Name of Implants</th>
                                <th className="w-40 px-3.5 py-2.5 text-right">Amount</th>
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-200 bg-white">
                              {activeImplants.map((row, idx) => (
                                <tr key={row.id}>
                                  <td className="border-r border-slate-200 px-3.5 py-2 text-center font-mono text-xs text-slate-700 tabular-nums">{row.srNo.trim() || idx + 1}</td>
                                  <td className="border-r border-slate-200 px-3.5 py-2 text-sm font-medium text-slate-900">{row.name.trim() || '—'}</td>
                                  <td className="px-3.5 py-2 text-right font-mono text-sm font-semibold text-slate-900 tabular-nums">{row.amount.trim() ? `₹${formatCurrencyValue(row.amount)}` : '—'}</td>
                                </tr>
                              ))}
                            </tbody>
                            <tfoot>
                              <tr className="border-t-2 border-slate-300 bg-slate-50 font-semibold text-slate-900">
                                <td colSpan={2} className="border-r border-slate-300 px-3.5 py-2.5 text-right text-xs uppercase tracking-wide">Total Amount</td>
                                <td className="px-3.5 py-2.5 text-right font-mono text-sm font-bold text-teal-800 tabular-nums">₹{formatCurrencyValue(implantsTotal)}</td>
                              </tr>
                            </tfoot>
                          </table>
                        </div>
                      ) : (
                        <div className="rounded-lg border border-dashed border-slate-300 bg-slate-50 px-4 py-6 text-center text-xs text-slate-500">
                          No implants entered yet. Click <strong>Implants</strong> above to add Sr No, Name of Implants, and Amount.
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>

              <div className="flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-slate-50 px-6 py-3.5">
                <div className="flex items-center gap-2">
                  {mode !== 'preview' ? (
                    <button type="button" onClick={handleSaveAndPreview} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-teal-700/30 bg-white px-3.5 text-xs font-semibold text-teal-800 hover:bg-teal-50">
                      <Eye className="h-3.5 w-3.5" aria-hidden="true" /> Preview Table
                    </button>
                  ) : (
                    <button type="button" onClick={() => setMode('implants')} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3.5 text-xs font-medium text-slate-700 hover:bg-slate-100">
                      Edit Implants
                    </button>
                  )}
                </div>
                <div className="flex items-center gap-2">
                  <button type="button" onClick={onClose} className="inline-flex h-9 items-center rounded-lg border border-slate-300 bg-white px-4 text-xs font-medium text-slate-700 hover:bg-slate-100">Cancel</button>
                  <button type="button" onClick={handleSaveAndClose} className="inline-flex h-9 items-center rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white hover:bg-teal-800">Save &amp; Apply</button>
                </div>
              </div>
            </div>
            <InvoiceCalculatorModal isOpen={isCalculatorOpen} onClose={() => setIsCalculatorOpen(false)} onUseTotalInImplants={handleUseCalculatorTotal} />
          </div>
        );
      }


      // =========================================================================
      // COMPONENTS: VIEW MODAL, EXTENSION ALERT & PRINTABLE DOCUMENT MODALS
      // =========================================================================
      function ViewRecordModal({ record, columns, nowMs, onClose, onEdit, onSendExtension }) {
        useEffect(() => {
          if (!record) return;
          const handleKey = (e) => { if (e.key === 'Escape') onClose(); };
          window.addEventListener('keydown', handleKey);
          return () => window.removeEventListener('keydown', handleKey);
        }, [record, onClose]);

        if (!record) return null;

        const duration = calculateAdmissionDuration(record.doa, record.doaTime, nowMs);
        const approvedDays = calculateApprovedExtensionDays(record.doa, record.extensionApprovedUpTo);

        const formatField = (col) => {
          const raw = (record[col.key] ?? '').trim();
          if (!raw) return '—';
          if (col.inputType === 'number' && (col.key === 'finalBill' || col.key === 'settledAmount' || col.key === 'deductionAmount')) {
            return `₹${formatCurrencyValue(raw)}`;
          }
          if (col.inputType === 'date') return formatDisplayDate(raw);
          return raw;
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/50 p-4 backdrop-blur-[1px]" role="dialog" aria-modal="true" aria-labelledby="view-record-title" onClick={(e) => { if (e.target === e.currentTarget) onClose(); }}>
            <div className="flex max-h-[90vh] w-full max-w-4xl flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-xl">
              <div className="flex flex-wrap items-start justify-between gap-4 border-b border-slate-200 px-6 py-4">
                <div>
                  <h2 id="view-record-title" className="font-display text-lg font-bold text-slate-900">{record.patientName || 'Patient Claim Record'}</h2>
                  <div className="mt-1 flex flex-wrap items-center gap-2 text-xs text-slate-500">
                    <span className="font-mono">SR NO {record.srNo || '—'}</span>
                    <span aria-hidden="true">·</span>
                    <span className="font-mono">{record.claimId || 'No Claim ID'}</span>
                    <span aria-hidden="true">·</span>
                    <span>{record.status || 'No Status'}</span>
                    {record.areaName ? (<><span aria-hidden="true">·</span><span>{record.areaName}</span></>) : null}
                  </div>
                </div>
                <button type="button" onClick={onClose} aria-label="Close details" className="inline-flex h-9 w-9 items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 hover:text-slate-900">
                  <X className="h-4 w-4" aria-hidden="true" />
                </button>
              </div>

              <div className="grid grid-cols-1 divide-y divide-slate-200 border-b border-slate-200 bg-slate-50 sm:grid-cols-3 sm:divide-x sm:divide-y-0">
                <div className="px-6 py-3">
                  <div className="text-[11px] font-medium text-slate-500">Elapsed Since Admission</div>
                  <div className="mt-0.5 flex items-center gap-1.5 font-mono text-sm font-semibold text-slate-900 tabular-nums">
                    <Clock className="h-3.5 w-3.5 text-teal-700" aria-hidden="true" />
                    <span>{duration.valid ? duration.formatted : 'No DOA set'}</span>
                  </div>
                  {duration.valid && duration.isExtensionDue && !record.dod ? (
                    <div className="mt-0.5 text-[11px] font-medium text-amber-700">3+ days elapsed since admission</div>
                  ) : null}
                </div>
                <div className="px-6 py-3">
                  <div className="text-[11px] font-medium text-slate-500">Approved Extension Duration</div>
                  <div className="mt-0.5 font-mono text-sm font-semibold text-teal-800 tabular-nums">
                    {approvedDays !== null ? `${approvedDays} ${approvedDays === 1 ? 'day' : 'days'} granted` : 'Not approved yet'}
                  </div>
                  {record.extensionApprovedUpTo ? (
                    <div className="mt-0.5 text-[11px] text-slate-500">Valid up to {formatDisplayDate(record.extensionApprovedUpTo)}</div>
                  ) : null}
                </div>
                <div className="px-6 py-3">
                  <div className="text-[11px] font-medium text-slate-500">Billing Summary</div>
                  <div className="mt-0.5 font-mono text-sm font-semibold text-slate-900 tabular-nums">Final ₹{formatCurrencyValue(record.finalBill || 0)}</div>
                  <div className="mt-0.5 font-mono text-[11px] text-slate-500 tabular-nums">
                    Settled ₹{formatCurrencyValue(record.settledAmount || 0)} · Deduction ₹{formatCurrencyValue(record.deductionAmount || 0)}
                  </div>
                </div>
              </div>

              <div className="register-scroll flex-1 overflow-y-auto divide-y divide-slate-200 px-6">
                {SECTION_DEFINITIONS.map((section) => {
                  const sectionCols = columns.filter((col) => col.group === section.group);
                  if (sectionCols.length === 0) return null;
                  return (
                    <div key={section.group} className="py-5">
                      <h3 className="text-sm font-semibold text-slate-900">{section.title}</h3>
                      <dl className="mt-3 grid grid-cols-1 gap-x-6 gap-y-3 sm:grid-cols-2 lg:grid-cols-3">
                        {sectionCols.map((col) => {
                          const isRemarkImplants = col.key === 'remarkAndImplants';
                          const implants = isRemarkImplants ? parseImplantRows(record.admissionImplantsJson) : [];
                          const savedRemark = isRemarkImplants ? (record.admissionRemark ?? '').trim() : '';
                          const implantsTotal = implants.reduce((sum, row) => sum + parseNumericAmount(row.amount), 0);
                          return (
                            <div key={col.key} className={col.key === 'address' || col.key === 'diagnosis' || isRemarkImplants ? 'sm:col-span-2 lg:col-span-3' : ''}>
                              <dt className="text-[11px] font-medium text-slate-500">
                                {col.header}{col.formContext ? ` (${col.formContext})` : ''}
                              </dt>
                              {isRemarkImplants && (savedRemark || implants.length > 0) ? (
                                <dd className="mt-1.5 space-y-3">
                                  {savedRemark ? (
                                    <div className="rounded-lg border border-slate-200 bg-slate-50 px-3.5 py-2.5 text-sm text-slate-900">
                                      <span className="font-semibold text-slate-700">Remark: </span>{savedRemark}
                                    </div>
                                  ) : null}
                                  {implants.length > 0 ? (
                                    <div className="overflow-x-auto rounded-lg border border-slate-200">
                                      <table className="w-full border-collapse text-left text-xs">
                                        <thead>
                                          <tr className="border-b border-slate-200 bg-slate-100 text-slate-700">
                                            <th className="w-16 border-r border-slate-200 px-3 py-2 text-center font-semibold">Sr No</th>
                                            <th className="border-r border-slate-200 px-3 py-2 font-semibold">Name of Implants</th>
                                            <th className="w-36 px-3 py-2 text-right font-semibold">Amount</th>
                                          </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-200 bg-white">
                                          {implants.map((row, idx) => (
                                            <tr key={row.id}>
                                              <td className="border-r border-slate-200 px-3 py-1.5 text-center font-mono text-slate-700 tabular-nums">{row.srNo.trim() || idx + 1}</td>
                                              <td className="border-r border-slate-200 px-3 py-1.5 font-medium text-slate-900">{row.name.trim() || '—'}</td>
                                              <td className="px-3 py-1.5 text-right font-mono font-semibold text-slate-900 tabular-nums">{row.amount.trim() ? `₹${formatCurrencyValue(row.amount)}` : '—'}</td>
                                            </tr>
                                          ))}
                                        </tbody>
                                        <tfoot>
                                          <tr className="border-t border-slate-300 bg-slate-50 font-semibold text-slate-900">
                                            <td colSpan={2} className="border-r border-slate-200 px-3 py-2 text-right">Total Implants Amount</td>
                                            <td className="px-3 py-2 text-right font-mono text-teal-800 tabular-nums">₹{formatCurrencyValue(implantsTotal)}</td>
                                          </tr>
                                        </tfoot>
                                      </table>
                                    </div>
                                  ) : null}
                                </dd>
                              ) : (
                                <dd className={`mt-0.5 text-sm text-slate-900 break-words ${col.mono ? 'font-mono tabular-nums text-[13px]' : ''}`}>
                                  {formatField(col)}
                                </dd>
                              )}
                            </div>
                          );
                        })}
                      </dl>
                    </div>
                  );
                })}
              </div>

              <div className="no-print flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-slate-50 px-6 py-3.5">
                <div className="flex flex-wrap items-center gap-2">
                  <button type="button" onClick={() => onSendExtension(record)} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-amber-300 bg-amber-50 px-3.5 text-xs font-semibold text-amber-900 hover:bg-amber-100 whitespace-nowrap">
                    <Send className="h-3.5 w-3.5" aria-hidden="true" /> Send Extension / Approved Date
                  </button>
                  <button type="button" onClick={() => window.print()} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3.5 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap">
                    <Printer className="h-3.5 w-3.5" aria-hidden="true" /> Print
                  </button>
                </div>
                <div className="flex items-center gap-2">
                  <button type="button" onClick={() => { onClose(); onEdit(record); }} className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white hover:bg-teal-800 whitespace-nowrap">
                    <Pencil className="h-3.5 w-3.5" aria-hidden="true" /> Edit Record
                  </button>
                  <button type="button" onClick={onClose} className="inline-flex h-9 items-center rounded-lg border border-slate-300 bg-white px-4 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap">Close</button>
                </div>
              </div>
            </div>
          </div>
        );
      }

      function ExtensionAlertModal({ isOpen, dueRecords, nowMs, initialPromptRecordId = null, onApproveExtension, onSnoozeThreeHours, onClose }) {
        const [activeSendId, setActiveSendId] = useState(initialPromptRecordId);
        const [approvedDateMap, setApprovedDateMap] = useState({});
        const [sendDateMap, setSendDateMap] = useState({});
        const [errorMsg, setErrorMsg] = useState(null);
        const [recentApprovalSummary, setRecentApprovalSummary] = useState(null);

        useEffect(() => {
          if (initialPromptRecordId) setActiveSendId(initialPromptRecordId);
        }, [initialPromptRecordId, isOpen]);

        if (!isOpen) return null;

        const handleOpenSendPrompt = (record) => {
          setErrorMsg(null);
          setActiveSendId(record.id);
          if (!sendDateMap[record.id]) {
            setSendDateMap((prev) => ({ ...prev, [record.id]: record.extensionDateSned || getTodayIso() }));
          }
          if (!approvedDateMap[record.id] && record.extensionApprovedUpTo) {
            setApprovedDateMap((prev) => ({ ...prev, [record.id]: record.extensionApprovedUpTo }));
          }
        };

        const handleConfirmSend = (record) => {
          const approvedDate = (approvedDateMap[record.id] || '').trim();
          const sendDate = (sendDateMap[record.id] || getTodayIso()).trim();
          if (!approvedDate) {
            setErrorMsg('Please select an Approved Date (validity end date) before confirming.');
            return;
          }
          const totalDays = calculateApprovedExtensionDays(record.doa, approvedDate);
          if (totalDays === null) {
            setErrorMsg('Approved Date must be on or after the Date of Admission (DOA).');
            return;
          }
          setErrorMsg(null);
          onApproveExtension(record.id, approvedDate, sendDate, totalDays);
          setRecentApprovalSummary({
            patientName: record.patientName || record.claimId || `SR NO ${record.srNo}`,
            doa: record.doa,
            approvedDate,
            days: totalDays,
          });
          setActiveSendId(null);
        };

        return (
          <div className="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/55 p-4 backdrop-blur-[1px]" role="dialog" aria-modal="true" aria-labelledby="extension-alert-heading">
            <div className="flex max-h-[88vh] w-full max-w-2xl flex-col overflow-hidden rounded-xl border border-slate-200 bg-white shadow-2xl">
              <div className="flex items-start justify-between gap-4 border-b border-amber-200 bg-amber-50/70 px-6 py-4">
                <div className="flex items-start gap-3">
                  <div className="mt-0.5 flex h-9 w-9 shrink-0 items-center justify-center rounded-lg bg-amber-100 text-amber-800">
                    <AlertTriangle className="h-5 w-5" aria-hidden="true" />
                  </div>
                  <div>
                    <h2 id="extension-alert-heading" className="font-display text-base font-bold text-slate-900">Patient requires an extension</h2>
                    <p className="mt-0.5 text-xs text-slate-600">More than 3 days (72 hours) have elapsed since Date &amp; Time of Admission · Alert repeats every 3 hours until approved</p>
                  </div>
                </div>
                <button type="button" onClick={onClose} aria-label="Close extension alert" className="inline-flex h-8 w-8 items-center justify-center rounded-lg text-slate-500 hover:bg-amber-100/70 hover:text-slate-900">
                  <X className="h-4 w-4" aria-hidden="true" />
                </button>
              </div>

              {recentApprovalSummary ? (
                <div className="border-b border-emerald-200 bg-emerald-50 px-6 py-3 text-xs text-emerald-900">
                  <div className="flex items-center gap-2 font-semibold">
                    <Check className="h-4 w-4 text-emerald-700" aria-hidden="true" />
                    <span>
                      Extension approved for {recentApprovalSummary.patientName} — Total Approval Granted:{' '}
                      <span className="font-mono tabular-nums">{recentApprovalSummary.days} {recentApprovalSummary.days === 1 ? 'day' : 'days'}</span>
                    </span>
                  </div>
                  <p className="mt-0.5 text-emerald-800">
                    DOA {formatDisplayDate(recentApprovalSummary.doa)} to Approved Date {formatDisplayDate(recentApprovalSummary.approvedDate)} saved to register.
                  </p>
                </div>
              ) : null}

              {errorMsg ? (
                <div role="alert" className="border-b border-red-200 bg-red-50 px-6 py-2.5 text-xs font-medium text-red-800">{errorMsg}</div>
              ) : null}

              <div className="register-scroll flex-1 overflow-y-auto divide-y divide-slate-200">
                {dueRecords.length === 0 ? (
                  <div className="px-6 py-10 text-center">
                    <p className="text-sm font-semibold text-slate-900">All extension alerts have been addressed</p>
                    <p className="mt-1 text-xs text-slate-500">No active admitted patients currently exceed 3 days without an approved extension date.</p>
                  </div>
                ) : (
                  dueRecords.map((record) => {
                    const duration = calculateAdmissionDuration(record.doa, record.doaTime, nowMs);
                    const isPromptOpen = activeSendId === record.id;
                    const enteredApprovedDate = approvedDateMap[record.id] || '';
                    const enteredSendDate = sendDateMap[record.id] || getTodayIso();
                    const previewDays = enteredApprovedDate ? calculateApprovedExtensionDays(record.doa, enteredApprovedDate) : null;
                    return (
                      <div key={record.id} className="px-6 py-4">
                        <div className="flex flex-wrap items-start justify-between gap-4">
                          <div className="space-y-1">
                            <div className="text-sm font-semibold text-slate-900">{record.patientName || 'Unnamed Patient'}</div>
                            <div className="flex flex-wrap items-center gap-2 text-xs text-slate-600">
                              <span className="inline-flex items-center gap-1 font-mono tabular-nums">
                                <Calendar className="h-3.5 w-3.5 text-slate-400" aria-hidden="true" />
                                DOA: {formatDisplayDate(record.doa)}{record.doaTime ? ` at ${record.doaTime}` : ''}
                              </span>
                              <span aria-hidden="true">·</span>
                              <span className="inline-flex items-center gap-1 font-mono font-semibold text-amber-800 tabular-nums">
                                <Clock className="h-3.5 w-3.5" aria-hidden="true" /> Elapsed: {duration.formatted}
                              </span>
                            </div>
                            <div className="flex flex-wrap items-center gap-2 text-xs text-slate-500">
                              <span>Claim ID: {record.claimId || '—'}</span>
                              <span aria-hidden="true">·</span>
                              <span>Admission Type: {record.admissionType || '—'}</span>
                              <span aria-hidden="true">·</span>
                              <span>Status: {record.status || 'Admitted'}</span>
                            </div>
                          </div>
                          {!isPromptOpen ? (
                            <button type="button" onClick={() => handleOpenSendPrompt(record)} className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white hover:bg-teal-800 whitespace-nowrap shrink-0">
                              <Send className="h-3.5 w-3.5" aria-hidden="true" /> Send
                            </button>
                          ) : null}
                        </div>

                        {isPromptOpen ? (
                          <div className="mt-4 rounded-lg border border-slate-200 bg-slate-50 p-4">
                            <div className="text-xs font-semibold text-slate-900">Enter Extension Approved Date (Validity End Date)</div>
                            <div className="mt-3 grid grid-cols-1 gap-3 sm:grid-cols-2">
                              <div className="flex flex-col gap-1">
                                <label htmlFor={`ext-send-${record.id}`} className="text-[11px] font-medium text-slate-600">Extension date ( SNED )</label>
                                <input id={`ext-send-${record.id}`} type="date" value={enteredSendDate} onChange={(e) => setSendDateMap((prev) => ({ ...prev, [record.id]: e.target.value }))} className="h-9 rounded-lg border border-slate-300 bg-white px-3 font-mono text-xs text-slate-900 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15" />
                              </div>
                              <div className="flex flex-col gap-1">
                                <label htmlFor={`ext-approved-${record.id}`} className="text-[11px] font-semibold text-slate-700">Approved Date (Validity End Date) *</label>
                                <input id={`ext-approved-${record.id}`} type="date" min={record.doa || undefined} value={enteredApprovedDate} onChange={(e) => { setErrorMsg(null); setApprovedDateMap((prev) => ({ ...prev, [record.id]: e.target.value })); }} className="h-9 rounded-lg border border-slate-300 bg-white px-3 font-mono text-xs text-slate-900 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15" />
                              </div>
                            </div>
                            <div className="mt-3 flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 pt-3">
                              <div className="text-xs">
                                {enteredApprovedDate ? (
                                  previewDays !== null ? (
                                    <span className="font-semibold text-teal-800">
                                      Approval Granted: <span className="font-mono tabular-nums">{previewDays} {previewDays === 1 ? 'day' : 'days'}</span>{' '}
                                      <span className="font-normal text-slate-600">(DOA {formatDisplayDate(record.doa)} to {formatDisplayDate(enteredApprovedDate)})</span>
                                    </span>
                                  ) : (
                                    <span className="font-medium text-red-700">Approved Date cannot be earlier than DOA ({formatDisplayDate(record.doa)}).</span>
                                  )
                                ) : (
                                  <span className="text-slate-500">Select an Approved Date to calculate total granted approval days.</span>
                                )}
                              </div>
                              <div className="flex items-center gap-2">
                                <button type="button" onClick={() => { setActiveSendId(null); setErrorMsg(null); }} className="inline-flex h-8 items-center rounded-md border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 hover:bg-slate-100">Cancel</button>
                                <button type="button" onClick={() => handleConfirmSend(record)} className="inline-flex h-8 items-center gap-1.5 rounded-md bg-teal-700 px-3.5 text-xs font-semibold text-white hover:bg-teal-800">
                                  <Check className="h-3.5 w-3.5" aria-hidden="true" /> Save Approval
                                </button>
                              </div>
                            </div>
                          </div>
                        ) : null}
                      </div>
                    );
                  })
                )}
              </div>

              <div className="flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-slate-50 px-6 py-3.5">
