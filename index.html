    <script type="module">
      window.__ESIC_FIREBASE_CONFIG__ = {
        projectId: "keen-buffer-cwpgt",
        appId: "1:978329399959:web:f66d75c26cfa742d046fd2",
        apiKey: "AIzaSyBX-_8m7KNUYBXFpgMP4XXGOmLAo_QE1fI",
        authDomain: "keen-buffer-cwpgt.firebaseapp.com",
        firestoreDatabaseId: "ai-studio-esicclaimregiste-f6783326-fa9b-4caa-86b9-76ce38704e45",
        storageBucket: "keen-buffer-cwpgt.firebasestorage.app",
        messagingSenderId: "978329399959",
        measurementId: ""
      };

      const FIREBASE_MAX_WEB_APP_URL_LENGTH = 2048;
      const FIREBASE_MAX_SHEET_NAME_LENGTH = 120;
      const FIREBASE_MAX_NOTE_LABEL_LENGTH = 120;
      const FIREBASE_MAX_NOTE_CONTENT_LENGTH = 20000;
      const SAFE_ID_PATTERN = /^[a-zA-Z0-9_-]+$/;

      function createOfflineBridge() {
        return {
          available: false,
          subscribeAuth(cb) {
            cb(null);
            return () => {};
          },
          async signInWithGoogle() {
            throw new Error(
              window.location.protocol === "file:"
                ? "Google Sign-In requires running over https:// or http://localhost. Local browser storage is active."
                : "Firebase cloud sync is offline. Local browser storage is active."
            );
          },
          async signOutFirebase() {},
          async saveGoogleSyncSettingsToCloud() {},
          subscribeGoogleSyncSettings(_uid, onData) {
            onData(null);
            return () => {};
          },
          async addPermanentNoteToCloud(_uid, _label, _content, customId) {
            return customId || `note_${Date.now()}`;
          },
          async updatePermanentNoteInCloud() {},
          async deletePermanentNoteFromCloud() {},
          subscribePermanentNotes(_uid, onData) {
            onData([]);
            return () => {};
          },
        };
      }

      window.__ESIC_CLOUD_BRIDGE__ = createOfflineBridge();

      async function initCloudBridge() {
        if (window.location.protocol === "file:" || !navigator.onLine) return;
        try {
          const [appMod, authMod, fsMod] = await Promise.all([
            import("https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js"),
            import("https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js"),
            import("https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js"),
          ]);
          const cfg = window.__ESIC_FIREBASE_CONFIG__;
          const app = appMod.initializeApp(cfg);
          const db = fsMod.getFirestore(app, cfg.firestoreDatabaseId);
          const auth = authMod.getAuth(app);
          const googleProvider = new authMod.GoogleAuthProvider();

          const timestampToIso = (val) => {
            if (val && typeof val.toDate === "function") return val.toDate().toISOString();
            if (typeof val === "string" && val) return val;
            return new Date().toISOString();
          };

          const bridge = {
            available: true,
            subscribeAuth(cb) {
              return authMod.onAuthStateChanged(auth, cb);
            },
            signInWithGoogle() {
              return authMod.signInWithPopup(auth, googleProvider).then((cred) => cred.user);
            },
            signOutFirebase() {
              return authMod.signOut(auth);
            },
            async saveGoogleSyncSettingsToCloud(uid, webAppUrl, sheetName) {
              const cleanUrl = String(webAppUrl || "").trim().slice(0, FIREBASE_MAX_WEB_APP_URL_LENGTH);
              const cleanSheet = (String(sheetName || "").trim() || "ESIC_Claims_Register").slice(0, FIREBASE_MAX_SHEET_NAME_LENGTH);
              const ref = fsMod.doc(db, "users", uid, "settings", "googleSync");
              const snap = await fsMod.getDoc(ref);
              if (snap.exists()) {
                await fsMod.updateDoc(ref, {
                  webAppUrl: cleanUrl,
                  sheetName: cleanSheet,
                  updatedAt: fsMod.serverTimestamp(),
                });
              } else {
                await fsMod.setDoc(ref, {
                  ownerId: uid,
                  webAppUrl: cleanUrl,
                  sheetName: cleanSheet,
                  createdAt: fsMod.serverTimestamp(),
                  updatedAt: fsMod.serverTimestamp(),
                });
              }
            },
            subscribeGoogleSyncSettings(uid, onData, onError) {
              const ref = fsMod.doc(db, "users", uid, "settings", "googleSync");
              return fsMod.onSnapshot(
                ref,
                (snapshot) => {
                  if (!snapshot.exists()) {
                    onData(null);
                    return;
                  }
                  const data = snapshot.data();
                  onData({
                    webAppUrl: typeof data.webAppUrl === "string" ? data.webAppUrl : "",
                    sheetName:
                      typeof data.sheetName === "string" && data.sheetName
                        ? data.sheetName
                        : "ESIC_Claims_Register",
                    updatedAtIso: timestampToIso(data.updatedAt),
                  });
                },
                (err) => {
                  if (onError) onError(err);
                }
              );
            },
            async addPermanentNoteToCloud(uid, label, content, customId) {
              const cleanLabel = String(label || "").trim().slice(0, FIREBASE_MAX_NOTE_LABEL_LENGTH);
              const cleanContent = String(content || "").trim().slice(0, FIREBASE_MAX_NOTE_CONTENT_LENGTH);
              if (!cleanContent) throw new Error("Note content cannot be empty.");
              const rawId =
                customId && SAFE_ID_PATTERN.test(customId)
                  ? customId.slice(0, 128)
                  : `note_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
              const ref = fsMod.doc(db, "users", uid, "notes", rawId);
              await fsMod.setDoc(ref, {
                ownerId: uid,
                label: cleanLabel,
                content: cleanContent,
                createdAt: fsMod.serverTimestamp(),
                updatedAt: fsMod.serverTimestamp(),
              });
              return rawId;
            },
            async updatePermanentNoteInCloud(uid, noteId, label, content) {
              const cleanLabel = String(label || "").trim().slice(0, FIREBASE_MAX_NOTE_LABEL_LENGTH);
              const cleanContent = String(content || "").trim().slice(0, FIREBASE_MAX_NOTE_CONTENT_LENGTH);
              if (!cleanContent) throw new Error("Note content cannot be empty.");
              const ref = fsMod.doc(db, "users", uid, "notes", noteId);
              await fsMod.updateDoc(ref, {
                label: cleanLabel,
                content: cleanContent,
                updatedAt: fsMod.serverTimestamp(),
              });
            },
            async deletePermanentNoteFromCloud(uid, noteId) {
              const ref = fsMod.doc(db, "users", uid, "notes", noteId);
              await fsMod.deleteDoc(ref);
            },
            subscribePermanentNotes(uid, onData, onError) {
              const q = fsMod.query(
                fsMod.collection(db, "users", uid, "notes"),
                fsMod.where("ownerId", "==", uid)
              );
              return fsMod.onSnapshot(
                q,
                (snapshot) => {
                  const items = snapshot.docs.map((docSnap) => {
                    const data = docSnap.data();
                    return {
                      id: docSnap.id,
                      label: typeof data.label === "string" ? data.label : "",
                      content: typeof data.content === "string" ? data.content : "",
                      createdAtIso: timestampToIso(data.createdAt),
                      updatedAtIso: timestampToIso(data.updatedAt),
                      source: "cloud",
                    };
                  });
                  items.sort((a, b) => b.createdAtIso.localeCompare(a.createdAtIso));
                  onData(items);
                },
                (err) => {
                  if (onError) onError(err);
                }
              );
            },
          };

          window.__ESIC_CLOUD_BRIDGE__ = bridge;
          window.dispatchEvent(new CustomEvent("esic-cloud-ready"));
        } catch (err) {
          console.warn("Firebase CDN unavailable; continuing with local browser storage.", err);
        }
      }

      initCloudBridge();
    </script>

      function calculateAgeFromDob(dob) {
        if (!dob) return '';
        const birth = new Date(dob);
        if (Number.isNaN(birth.getTime())) return '';
        const today = new Date();
        let years = today.getFullYear() - birth.getFullYear();
        const monthDiff = today.getMonth() - birth.getMonth();
        if (monthDiff < 0 || (monthDiff === 0 && today.getDate() < birth.getDate())) {
          years -= 1;
        }
        if (years < 0) return '';
        return String(years);
      }

      function parseNumericAmount(value) {
        const cleaned = String(value ?? '').replace(/[^0-9.-]/g, '');
        const parsed = Number.parseFloat(cleaned);
        return Number.isFinite(parsed) ? parsed : 0;
      }

      function formatCurrencyValue(value) {
        const num = typeof value === 'number' ? value : parseNumericAmount(value);
        if (typeof value === 'string' && value.trim() === '') return '—';
        return new Intl.NumberFormat('en-IN', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2,
        }).format(num);
      }

      function parseImplantRows(jsonStr) {
        if (!jsonStr || !jsonStr.trim()) return [];
        try {
          const parsed = JSON.parse(jsonStr);
          if (!Array.isArray(parsed)) return [];
          return parsed
            .filter((item) => item && typeof item === 'object')
            .map((item, idx) => ({
              id: typeof item.id === 'string' && item.id ? item.id : `imp-${idx + 1}`,
              srNo: typeof item.srNo === 'string' ? item.srNo : String(idx + 1),
              name: typeof item.name === 'string' ? item.name : '',
              amount: typeof item.amount === 'string' ? item.amount : '',
            }));
        } catch {
          return [];
        }
      }

      function serializeImplantRows(rows) {
        const cleaned = rows
          .filter((r) => r.name.trim() !== '' || r.amount.trim() !== '')
          .map((r, idx) => ({
            id: r.id || `imp-${idx + 1}`,
            srNo: r.srNo.trim() || String(idx + 1),
            name: r.name.trim(),
            amount: r.amount.trim(),
          }));
        return cleaned.length > 0 ? JSON.stringify(cleaned) : '';
      }

      function formatRemarkAndImplantsSummary(remark, implants) {
        const parts = [];
        const cleanRemark = (remark ?? '').trim();
        if (cleanRemark) {
          parts.push(`Remark: ${cleanRemark}`);
        }
        const activeImplants = implants.filter((r) => r.name.trim() !== '' || r.amount.trim() !== '');
        if (activeImplants.length > 0) {
          const total = activeImplants.reduce((sum, r) => sum + parseNumericAmount(r.amount), 0);
          const itemsList = activeImplants
            .map((r, idx) => {
              const sr = r.srNo.trim() || String(idx + 1);
              const amtText = r.amount.trim() ? ` (₹${formatCurrencyValue(r.amount)})` : '';
              return `${sr}. ${r.name.trim() || 'Implant'}${amtText}`;
            })
            .join(', ');
          parts.push(`Implants (${activeImplants.length}): ${itemsList} | Total: ₹${formatCurrencyValue(total)}`);
        }
        return parts.join(' | ');
      }

        if (!isoDate) return '—';
        const match = /^(\d{4})-(\d{2})-(\d{2})$/.exec(isoDate.trim());

        return `${match[3]}-${match[2]}-${match[1]}`;

      function normalizeDateInputValue(value) {
        const text = String(value ?? '').trim();
        if (!text) return '';

        let year;
        let month;
        let day;
        let match = /^(\d{4})-(\d{2})-(\d{2})(?:T.*)?$/.exec(text);
        if (match) {
          [, year, month, day] = match;
        } else {
          match = /^(\d{1,2})[./-](\d{1,2})[./-](\d{4})$/.exec(text);
          if (match) {
            [, day, month, year] = match;
          } else {
            match = /^(\d{4})[./](\d{1,2})[./](\d{1,2})$/.exec(text);
            if (!match) return '';
            [, year, month, day] = match;
          }
        }

        const date = new Date(Number(year), Number(month) - 1, Number(day));
        if (
          date.getFullYear() !== Number(year) ||
          date.getMonth() !== Number(month) - 1 ||
          date.getDate() !== Number(day)
        ) {
          return '';
        }
        return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
      }

      const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
      const THREE_HOURS_MS = 3 * 60 * 60 * 1000;

      function parseLocalDateTime(dateStr, timeStr) {
        if (!dateStr || !dateStr.trim()) return null;
        const dateMatch = /^(\d{4})-(\d{2})-(\d{2})$/.exec(dateStr.trim());
        if (!dateMatch) {
          const fallback = new Date(dateStr);
          return Number.isNaN(fallback.getTime()) ? null : fallback;
        }
        const year = Number(dateMatch[1]);
        const month = Number(dateMatch[2]) - 1;
        const day = Number(dateMatch[3]);
        let hours = 0;
        let minutes = 0;
        if (timeStr && timeStr.trim()) {
          const timeMatch = /^(\d{1,2}):(\d{2})/.exec(timeStr.trim());
          if (timeMatch) {
            hours = Number(timeMatch[1]);
            minutes = Number(timeMatch[2]);
          }
        }
        return new Date(year, month, day, hours, minutes, 0, 0);
      }

      function calculateAdmissionDuration(doa, doaTime, nowMs = Date.now()) {
        const start = parseLocalDateTime(doa, doaTime);
        if (!start) {
          return { valid: false, totalMs: 0, days: 0, hours: 0, minutes: 0, formatted: '—', isExtensionDue: false };
        }
        const totalMs = Math.max(0, nowMs - start.getTime());
        const totalMinutes = Math.floor(totalMs / 60000);
        const days = Math.floor(totalMinutes / (60 * 24));
        const hours = Math.floor((totalMinutes % (60 * 24)) / 60);
        const minutes = totalMinutes % 60;
        const parts = [];
        if (days > 0) parts.push(`${days} ${days === 1 ? 'day' : 'days'}`);
        if (hours > 0 || days > 0) parts.push(`${hours} ${hours === 1 ? 'hr' : 'hrs'}`);
        if (days === 0) parts.push(`${minutes} min`);
        return {
          valid: true,
          totalMs,
          days,
          hours,
          minutes,
          formatted: parts.join(' '),
          isExtensionDue: totalMs >= THREE_DAYS_MS,
        };
      }

      function calculateApprovedExtensionDays(doa, approvedDate) {
        const start = parseLocalDateTime(doa);
        const end = parseLocalDateTime(approvedDate);
        if (!start || !end) return null;
        const diffMs = end.getTime() - start.getTime();
        if (diffMs < 0) return null;
        return Math.round(diffMs / (24 * 60 * 60 * 1000));
      }

      function recordNeedsExtensionAlert(record, nowMs = Date.now()) {
        const statusLower = (record.status ?? '').trim().toLowerCase();
        if (
          statusLower === 'discharge' ||
          statusLower === 'discharged' ||
          statusLower === 'e-bill submitted' ||
          statusLower === 'settled' ||
          (record.dod && record.dod.trim() !== '')
        ) {
          return false;
        }
        const duration = calculateAdmissionDuration(record.doa, record.doaTime, nowMs);
        if (!duration.valid || !duration.isExtensionDue) {
          return false;
        }
        if (record.extensionApprovedUpTo && record.extensionApprovedUpTo.trim() !== '') {
          const approvedEnd = parseLocalDateTime(record.extensionApprovedUpTo, '23:59');
          if (approvedEnd && approvedEnd.getTime() >= nowMs) {
            return false;
          }
        }
        return true;
      }

      function escapeCsvCell(value) {
        const str = value ?? '';
        if (/[",\r\n]/.test(str)) {
          return `"${str.replace(/"/g, '""')}"`;
        }
        return str;
      }

      function exportClaimsToCsv(records, columns) {
        const headerRow = columns.map((col) => escapeCsvCell(col.header)).join(',');
        const dataRows = records.map((record) =>
          columns.map((col) => escapeCsvCell(record[col.key] ?? '')).join(',')
        );
        return `\uFEFF${[headerRow, ...dataRows].join('\r\n')}`;
      }

      function escapeHtml(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');

          )

        const rowsHtml = records
          .map((record) => {

                const val = record[col.key] ?? '';
                const isNumeric = col.inputType === 'number' && val.trim() !== '' && !Number.isNaN(Number(val));
                const msoStyle = isNumeric
                  ? 'mso-number-format:"#,##0.00";text-align:right;'
                  : 'mso-number-format:"\\@";text-align:left;';
                return `<td style="border:1px solid #cbd5e1;padding:5px 8px;${msoStyle}">${escapeHtml(val)}</td>`;
              })
              .join('');
            return `<tr>${tds}</tr>`;
          })
          .join('');

        return `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel" xmlns="http://www.w3.org/TR/REC-html40">

      function triggerFileDownload(content, filename, mimeType) {
        const blob = new Blob([content], { type: mimeType });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      function parseCsvText(text) {
        const cleaned = text.replace(/^\uFEFF/, '');
        const rows = [];
        let row = [];
        let cell = '';
        let inQuotes = false;

        for (let i = 0; i < cleaned.length; i += 1) {
          const ch = cleaned[i];
          const next = cleaned[i + 1];
          if (inQuotes) {
            if (ch === '"' && next === '"') {
              cell += '"';
              i += 1;
            } else if (ch === '"') {
              inQuotes = false;
            } else {
              cell += ch;
            }
          } else if (ch === '"') {
            inQuotes = true;
          } else if (ch === ',') {
            row.push(cell);
            cell = '';
          } else if (ch === '\r' && next === '\n') {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = '';
            i += 1;
          } else if (ch === '\n' || ch === '\r') {
            row.push(cell);
            rows.push(row);
            row = [];
            cell = '';
          } else {
            cell += ch;
          }
        }
        if (cell.length > 0 || row.length > 0) {
          row.push(cell);
          rows.push(row);
        }
        return rows.filter((r) => r.some((value) => value.trim() !== ''));
      }

      function normalizeHeader(value) {
        return String(value || '').toLowerCase().replace(/[^a-z0-9]/g, '');
      }

      function importClaimsFromCsv(csvText, existingColumns, startingSrNo) {
        const rows = parseCsvText(csvText);
        if (rows.length < 2) return { records: [], newCustomColumns: [] };

        const rawHeaders = rows[0];
        const existingKeys = new Set(existingColumns.map((c) => c.key));
        const newCustomColumns = [];
        const indexToKey = [];
        let timeMatches = 0;

        rawHeaders.forEach((rawHeader) => {
          const trimmed = rawHeader.trim();
          if (!trimmed) {
            indexToKey.push(null);
            return;
          }
          const norm = normalizeHeader(trimmed);
          if (norm === 'time') {
            indexToKey.push(timeMatches === 0 ? 'doaTime' : 'dodTime');
            timeMatches += 1;
            return;
          }
          const match = existingColumns.find((col) => normalizeHeader(col.header) === norm);
          if (match) {
            indexToKey.push(match.key);
            return;
          }
          const key = createCustomColumnKey(trimmed, existingKeys);
          existingKeys.add(key);
          newCustomColumns.push({
            id: `imp-col-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            key,
            header: trimmed,
            group: 'identity',
            inputType: 'text',
          });
          indexToKey.push(key);
        });

        const allKeys = [...existingColumns.map((c) => c.key), ...newCustomColumns.map((c) => c.key)];
        const now = new Date().toISOString();
        const imported = [];

        for (let r = 1; r < rows.length; r += 1) {
          const cells = rows[r];
          const base = {};
          allKeys.forEach((k) => {
            base[k] = '';
          });
          cells.forEach((val, idx) => {
            const key = indexToKey[idx];
            if (key) base[key] = val.trim();
          });
          if (!base.srNo) {
            base.srNo = String(startingSrNo + imported.length);
          }
          imported.push({
            ...base,
            id: `imp-${Date.now()}-${r}-${Math.random().toString(36).slice(2, 7)}`,
            createdAt: now,
            updatedAt: now,
          });
        }
        return { records: imported, newCustomColumns };
      }

      function columnIndexToLetter(index) {
        let letter = '';
        let n = index;
        while (n >= 0) {
          letter = String.fromCharCode((n % 26) + 65) + letter;
          n = Math.floor(n / 26) - 1;
        }
        return letter;
      }

      function generateGoogleAppsScriptCode(columns, sheetName, highlightedKey) {
        const safeSheetName = (sheetName || 'ESIC_Claims_Register').replace(/['"\\]/g, '').trim() || 'ESIC_Claims_Register';
        const numericKeys = columns.filter((c) => c.inputType === 'number').map((c) => c.key);
        const schemaLines = columns
          .map((col, idx) => {
            const colLetter = columnIndexToLetter(idx);
            const marker = highlightedKey === col.key ? '  // <-- Selected header' : '';
            return `  { col: '${colLetter}', key: ${JSON.stringify(col.key)}, header: ${JSON.stringify(col.header)}, type: ${JSON.stringify(col.inputType)} },${marker}`;
          })
          .join('\n');

        return `/**
 * ESIC Claim Register — Google Sheets Sync Web App (Code.gs)
 * Auto-generated for ${columns.length} exact columns.
 *
 * Deployment steps in Google Sheets:
 * 1. Open your Google Sheet -> Extensions -> Apps Script
 * 2. Replace everything in Code.gs with this script and click Save
 * 3. Click Deploy -> New deployment -> Select type: Web app
 * 4. Execute as: Me | Who has access: Anyone -> Click Deploy
 * 5. Copy the Web App URL and paste it in the Google Sync tab
 */

const DEFAULT_SHEET_NAME = ${JSON.stringify(safeSheetName)};
const IMPLANTS_SHEET_SUFFIX = '_Implants';
const IMPLANTS_HEADERS = [
  'Record Key',
  'Claim SR NO',
  'Claim ID',
  'IP No. ( ESIC )',
  'Patient Name',
  'Remark',
  'Sr No',
  'Name of Implants',
  'Amount',
];

const SCHEMA = [
${schemaLines}
];

const NUMERIC_KEYS = new Set(${JSON.stringify(numericKeys)});

function getOrCreateSheet(sheetName) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const targetName = sheetName || DEFAULT_SHEET_NAME;
  let sheet = ss.getSheetByName(targetName);
  if (!sheet) {
    sheet = ss.insertSheet(targetName);
  }
  return sheet;
}

function getImplantsSheetName(sheetName) {
  const baseName = String(sheetName || DEFAULT_SHEET_NAME).trim() || DEFAULT_SHEET_NAME;
  return baseName.substring(0, 100 - IMPLANTS_SHEET_SUFFIX.length) + IMPLANTS_SHEET_SUFFIX;
}

function formatCellForRead(val, type) {
  if (val === null || val === undefined || val === '') return '';
  if (val instanceof Date) {
    const tz = Session.getScriptTimeZone();
    if (type === 'time') {
      return Utilities.formatDate(val, tz, 'HH:mm');
    }
    return Utilities.formatDate(val, tz, 'yyyy-MM-dd');
  }
  return String(val);
}

function getImplantRows(sheetName) {
  const sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(getImplantsSheetName(sheetName));
  if (!sheet || sheet.getLastRow() < 2) return [];
  const values = sheet.getRange(1, 1, sheet.getLastRow(), IMPLANTS_HEADERS.length).getValues();
  return values.slice(1).filter(function (row) {
    return row.some(function (cell) { return cell !== '' && cell !== null && cell !== undefined; });
  }).map(function (row) {
    return {
      recordKey: String(row[0] || ''),
      claimSrNo: String(row[1] || ''),
      claimId: String(row[2] || ''),
      ipNoEsic: String(row[3] || ''),
      patientName: String(row[4] || ''),
      remark: String(row[5] || ''),
      srNo: String(row[6] || ''),
      name: String(row[7] || ''),
      amount: String(row[8] || ''),
    };
  });
}

function doGet(e) {
  try {
    const params = (e && e.parameter) ? e.parameter : {};
    const sheet = getOrCreateSheet(params.sheetName);
    const implantRows = getImplantRows(sheet.getName());
    const lastRow = sheet.getLastRow();
    const lastCol = sheet.getLastColumn();

    if (lastRow === 0 || lastCol === 0) {
      return jsonResponse({
        ok: true,
        sheetName: sheet.getName(),
        headers: SCHEMA.map(function (c) { return c.header; }),
        keys: SCHEMA.map(function (c) { return c.key; }),
        rows: [],
        implantRows: implantRows,
      });
    }

    const rawValues = sheet.getRange(1, 1, lastRow, lastCol).getValues();
    const headers = rawValues[0].map(function (h) { return String(h || '').trim(); });
    const rows = [];

    for (var r = 1; r < rawValues.length; r++) {
      var rowArr = rawValues[r];
      var hasAnyValue = rowArr.some(function (cell) {
        return cell !== '' && cell !== null && cell !== undefined;
      });
      if (!hasAnyValue) continue;

      var obj = {};
      var timeCount = 0;
      for (var c = 0; c < headers.length; c++) {
        var hdr = headers[c];
        if (!hdr) continue;
        var norm = hdr.toLowerCase().replace(/[^a-z0-9]/g, '');
        var matched = null;
        if (norm === 'time') {
          matched = SCHEMA.find(function (s) {
            return s.key === (timeCount === 0 ? 'doaTime' : 'dodTime');
          });
          timeCount++;
        } else {
          matched = SCHEMA.find(function (s) {
            return s.header.toLowerCase().replace(/[^a-z0-9]/g, '') === norm;
          });
        }
        var targetKey = matched ? matched.key : hdr;
        var targetType = matched ? matched.type : 'text';
        obj[targetKey] = formatCellForRead(rowArr[c], targetType);
      }
      rows.push(obj);
    }

    return jsonResponse({
      ok: true,
      sheetName: sheet.getName(),
      headers: headers,
      rows: rows,
      implantRows: implantRows,
      syncedAt: new Date().toISOString(),
    });
  } catch (err) {
    return jsonResponse({ ok: false, error: String(err) });
  }
}

function doPost(e) {
  try {
    const rawBody = (e && e.postData && e.postData.contents) ? e.postData.contents : '{}';
    const payload = JSON.parse(rawBody);
    const sheet = getOrCreateSheet(payload.sheetName);

    const activeColumns = Array.isArray(payload.columns) && payload.columns.length
      ? payload.columns
      : SCHEMA;

    const headers = activeColumns.map(function (c) { return c.header; });
    const rows = Array.isArray(payload.rows) ? payload.rows : [];

    sheet.clearContents();

    const headerRange = sheet.getRange(1, 1, 1, headers.length);
    headerRange.setValues([headers]);
    headerRange.setFontWeight('bold');
    headerRange.setBackground('#f1f5f9');
    sheet.setFrozenRows(1);

    if (rows.length > 0) {
      const matrix = rows.map(function (row) {
        return activeColumns.map(function (col) {
          const val = row[col.key];
          if (val === null || val === undefined || val === '') return '';
          if (col.type === 'number' || NUMERIC_KEYS.has(col.key)) {
            const num = Number(String(val).replace(/[^0-9.-]/g, ''));
            return isNaN(num) ? String(val) : num;
          }
          return String(val);
        });
      });

      const dataRange = sheet.getRange(2, 1, matrix.length, headers.length);
      dataRange.setWrap(true);
      activeColumns.forEach(function (col, colIdx) {
        const colRange = sheet.getRange(2, colIdx + 1, matrix.length, 1);
        if (col.type === 'number' || NUMERIC_KEYS.has(col.key)) {
          colRange.setNumberFormat('#,##0.00');
        } else {
          colRange.setNumberFormat('@');
        }
      });
      dataRange.setValues(matrix);
    }

    const implantSheetName = getImplantsSheetName(sheet.getName());
    const implantSheet = getOrCreateSheet(implantSheetName);
    const implantRows = Array.isArray(payload.implantRows) ? payload.implantRows : [];
    implantSheet.clearContents();
    const implantHeaderRange = implantSheet.getRange(1, 1, 1, IMPLANTS_HEADERS.length);
    implantHeaderRange.setValues([IMPLANTS_HEADERS]);
    implantHeaderRange.setFontWeight('bold');
    implantHeaderRange.setBackground('#f1f5f9');
    implantSheet.setFrozenRows(1);

    if (implantRows.length > 0) {
      const implantMatrix = implantRows.map(function (row) {
        const amountText = String(row.amount || '');
        const amountNumber = Number(amountText.replace(/[^0-9.-]/g, ''));
        return [
          String(row.recordKey || ''),
          String(row.claimSrNo || ''),
          String(row.claimId || ''),
          String(row.ipNoEsic || ''),
          String(row.patientName || ''),
          String(row.remark || ''),
          String(row.srNo || ''),
          String(row.name || ''),
          amountText.trim() === '' ? '' : (isNaN(amountNumber) ? amountText : amountNumber),
        ];
      });
      const implantDataRange = implantSheet.getRange(2, 1, implantMatrix.length, IMPLANTS_HEADERS.length);
      implantDataRange.setValues(implantMatrix);
      implantDataRange.setWrap(true);
      implantSheet.getRange(2, IMPLANTS_HEADERS.length, implantMatrix.length, 1).setNumberFormat('#,##0.00');
    }

    return jsonResponse({
      ok: true,
      sheetName: sheet.getName(),
      implantsSheetName: implantSheetName,
      columnCount: headers.length,
      rowCount: rows.length,
      implantRowCount: implantRows.length,
      syncedAt: new Date().toISOString(),
    });
  } catch (err) {
    return jsonResponse({ ok: false, error: String(err) });
  }
}

function jsonResponse(obj) {
  return ContentService
    .createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}
`;
      }


      // =========================================================================
      // PRINTABLE DOCUMENT BUILDERS: EXTENSION PROFORMA & PERMISSION LETTER
      // =========================================================================
      function escapeAttr(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function escapeHtmlText(value) {
        return String(value ?? '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;');
      }

      function findMatchingValue(record, columns, primaryKey, headerKeywords) {
        const direct = (record[primaryKey] ?? '').trim();
        if (direct) return direct;
        for (const col of columns) {
          const norm = col.header.toLowerCase();
          if (headerKeywords.some((kw) => norm.includes(kw))) {
            const val = (record[col.key] ?? '').trim();
            if (val) return val;
          }
        }
        return '';
      }

      function getTodayIso() {
        const now = new Date();
        const y = now.getFullYear();
        const m = String(now.getMonth() + 1).padStart(2, '0');
        const d = String(now.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      }

      function collectProformaAutoData(record, columns) {
        const doaRaw = (record.doa ?? '').trim();
        const issuedRaw = (record.issuedDate ?? '').trim();
        const rawRoomType = findMatchingValue(record, columns, 'roomType', ['room type', 'room category']);
        const matchedRoomType =
          ROOM_TYPE_OPTIONS.find((opt) => opt.toLowerCase() === rawRoomType.toLowerCase()) ?? '';

        return {
          claimId: (record.claimId ?? '').trim(),
          admissionDate: doaRaw ? formatDisplayDate(doaRaw) : '',
          referralIssueDate: issuedRaw ? formatDisplayDate(issuedRaw) : '',
          department: findMatchingValue(record, columns, 'department', ['department']),
          extensionCount: '1st Time',
          patientName: (record.patientName ?? '').trim(),
          age: (record.age ?? '').trim(),
          gender: findMatchingValue(record, columns, 'gender', ['gender']),
          roomType: matchedRoomType,
          relation: (record.relation ?? '').trim(),
          beneficiaryName: (record.employeeName ?? '').trim(),
          insuranceNo: (record.ipNoEsic ?? '').trim(),
        };
      }

      function buildExtensionProformaHtml(data) {
        const extensionOptionsHtml = EXTENSION_COUNT_OPTIONS.map((opt) => {
          const selected = opt === data.extensionCount ? ' selected' : '';
          return `<option value="${escapeAttr(opt)}"${selected}>${escapeAttr(opt)}</option>`;
        }).join('');

        const roomTypeOptionsHtml = ROOM_TYPE_OPTIONS.map((opt) => {
          const selected = opt === data.roomType ? ' selected' : '';
          return `<option value="${escapeAttr(opt)}"${selected}>${escapeAttr(opt)}</option>`;
        }).join('');

        return `<!doctype html>

    (() => {
      const storageKey = "esic-extension-of-stay-saved-data-v1";

      const saveButton = document.getElementById("saveDataButton");

      const savedEmpty = document.getElementById("savedEmpty");
      const savedDataToggle = document.getElementById("savedDataToggle");

      const increaseTextSize = document.getElementById("increaseTextSize");

      const formatStatus = document.getElementById("formatStatus");
      let activeField = null;
      const fontFamilies = new Set(Array.from(fontFamilySelect.options, option => option.value));
      function readSavedData() {
        const stored = localStorage.getItem(storageKey);
        if (!stored) return [];
        const parsed = JSON.parse(stored);
        if (!Array.isArray(parsed)) throw new Error("The saved data has an unexpected format.");
        return parsed;
      }
      function writeSavedData(items) { localStorage.setItem(storageKey, JSON.stringify(items)); }
      function getRecordTitle(record) {
        const patientName = record.values[fields.findIndex(field => field.getAttribute("aria-label") === "Name of Patient")];
        const claimId = record.values[fields.findIndex(field => field.getAttribute("aria-label") === "Claim ID")];
        return patientName || claimId || "Saved form";
      }
      function getFieldFormat(field) {
        return { fontSize: field.style.fontSize || "11pt", fontFamily: field.style.fontFamily || "", fontWeight: field.style.fontWeight || "400" };
      }
      function updateFormatControls() {
        const enabled = activeField !== null;
        [fontFamilySelect, decreaseTextSize, increaseTextSize, boldText].forEach(c => { c.disabled = !enabled; });
        if (!enabled) return;
        fontFamilySelect.value = activeField.style.fontFamily || "";
        boldText.setAttribute("aria-pressed", activeField.style.fontWeight === "700" ? "true" : "false");
        formatStatus.textContent = \`Formatting: \${activeField.getAttribute("aria-label") || "selected form box"}\`;
      }
      function applySavedFormat(field, format) {
        field.style.fontSize = format.fontSize;
        field.style.fontFamily = format.fontFamily;
        field.style.fontWeight = format.fontWeight;
      }
      fields.forEach(field => field.addEventListener("focus", () => { activeField = field; updateFormatControls(); }));
      fontFamilySelect.addEventListener("change", () => { if (!activeField) return; activeField.style.fontFamily = fontFamilySelect.value; });
      function autoAdjustField(field) {
        if (!field || field.dataset.manualSize === "1") return;
        const td = field.closest("td");
        if (!td) return;
        if (field.classList.contains("auto-fit-box")) {
          const maxHeight = td.parentElement && td.parentElement.classList.contains("short-row") ? 28 : 32;
          let size = 11;
          field.style.fontSize = size + "pt";
          field.style.height = "auto";
          while (size > 8 && field.scrollHeight > maxHeight) { size -= 1; field.style.fontSize = size + "pt"; field.style.height = "auto"; }
          field.style.height = Math.max(16, field.scrollHeight) + "px";
        } else if (field.classList.contains("auto-fit-line")) {
          let size = 11;
          field.style.fontSize = size + "pt";
          while (size > 8 && field.scrollWidth > field.clientWidth + 1) { size -= 1; field.style.fontSize = size + "pt"; }
        }
      }
      function autoAdjustAllFields() { document.querySelectorAll(".auto-fit-box, .auto-fit-line").forEach(autoAdjustField); }
      document.querySelectorAll(".auto-fit-box, .auto-fit-line").forEach(field => {
        field.addEventListener("input", () => autoAdjustField(field));
        field.addEventListener("change", () => autoAdjustField(field));
      });
      decreaseTextSize.addEventListener("click", () => {
        if (!activeField) return;
        const currentSize = Number.parseInt(activeField.style.fontSize, 10) || 11;
        activeField.dataset.manualSize = "1";
        activeField.style.fontSize = \`\${Math.max(8, currentSize - 1)}pt\`;
        if (activeField.classList.contains("auto-fit-box")) { activeField.style.height = "auto"; activeField.style.height = Math.max(16, activeField.scrollHeight) + "px"; }
      });
      increaseTextSize.addEventListener("click", () => {
        if (!activeField) return;
        const currentSize = Number.parseInt(activeField.style.fontSize, 10) || 11;
        activeField.dataset.manualSize = "1";
        activeField.style.fontSize = \`\${Math.min(24, currentSize + 1)}pt\`;
        if (activeField.classList.contains("auto-fit-box")) { activeField.style.height = "auto"; activeField.style.height = Math.max(16, activeField.scrollHeight) + "px"; }
      });
      function toggleBold() {
        if (!activeField) return;
        activeField.style.fontWeight = activeField.style.fontWeight === "700" ? "400" : "700";
        updateFormatControls();
      }
      boldText.addEventListener("click", toggleBold);
      document.addEventListener("keydown", event => {
        if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "b" && activeField && document.activeElement === activeField) {
          event.preventDefault(); toggleBold();

      });
      function renderSavedData() {
        savedList.replaceChildren();
        let items;
        try { items = readSavedData(); } catch (error) { saveStatus.textContent = \`Unable to read saved data: \${error.message}\`; savedEmpty.hidden = true; return; }
        savedEmpty.hidden = items.length > 0;
        items.forEach(record => {
          const item = document.createElement("li"); item.className = "saved-item";
          const label = document.createElement("span");
          label.textContent = \`\${getRecordTitle(record)} — \${new Date(record.savedAt).toLocaleString()}\`;

      function normalizeIsoDate(raw) {
        const trimmed = (raw ?? '').trim();
        if (!trimmed) return '';
        if (/^\d{4}-\d{2}-\d{2}$/.test(trimmed)) return trimmed;
        const dmy = /^(\d{1,2})[-/](\d{1,2})[-/](\d{4})$/.exec(trimmed);
        if (dmy) {
          return `${dmy[3]}-${dmy[2].padStart(2, '0')}-${dmy[1].padStart(2, '0')}`;
        }
        const parsed = new Date(trimmed);
        if (!Number.isNaN(parsed.getTime())) {
          return `${parsed.getFullYear()}-${String(parsed.getMonth() + 1).padStart(2, '0')}-${String(parsed.getDate()).padStart(2, '0')}`;
        }
        return '';
      }

      function normalizeTime24(raw) {
        const trimmed = (raw ?? '').trim();
        if (!trimmed) return '';
        const match = /^(\d{1,2}):(\d{2})(?:\s*(am|pm))?/i.exec(trimmed);
        if (!match) return '';
        let hours = Number(match[1]);
        const minutes = match[2];
        const meridiem = match[3]?.toLowerCase();
        if (meridiem === 'pm' && hours < 12) hours += 12;
        if (meridiem === 'am' && hours === 12) hours = 0;
        if (hours < 0 || hours > 23) return '';
        return `${String(hours).padStart(2, '0')}:${minutes}`;
      }

      function combineDateTimeLocal(dateStr, timeStr) {
        const isoDate = normalizeIsoDate(dateStr);
        if (!isoDate) return '';
        const hhmm = normalizeTime24(timeStr) || '00:00';
        return `${isoDate}T${hhmm}`;
      }

      function normalizeSexOption(raw) {
        const trimmed = (raw ?? '').trim();
        if (!trimmed) return '';
        const lower = trimmed.toLowerCase();
        if (lower === 'm' || lower === 'male') return 'Male';
        if (lower === 'f' || lower === 'female') return 'Female';
        return trimmed;
      }

      function extractNumericAge(raw) {
        const match = /\d+/.exec((raw ?? '').trim());
        return match ? match[0] : '';

      .page { min-height: auto; padding: 24px 18px; overflow-x: auto; }
      .patient-section { grid-template-columns: minmax(0, 3fr) minmax(100px, 1fr); gap: 12px; }
      .page-two > .section-heading:first-child, .additional-heading { white-space: normal; }
    }
    @media print {
      .age-sex-row .age-unit, .print-toolbar, .field-height-controls, .add-row-button { display: none; }
      .patient-table input[type="date"], .patient-table input[type="datetime-local"], .age-sex-row input, .age-sex-row select, .discharge-row select, .treatment-table select { display: none; }
      .age-sex-row td { display: table-cell; }
      .age-sex-row .print-value { display: block; min-height: 1.35em; margin: 0; padding: 0; border: 0; outline: 0; box-shadow: none; white-space: normal; overflow-wrap: anywhere; }
      .patient-table .print-value, .discharge-row .print-value, .treatment-table .print-value { display: block; min-height: 1.35em; white-space: pre-wrap; }
      .print-value { font-size: inherit; }
      @page { size: 210mm 297mm; margin: 0; }
      html, body { width: 210mm; min-width: 210mm; margin: 0; padding: 0; background: #fff; }
      .document, .page { width: 210mm; margin: 0; }
      .page { height: auto; min-height: 297mm; padding: 14mm 13mm 12mm; box-shadow: none; overflow: visible; page-break-after: always; break-after: page; }
      .page:last-child { page-break-after: auto; break-after: auto; }
      .page-two > .section-heading:first-child, .additional-heading { white-space: normal; gap: 4mm; font-size: 10pt; }
      .nonpackage-table tr, .additional-table tr, .amount-table tr { page-break-inside: avoid; break-inside: avoid; }
      * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>
  <main class="document">
    <div class="print-toolbar">
      <button type="button" id="toggle-bold" aria-pressed="true" title="Toggle bold for the focused field">Bold</button>
      <button type="button" id="increase-text" title="Increase text size in the focused field">A+</button>
      <button type="button" id="decrease-text" title="Decrease text size in the focused field">A−</button>
      <button type="button" id="print-form">Print Form</button>
    </div>
    <div class="field-height-controls" id="field-height-controls" aria-label="Adjust field height" hidden>
      <span>Box height</span>
      <button type="button" id="decrease-height" aria-label="Decrease box height">−</button>
      <button type="button" id="increase-height" aria-label="Increase box height">+</button>
    </div>
    <section class="page page-one">
      <h1>INDIVIDUAL CASE FORM ANNEXURE P (II)</h1>
      <div class="patient-section">
        <table class="patient-table">
          <tbody>
            <tr><th>Name of the patient:</th><td><textarea class="wrap-textarea" aria-label="Name of the patient">${escapeHtmlText(data.patientName)}</textarea></td></tr>
            <tr><th>Referral S.no.(Routine/Emergency:</th><td><textarea class="wrap-textarea" aria-label="Referral number and type">${escapeHtmlText(data.referralSNo)}</textarea></td></tr>
            <tr class="age-sex-row"><th>Age/Sex:</th><td><input type="number" min="0" step="1" aria-label="Age" value="${escapeAttr(data.age)}"><span class="age-unit" aria-hidden="true">years</span><select aria-label="Sex"><option value="">Select sex</option>${sexOptionsHtml}</select><span class="print-value" aria-hidden="true"></span></td></tr>
            <tr class="address-row"><th>Address:</th><td><textarea class="wrap-textarea" aria-label="Address">${escapeHtmlText(data.address)}</textarea></td></tr>
            <tr><th>Contact No:</th><td><textarea class="wrap-textarea" aria-label="Contact number">${escapeHtmlText(data.contactNo)}</textarea></td></tr>
            <tr><th>Insurance Number and UHID No&nbsp;:</th><td><textarea class="wrap-textarea" aria-label="Insurance number and UHID number">${escapeHtmlText(data.insuranceAndUhid)}</textarea></td></tr>
            <tr><th>Claim ID / Card No:</th><td><textarea class="wrap-textarea" aria-label="Claim ID and Card number">${escapeHtmlText(data.cardNo)}</textarea></td></tr>
            <tr><th>Date of Referral:</th><td><input type="date" aria-label="Date of referral" value="${escapeAttr(data.dateOfReferral)}"><span class="print-value" aria-hidden="true"></span></td></tr>
            <tr><th>Date of Admission and Time&nbsp;:</th><td><input type="datetime-local" aria-label="Date and time of admission" value="${escapeAttr(data.dateOfAdmissionAndTime)}"><span class="print-value" aria-hidden="true"></span></td></tr>
            <tr><th>Date of Discharge and Time&nbsp;:</th><td><input type="datetime-local" aria-label="Date and time of discharge" value="${escapeAttr(data.dateOfDischargeAndTime)}"><span class="print-value" aria-hidden="true"></span></td></tr>
          </tbody>
        </table>
        <div class="photo-box" aria-label="Patient photograph area"></div>
      </div>
      <table class="wide-form-table diagnosis-table">
        <tbody>
          <tr class="diagnosis-row"><th>Diagnosis:</th><td><textarea class="wrap-textarea" aria-label="Diagnosis">${escapeHtmlText(data.diagnosis)}</textarea></td></tr>
          <tr class="discharge-row"><th>Condition of the patient at discharge:</th><td><select aria-label="Condition of the patient at discharge"><option value="">Select condition</option><option>Normal Discharge</option><option>Death</option><option>Leave Against Medical Advice</option><option>Discharge On Request</option><option>Transfer To Other hospital</option></select><span class="print-value" aria-hidden="true"></span></td></tr>
        </tbody>
      </table>
      <h2 class="package-heading">(For package rates):</h2>
      <table class="wide-form-table treatment-table">
        <tbody><tr><th>Treatment/procedure done/performed:</th><td><select aria-label="Treatment or procedure performed"><option value="">Select treatment</option><option>Medical Management</option><option>Surgical management</option><option>Incentive Care Procedure</option></select><span class="print-value" aria-hidden="true"></span></td></tr></tbody>
      </table>
      <h2 class="section-heading package-list-heading"><span>I.</span> Existing in the package rate list’s</h2>
      <table class="wide-form-table package-table">
        <colgroup><col style="width:14.5%"><col style="width:14.5%"><col style="width:14.5%"><col style="width:14.5%"><col style="width:14.5%"><col style="width:14.5%"><col style="width:13%"></colgroup>
        <thead><tr><th>SR NO</th><th>Chargeable<br>Procedure</th><th>CGHS Code no<br>with page no<br>(1)</th><th>Other if not on<br>(1) prescribed<br>code no with<br>page no</th><th>Rate</th><th>Amt. Claimed</th><th>Remarks</th></tr></thead>
        <tbody id="package-rows"><tr><td><input aria-label="Package item serial number"></td><td><textarea class="wrap-textarea" aria-label="Package chargeable procedure"></textarea></td><td><textarea class="wrap-textarea" aria-label="Package CGHS code"></textarea></td><td><textarea class="wrap-textarea" aria-label="Other package code"></textarea></td><td><input aria-label="Package rate"></td><td><input aria-label="Package amount claimed"></td><td><textarea class="wrap-textarea" aria-label="Package remarks"></textarea></td></tr></tbody>
      </table>
      <button type="button" class="add-row-button" id="add-package-row">Add package row</button>
      <table class="amount-table package-amount">
        <tbody>
          <tr><th>Charges of Implant/device used</th><td><input aria-label="Charges of implant or device used"></td></tr>
          <tr><th>Amount Claimed Rs.</th><td><input aria-label="Package amount claimed in rupees"></td></tr>
