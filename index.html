                        {orderedKeys.length === 0 ? (
                          <p className="text-xs text-slate-400">
                            All boxes in this section were removed. Enable &ldquo;Add / Remove Box &amp; Header Name&rdquo; above to restore or add boxes.
                          </p>
                        ) : (
                          <div className="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4">
                            {orderedKeys.map((key) => {
                              const col = columnMap.get(key);
                              if (!col) return null;
                              const spanClass =
                                key === 'address' || key === 'diagnosis' || key === 'remarkAndImplants'
                                  ? 'sm:col-span-2 lg:col-span-2'
                                  : '';
                              return renderField(col, spanClass);
                            })}
                          </div>
                        )}

                        {section.group === 'admission' && liveDuration.valid ? (
                          <div
                            className={`mt-5 rounded-lg border px-4 py-3 ${
                              liveDuration.isExtensionDue && !(formData.dod || '').trim()
                                ? 'border-amber-200 bg-amber-50/70'
                                : 'border-slate-200 bg-slate-50'
                            }`}
                          >
                            <div className="flex flex-wrap items-center justify-between gap-3">
                              <div className="flex flex-wrap items-center gap-x-3 gap-y-1 text-xs">
                                <span className="inline-flex items-center gap-1.5 font-semibold text-slate-900">
                                  <Clock className="h-3.5 w-3.5 text-teal-700" aria-hidden="true" />
                                  Elapsed since DOA:
                                  <span className="font-mono tabular-nums">{liveDuration.formatted}</span>
                                </span>

                                {liveDuration.isExtensionDue && !(formData.dod || '').trim() ? (
                                  <>
                                    <span aria-hidden="true" className="text-slate-300">
                                      ·
                                    </span>
                                    <span className="font-semibold text-amber-800">
                                      Patient requires an extension (3+ days elapsed)
                                    </span>
                                  </>
                                ) : null}

                                {approvedExtensionDays !== null ? (
                                  <>
                                    <span aria-hidden="true" className="text-slate-300">
                                      ·
                                    </span>
                                    <span className="font-semibold text-teal-800">
                                      Approved Extension:{' '}
                                      <span className="font-mono tabular-nums">
                                        {approvedExtensionDays}{' '}
                                        {approvedExtensionDays === 1 ? 'day' : 'days'}
                                      </span>{' '}
                                      granted (up to {formatDisplayDate(formData.extensionApprovedUpTo || '')})
                                    </span>
                                  </>
                                ) : null}
                              </div>

                              {!(formData.dod || '').trim() ? (
                                <button
                                  type="button"
                                  onClick={() => {
                                    setInlineApprovedDate(formData.extensionApprovedUpTo || '');
                                    setInlineApproveError(null);
                                    setShowInlineApprovePrompt((v) => !v);
                                  }}
                                  className="inline-flex h-8 items-center gap-1.5 rounded-md bg-teal-700 px-3 text-xs font-semibold text-white transition-colors hover:bg-teal-800 whitespace-nowrap shrink-0"
                                >
                                  <Send className="h-3.5 w-3.5" aria-hidden="true" />
                                  Send
                                </button>
                              ) : null}
                            </div>

                            {showInlineApprovePrompt ? (
                              <div className="mt-3 flex flex-wrap items-end gap-3 border-t border-slate-200/80 pt-3">
                                <div className="flex flex-col gap-1">
                                  <label
                                    htmlFor="inline-approved-date"
                                    className="text-[11px] font-semibold text-slate-700"
                                  >
                                    Approved Date (Validity End Date)
                                  </label>
                                  <input
                                    id="inline-approved-date"
                                    type="date"
                                    min={formData.doa || undefined}
                                    value={inlineApprovedDate}
                                    onChange={(e) => {
                                      setInlineApprovedDate(e.target.value);
                                      setInlineApproveError(null);
                                    }}
                                    className="h-9 rounded-lg border border-slate-300 bg-white px-3 font-mono text-xs text-slate-900 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15"
                                  />
                                </div>

                                <div className="flex-1 text-xs">
                                  {inlineApproveError ? (
                                    <span className="font-medium text-red-700">{inlineApproveError}</span>
                                  ) : inlineApprovedDate && inlinePreviewDays !== null ? (
                                    <span className="font-semibold text-teal-800">
                                      Total Approval Granted:{' '}
                                      <span className="font-mono tabular-nums">
                                        {inlinePreviewDays} {inlinePreviewDays === 1 ? 'day' : 'days'}
                                      </span>{' '}
                                      <span className="font-normal text-slate-600">
                                        (DOA {formatDisplayDate(formData.doa || '')} →{' '}
                                        {formatDisplayDate(inlineApprovedDate)})
                                      </span>
                                    </span>
                                  ) : (
                                    <span className="text-slate-500">
                                      Enter Approved Date to compute total approved days automatically.
                                    </span>
                                  )}
                                </div>

                                <div className="flex items-center gap-2">
                                  <button
                                    type="button"
                                    onClick={() => setShowInlineApprovePrompt(false)}
                                    className="h-9 rounded-md border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 hover:bg-slate-50"
                                  >
                                    Cancel
                                  </button>
                                  <button
                                    type="button"
                                    onClick={handleApplyInlineExtensionApproval}
                                    className="h-9 rounded-md bg-teal-700 px-3.5 text-xs font-semibold text-white hover:bg-teal-800"
                                  >
                                    Apply Approved Date
                                  </button>
                                </div>
                              </div>
                            ) : null}
                          </div>
                        ) : null}
                      </fieldset>
                    );
                  })}
                </div>
              ) : (
                <div className="px-6 py-6">
                  <div className="mb-4 flex items-center justify-between gap-4">
                    <p className="text-xs text-slate-500">
                      Fields arranged in exact 1-to-{columns.length} column sequence matching the register table, Excel export, and Google Sync headers.
                    </p>
                  </div>
                  <div className="grid grid-cols-1 gap-x-5 gap-y-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5">
                    {columns.map((col) => {
                      const spanClass =
                        col.key === 'address' || col.key === 'diagnosis' || col.key === 'remarkAndImplants'
                          ? 'sm:col-span-2'
                          : '';
                      return renderField(col, spanClass);
                    })}
                  </div>
                </div>
              )}

              <div className="flex flex-wrap items-center justify-between gap-3 border-t border-slate-200 bg-slate-50/70 px-6 py-4 rounded-b-xl">
                <div className="flex items-center gap-2">
                  <button
                    type="button"
                    onClick={onReset}
                    className="inline-flex h-10 items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 text-sm font-medium text-slate-700 transition-colors hover:bg-slate-50 hover:text-slate-900 whitespace-nowrap shrink-0"
                  >
                    <RotateCcw className="h-4 w-4" aria-hidden="true" />
                    Reset Fields
                  </button>
                  {isEditing ? (
                    <button
                      type="button"
                      onClick={onCancelEdit}
                      className="inline-flex h-10 items-center rounded-lg px-4 text-sm font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900 whitespace-nowrap shrink-0"
                    >
                      Cancel Edit
                    </button>
                  ) : null}
                </div>

                <div className="flex flex-wrap items-center gap-3">
                  {!isEditing ? (
                    <button
                      type="button"
                      onClick={() => validateAndSubmit(true)}
                      className="inline-flex h-10 items-center gap-2 rounded-lg border border-teal-700/30 bg-teal-50/60 px-4 text-sm font-medium text-teal-900 transition-colors hover:bg-teal-100/70 whitespace-nowrap shrink-0"
                    >
                      <Plus className="h-4 w-4" aria-hidden="true" />
                      Save &amp; Add Next
                    </button>
                  ) : null}
                  <button
                    type="submit"
                    className="inline-flex h-10 items-center gap-2 rounded-lg bg-teal-700 px-5 text-sm font-semibold text-white transition-colors hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700 whitespace-nowrap shrink-0"
                  >
                    <Check className="h-4 w-4" aria-hidden="true" />
                    {isEditing ? 'Update Record' : 'Save Record'}
                  </button>
                </div>
              </div>
            </form>

            <RemarkImplantsModal
              isOpen={isRemarkImplantsOpen}
              initialMode={remarkImplantsMode}
              patientLabel={(formData.patientName || '').trim() || (formData.claimId || '').trim() || undefined}
              initialRemark={formData.admissionRemark || ''}
              initialImplants={parsedImplants}
              onSave={handleSaveRemarkAndImplants}
              onClose={() => setIsRemarkImplantsOpen(false)}
            />
          </section>
        );
      }

      // =========================================================================
      // CLAIM TABLE COMPONENT
      // =========================================================================
      const COLUMN_FILTER_TABS = [
        { id: 'all', label: 'All Headers' },
        { id: 'identity', label: 'Identification' },
        { id: 'patient', label: 'Patient' },
        { id: 'admission', label: 'Admission' },
        { id: 'extension', label: 'Validity & Status' },
        { id: 'billing', label: 'Billing' },
      ];

      function getStatusTextClass(status) {
        const s = String(status || '').toLowerCase();
        if (s.includes('approved') || s.includes('settled')) return 'text-emerald-700 font-medium';
        if (s.includes('query') || s.includes('extension send')) return 'text-amber-700 font-medium';
        if (s.includes('reject')) return 'text-red-700 font-medium';
        if (s.includes('e-bill') || s.includes('submit')) return 'text-teal-700 font-medium';
        if (s.includes('discharge')) return 'text-slate-600 font-medium';
        return 'text-slate-800 font-medium';
      }

      function ClaimTable({
        columns,
        records,
        editingId,
        nowMs,
        statusFilter,
        onStatusFilterChange,
        onView,
        onEdit,
        onDuplicate,
        onDelete,
        onOpenExtensionProforma,
        onOpenFormP2,
        onOpenPermissionLetter,
        onClearAll,
        onExportCsv,
        onExportExcel,
        onImportCsvFile,
        onStartNewEntry,
        onFilteredSummaryChange,
        compactHeader = false,
      }) {
        const [searchQuery, setSearchQuery] = useState('');
        const [columnFilter, setColumnFilter] = useState('all');
        const [selectedRecordId, setSelectedRecordId] = useState(null);
        const [confirmDeleteId, setConfirmDeleteId] = useState(null);
        const [confirmClearAll, setConfirmClearAll] = useState(false);

        const selectedRecord = useMemo(
          () => records.find((r) => r.id === selectedRecordId) || null,
          [records, selectedRecordId]
        );

        const uniqueStatuses = useMemo(() => {
          const set = new Set(STATUS_OPTIONS);
          records.forEach((r) => {
            if ((r.status || '').trim()) set.add(r.status.trim());
          });
          return Array.from(set).sort();
        }, [records]);

        const filteredRecords = useMemo(() => {
          const q = searchQuery.trim().toLowerCase();
          return records.filter((rec) => {
            if (statusFilter !== 'all' && (rec.status || '').trim() !== statusFilter) {
              return false;
            }
            if (!q) return true;
            return columns.some((col) => (rec[col.key] || '').toLowerCase().includes(q));
          });
        }, [records, columns, searchQuery, statusFilter]);

        const visibleColumns = useMemo(() => {
          if (columnFilter === 'all') return columns;
          return columns.filter(
            (col) =>
              col.key === 'srNo' ||
              col.key === 'claimId' ||
              col.key === 'patientName' ||
              col.group === columnFilter
          );
        }, [columns, columnFilter]);

        const totals = useMemo(() => {
          return filteredRecords.reduce(
            (acc, rec) => {
              acc.finalBill += parseNumericAmount(rec.finalBill || '');
              acc.settledAmount += parseNumericAmount(rec.settledAmount || '');
              acc.deductionAmount += parseNumericAmount(rec.deductionAmount || '');
              const status = (rec.status || '').trim();
              if (status === 'E-Bill Submitted') acc.eBillSubmittedCount += 1;
              if (status === 'Admitted') acc.admittedCount += 1;
              if (status === 'Discharge') acc.dischargeCount += 1;
              if (status === 'Hard-Copy Submitted') acc.hardCopySubmittedCount += 1;
              if (status === 'Query') acc.queryCount += 1;
              return acc;
            },
            {
              finalBill: 0,
              settledAmount: 0,
              deductionAmount: 0,
              eBillSubmittedCount: 0,
              admittedCount: 0,
              dischargeCount: 0,
              hardCopySubmittedCount: 0,
              queryCount: 0,
            }
          );
        }, [filteredRecords]);

        useEffect(() => {
          if (!onFilteredSummaryChange) return;
          onFilteredSummaryChange({
            displayedCount: filteredRecords.length,
            totalCount: records.length,
            finalBill: totals.finalBill,
            settledAmount: totals.settledAmount,
            deductionAmount: totals.deductionAmount,
            eBillSubmittedCount: totals.eBillSubmittedCount,
            admittedCount: totals.admittedCount,
            dischargeCount: totals.dischargeCount,
            hardCopySubmittedCount: totals.hardCopySubmittedCount,
            queryCount: totals.queryCount,
          });
        }, [
          filteredRecords.length,
          records.length,
          totals.finalBill,
          totals.settledAmount,
          totals.deductionAmount,
          totals.eBillSubmittedCount,
          totals.admittedCount,
          totals.dischargeCount,
          totals.hardCopySubmittedCount,
          totals.queryCount,
          onFilteredSummaryChange,
        ]);

        const handleFileInput = (e) => {
          const file = e.target.files && e.target.files[0];
          if (file) {
            onImportCsvFile(file);
          }
          e.target.value = '';
        };

        const renderCellValue = (record, col) => {
          const raw = record[col.key] || '';
          if (!raw.trim()) return <span className="text-slate-300">—</span>;

          if (
            col.key === 'finalBill' ||
            col.key === 'settledAmount' ||
            col.key === 'deductionAmount' ||
            col.inputType === 'number'
          ) {
            return formatCurrencyValue(raw);
          }

          if (col.inputType === 'date') {
            const formatted = formatDisplayDate(raw);
            if (col.key === 'extensionApprovedUpTo') {
              const days = calculateApprovedExtensionDays(record.doa || '', raw);
              if (days !== null) {
                return (
                  <span>
                    {formatted}{' '}
                    <span className="text-[11px] text-teal-700 font-medium">
                      ({days}d)
                    </span>
                  </span>
                );
              }
            }
            if (col.key === 'doa' && recordNeedsExtensionAlert(record, nowMs)) {
              return (
                <span className="text-amber-800 font-medium" title="3+ days elapsed — extension required">
                  {formatted}
                </span>
              );
            }
            return formatted;
          }

          if (col.key === 'status') {
            return <span className={getStatusTextClass(raw)}>{raw}</span>;
          }

          return raw;
        };

        return (
          <section className="rounded-xl border border-slate-200 bg-white">
            <div className="no-print flex flex-col gap-4 border-b border-slate-200 px-6 py-4">
              <div className="flex flex-wrap items-center justify-between gap-3">
                <div>
                  <h2 className="text-base font-semibold text-slate-900">
                    {compactHeader ? 'Entered Records Register' : 'ESIC Claims Master Register'}
                  </h2>
                  <p className="mt-0.5 text-xs text-slate-500">
                    Showing {visibleColumns.length} of {columns.length} columns · Select any patient checkbox to open Extension, Form P II, or Permission Letter
                  </p>
                </div>

                <div className="flex flex-wrap items-center gap-2">
                  {selectedRecord ? (
                    <div className="inline-flex flex-wrap items-center gap-1.5 rounded-lg border border-teal-700/30 bg-teal-50 px-2.5 py-1">
                      <span className="max-w-[180px] truncate text-xs font-medium text-teal-950">
                        {selectedRecord.patientName || selectedRecord.claimId || `SR ${selectedRecord.srNo}`}
                      </span>
                      <button
                        type="button"
                        onClick={() => onOpenExtensionProforma(selectedRecord)}
                        className="inline-flex h-7 items-center gap-1.5 rounded-md bg-teal-700 px-3 text-xs font-semibold text-white transition-colors hover:bg-teal-800 whitespace-nowrap"
                      >
                        <FileText className="h-3.5 w-3.5" aria-hidden="true" />
                        Extension
                      </button>
                      <button
                        type="button"
                        onClick={() => onOpenFormP2(selectedRecord)}
                        className="inline-flex h-7 items-center gap-1.5 rounded-md bg-slate-900 px-3 text-xs font-semibold text-white transition-colors hover:bg-slate-800 whitespace-nowrap"
                      >
                        <ClipboardList className="h-3.5 w-3.5" aria-hidden="true" />
                        Form P II
                      </button>
                      <button
                        type="button"
                        onClick={() => onOpenPermissionLetter(selectedRecord)}
                        className="inline-flex h-7 items-center gap-1.5 rounded-md border border-teal-700 bg-white px-3 text-xs font-semibold text-teal-800 transition-colors hover:bg-teal-100 whitespace-nowrap"
                      >
                        <FileCheck2 className="h-3.5 w-3.5" aria-hidden="true" />
                        Permission Letter
                      </button>
                      <button
                        type="button"
                        onClick={() => setSelectedRecordId(null)}
                        title="Clear selected patient"
                        aria-label="Clear selected patient"
                        className="inline-flex h-7 w-7 items-center justify-center rounded-md text-teal-800 hover:bg-teal-100"
                      >
                        <X className="h-3.5 w-3.5" aria-hidden="true" />
                      </button>
                    </div>
                  ) : null}

                  <label className="inline-flex h-9 cursor-pointer items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 hover:text-slate-900 whitespace-nowrap shrink-0">
                    <Upload className="h-3.5 w-3.5" aria-hidden="true" />
                    Import CSV
                    <input
                      type="file"
                      accept=".csv,text/csv"
                      onChange={handleFileInput}
                      className="sr-only"
                    />
                  </label>

                  <button
                    type="button"
                    onClick={onExportExcel}
                    disabled={records.length === 0}
                    className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-teal-700/30 bg-teal-50/70 px-3 text-xs font-semibold text-teal-900 transition-colors hover:bg-teal-100/70 disabled:opacity-40 whitespace-nowrap shrink-0"
                  >
                    <FileSpreadsheet className="h-3.5 w-3.5" aria-hidden="true" />
                    Export Excel
                  </button>

                  <button
                    type="button"
                    onClick={onExportCsv}
                    disabled={records.length === 0}
                    className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 hover:text-slate-900 disabled:opacity-40 whitespace-nowrap shrink-0"
                  >
                    <Download className="h-3.5 w-3.5" aria-hidden="true" />
                    Export CSV
                  </button>

                  <button
                    type="button"
                    onClick={() => window.print()}
                    disabled={records.length === 0}
                    className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 transition-colors hover:bg-slate-50 hover:text-slate-900 disabled:opacity-40 whitespace-nowrap shrink-0"
                  >
                    <Printer className="h-3.5 w-3.5" aria-hidden="true" />
                    Print
                  </button>

                  {records.length > 0 ? (
                    confirmClearAll ? (
                      <div className="inline-flex items-center gap-1.5 rounded-lg border border-red-200 bg-red-50 px-2.5 py-1">
                        <span className="text-xs font-medium text-red-800 whitespace-nowrap">
                          Clear all?
                        </span>
                        <button
                          type="button"
                          onClick={() => {
                            onClearAll();
                            setConfirmClearAll(false);
                          }}
                          className="rounded px-2 py-0.5 text-xs font-semibold text-white bg-red-600 hover:bg-red-700 whitespace-nowrap"
                        >
                          Yes
                        </button>
                        <button
                          type="button"
                          onClick={() => setConfirmClearAll(false)}
                          className="rounded px-2 py-0.5 text-xs font-medium text-slate-700 hover:bg-white whitespace-nowrap"
                        >
                          No
                        </button>
                      </div>
                    ) : (
                      <button
                        type="button"
                        onClick={() => setConfirmClearAll(true)}
                        className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-200 bg-white px-3 text-xs font-medium text-red-700 transition-colors hover:border-red-200 hover:bg-red-50 whitespace-nowrap shrink-0"
                      >
                        <Trash2 className="h-3.5 w-3.5" aria-hidden="true" />
                        Clear All
                      </button>
                    )
                  ) : null}
                </div>
              </div>

              <div className="flex flex-wrap items-center justify-between gap-3">
                <div className="flex flex-wrap items-center gap-2.5 flex-1 min-w-[260px]">
                  <div className="relative flex-1 max-w-sm">
                    <Search
                      className="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-slate-400"
                      aria-hidden="true"
                    />
                    <input
                      type="search"
                      value={searchQuery}
                      onChange={(e) => setSearchQuery(e.target.value)}
                      placeholder="Search Claim ID, Patient, Area, IP No., Diagnosis..."
                      aria-label="Search claim records"
                      className="h-9 w-full rounded-lg border border-slate-300 bg-white pl-9 pr-3 text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15"
                    />
                  </div>

                  <select
                    value={statusFilter}
                    onChange={(e) => onStatusFilterChange(e.target.value)}
                    aria-label="Filter by claim status"
                    className="h-9 rounded-lg border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15"
                  >
                    <option value="all">All Statuses</option>
                    {uniqueStatuses.map((status) => (
                      <option key={status} value={status}>
                        {status}
                      </option>
                    ))}
                  </select>
                </div>

                <div
                  className="flex items-center gap-1 overflow-x-auto rounded-lg bg-slate-100 p-1"
                  role="tablist"
                  aria-label="Column visibility filter"
                >
                  {COLUMN_FILTER_TABS.map((tab) => (
                    <button
                      key={tab.id}
                      type="button"
                      role="tab"
                      aria-selected={columnFilter === tab.id}
                      onClick={() => setColumnFilter(tab.id)}
                      className={`rounded-md px-2.5 py-1 text-xs font-medium transition-colors whitespace-nowrap shrink-0 ${
                        columnFilter === tab.id
                          ? 'bg-white text-slate-900 shadow-xs'
                          : 'text-slate-600 hover:text-slate-900'
                      }`}
                    >
                      {tab.id === 'all' ? `All ${columns.length} Headers` : tab.label}
                    </button>
                  ))}
                </div>
              </div>
            </div>

            {records.length === 0 ? (
              <div className="px-6 py-16 text-center">
                <p className="text-sm font-semibold text-slate-900">No claim records entered yet</p>
                <p className="mx-auto mt-1 max-w-md text-xs text-slate-500">
                  Use the ESIC data entry form to record patient admissions, referral validity, and claim billing, or import an existing CSV register.
                </p>
                <button
                  type="button"
                  onClick={onStartNewEntry}
                  className="mt-5 inline-flex h-10 items-center rounded-lg bg-teal-700 px-4 text-sm font-medium text-white transition-colors hover:bg-teal-800 whitespace-nowrap"
                >
                  Log First Claim Entry
                </button>
              </div>
            ) : filteredRecords.length === 0 ? (
              <div className="px-6 py-14 text-center">
                <p className="text-sm font-semibold text-slate-900">No matching claims found</p>
                <p className="mt-1 text-xs text-slate-500">
                  Try adjusting your search query or status filter.
                </p>
                <button
                  type="button"
                  onClick={() => {
                    setSearchQuery('');
                    onStatusFilterChange('all');
                  }}
                  className="mt-4 inline-flex h-9 items-center rounded-lg border border-slate-300 bg-white px-4 text-xs font-medium text-slate-700 hover:bg-slate-50"
                >
                  Clear Filters
                </button>
              </div>
            ) : (
              <div className="print-table-wrap register-scroll overflow-x-auto">
                <table className="w-full border-collapse text-left text-xs">
                  <thead>
                    <tr className="border-b border-slate-200 bg-slate-100/90 text-slate-700">
                      <th
                        scope="col"
                        style={{ width: '44px', minWidth: '44px' }}
                        className="no-print border-r border-slate-200/70 px-2.5 py-3 text-center font-semibold md:sticky md:left-0 md:z-20 md:bg-slate-100"
                      >
                        <span className="sr-only">Select patient for Extension Proforma</span>
                      </th>
                      {visibleColumns.map((col, idx) => {
                        const isStickySr = idx === 0 && col.key === 'srNo';
                        const isStickyClaim = idx === 1 && col.key === 'claimId';
                        return (
                          <th
                            key={col.key}
                            scope="col"
                            style={{ minWidth: col.minWidth }}
                            className={`border-r border-slate-200/70 px-3 py-3 font-semibold whitespace-nowrap ${
                              col.align === 'right' ? 'text-right' : 'text-left'
                            } ${
                              isStickySr
                                ? 'md:sticky md:left-[44px] md:z-20 md:bg-slate-100'
                                : isStickyClaim
                                  ? 'md:sticky md:left-[116px] md:z-20 md:bg-slate-100 md:shadow-[2px_0_4px_-2px_rgba(15,23,42,0.08)]'
                                  : ''
                            }`}
                          >
                            {col.header}
                          </th>
                        );
                      })}
                      <th
                        scope="col"
                        className="no-print sticky right-0 z-20 bg-slate-100 px-3 py-3 text-right font-semibold text-slate-700 whitespace-nowrap shadow-[-2px_0_4px_-2px_rgba(15,23,42,0.08)]"
                      >
                        Actions
                      </th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-200/80">
                    {filteredRecords.map((record) => {
                      const isEditingRow = record.id === editingId;
                      const isCheckedRow = record.id === selectedRecordId;
                      const isHighlighted = isEditingRow || isCheckedRow;
                      const isEBillSubmitted =
                        String(record.status || '').trim().toLowerCase() === 'e-bill submitted';
                      const rowBg = isEBillSubmitted
                        ? 'bg-emerald-100 hover:bg-emerald-200/70'
                        : isHighlighted
                          ? 'bg-teal-50/50'
                          : 'bg-white hover:bg-slate-50/90';
                      const stickyBg = isEBillSubmitted
                        ? 'md:bg-emerald-100 group-hover:md:bg-emerald-200'
                        : isHighlighted
                          ? 'md:bg-teal-50'
                          : 'md:bg-white group-hover:md:bg-slate-50';

                      return (
                        <tr key={record.id} className={`group transition-colors ${rowBg}`}>
                          <td
                            className={`no-print border-r border-slate-100 px-2.5 py-2.5 text-center md:sticky md:left-0 md:z-10 ${stickyBg}`}
                          >
                            <input
                              type="checkbox"
                              checked={isCheckedRow}
                              onChange={() =>
                                setSelectedRecordId((prev) => (prev === record.id ? null : record.id))
                              }
                              aria-label={`Select ${record.patientName || record.claimId || 'patient'} for Extension Proforma`}
                              className="h-4 w-4 cursor-pointer rounded border-slate-300 accent-teal-700"
                            />
                          </td>
                          {visibleColumns.map((col, idx) => {
                            const isStickySr = idx === 0 && col.key === 'srNo';
                            const isStickyClaim = idx === 1 && col.key === 'claimId';
                            const isLongText = col.key === 'address' || col.key === 'diagnosis';

                            return (
                              <td
                                key={col.key}
                                className={`border-r border-slate-100 px-3 py-2.5 text-slate-800 ${
                                  col.align === 'right' ? 'text-right' : 'text-left'
                                } ${col.mono ? 'font-mono tabular-nums text-[12px]' : ''} ${
                                  isLongText ? 'max-w-[260px] truncate' : 'whitespace-nowrap'
                                } ${
                                  isStickySr
                                    ? `md:sticky md:left-[44px] md:z-10 ${stickyBg}`
                                    : isStickyClaim
                                      ? `md:sticky md:left-[116px] md:z-10 md:shadow-[2px_0_4px_-2px_rgba(15,23,42,0.06)] font-medium text-slate-900 ${stickyBg}`
                                      : ''
                                }`}
                                title={isLongText ? record[col.key] : undefined}
                              >
                                {renderCellValue(record, col)}
                              </td>
                            );
                          })}

                          <td
                            className={`no-print sticky right-0 z-10 px-3 py-2 text-right whitespace-nowrap shadow-[-2px_0_4px_-2px_rgba(15,23,42,0.06)] ${
                              isEBillSubmitted
                                ? 'bg-emerald-100 group-hover:bg-emerald-200'
                                : isHighlighted
                                  ? 'bg-teal-50'
                                  : 'bg-white group-hover:bg-slate-50'
                            }`}
                          >
                            {confirmDeleteId === record.id ? (
                              <div className="inline-flex items-center gap-1.5">
                                <button
                                  type="button"
                                  onClick={() => {
                                    onDelete(record.id);
                                    setConfirmDeleteId(null);
                                  }}
                                  className="rounded bg-red-600 px-2 py-1 text-[11px] font-semibold text-white hover:bg-red-700"
                                >
                                  Delete
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setConfirmDeleteId(null)}
                                  className="rounded border border-slate-300 bg-white px-2 py-1 text-[11px] font-medium text-slate-600 hover:bg-slate-50"
                                >
                                  Cancel
                                </button>
                              </div>
                            ) : (
                              <div className="inline-flex items-center gap-1">
                                <button
                                  type="button"
                                  onClick={() => onView(record)}
                                  title="View record details"
                                  aria-label={`View ${record.patientName || record.claimId || 'record'}`}
                                  className="inline-flex h-7 w-7 items-center justify-center rounded-md text-teal-700 transition-colors hover:bg-teal-50 hover:text-teal-900"
                                >
                                  <Eye className="h-3.5 w-3.5" aria-hidden="true" />
                                </button>
                                <button
                                  type="button"
                                  onClick={() => onEdit(record)}
                                  title="Edit record"
                                  aria-label={`Edit ${record.patientName || record.claimId || 'record'}`}
                                  className="inline-flex h-7 w-7 items-center justify-center rounded-md text-slate-600 transition-colors hover:bg-slate-200/70 hover:text-slate-900"
                                >
                                  <Pencil className="h-3.5 w-3.5" aria-hidden="true" />
                                </button>
                                <button
                                  type="button"
                                  onClick={() => onDuplicate(record)}
                                  title="Duplicate record"
                                  aria-label={`Duplicate ${record.patientName || record.claimId || 'record'}`}
                                  className="inline-flex h-7 w-7 items-center justify-center rounded-md text-slate-600 transition-colors hover:bg-slate-200/70 hover:text-slate-900"
                                >
                                  <Copy className="h-3.5 w-3.5" aria-hidden="true" />
                                </button>
                                <button
                                  type="button"
                                  onClick={() => setConfirmDeleteId(record.id)}
                                  title="Delete record"
                                  aria-label={`Delete ${record.patientName || record.claimId || 'record'}`}
                                  className="inline-flex h-7 w-7 items-center justify-center rounded-md text-slate-500 transition-colors hover:bg-red-50 hover:text-red-700"
                                >
                                  <Trash2 className="h-3.5 w-3.5" aria-hidden="true" />
                                </button>
                              </div>
                            )}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                  <tfoot>
                    <tr className="border-t-2 border-slate-200 bg-slate-50 font-semibold text-slate-900">
                      <td className="no-print border-r border-slate-200/70 px-2.5 py-2.5 md:sticky md:left-0 md:z-10 md:bg-slate-50" />
                      {visibleColumns.map((col, idx) => {
                        if (idx === 0) {
                          return (
                            <td
                              key={col.key}
                              className="border-r border-slate-200/70 px-3 py-2.5 text-left whitespace-nowrap md:sticky md:left-[44px] md:z-10 md:bg-slate-50"
                            >
                              Totals
                            </td>
                          );
                        }
                        if (col.key === 'finalBill') {
                          return (
                            <td
                              key={col.key}
                              className="border-r border-slate-200/70 px-3 py-2.5 text-right font-mono tabular-nums whitespace-nowrap"
                            >
                              {formatCurrencyValue(totals.finalBill)}
                            </td>
                          );
                        }
                        if (col.key === 'settledAmount') {
                          return (
                            <td
                              key={col.key}
                              className="border-r border-slate-200/70 px-3 py-2.5 text-right font-mono tabular-nums text-emerald-700 whitespace-nowrap"
                            >
                              {formatCurrencyValue(totals.settledAmount)}
                            </td>
                          );
                        }
                        if (col.key === 'deductionAmount') {
                          return (
                            <td
                              key={col.key}
                              className="border-r border-slate-200/70 px-3 py-2.5 text-right font-mono tabular-nums whitespace-nowrap"
                            >
                              {formatCurrencyValue(totals.deductionAmount)}
                            </td>
                          );
                        }
                        return <td key={col.key} className="border-r border-slate-200/40 px-3 py-2.5" />;
                      })}
                      <td className="no-print sticky right-0 z-10 bg-slate-50 px-3 py-2.5" />
                    </tr>
                  </tfoot>
                </table>
              </div>
            )}
          </section>
        );
      }

      // =========================================================================
      // MAIN APP COMPONENT & STORAGE / CLOUD BRIDGE INTEGRATION
      // =========================================================================
      const STORAGE_KEY = 'esic_claim_register_records_v1';
      const STORAGE_INIT_KEY = 'esic_claim_register_initialized_v1';
      const CUSTOM_COLUMNS_KEY = 'esic_claim_custom_columns_v1';
      const HIDDEN_BASE_COLUMNS_KEY = 'esic_claim_hidden_base_columns_v1';
      const SNOOZE_KEY = 'esic_extension_alert_snooze_v1';
      const GS_URL_KEY = 'esic_google_sync_url_v1';
      const GS_SHEET_KEY = 'esic_google_sync_sheet_v1';
      const GS_LAST_SYNC_KEY = 'esic_google_sync_last_v1';
      const GS_SAVED_AT_KEY = 'esic_google_sync_saved_at_v1';
      const LOCAL_NOTES_KEY = 'esic_permanent_notepad_v1';
      const DEFAULT_SCRIPT_NOTE = {
        id: DEFAULT_SCRIPT_NOTE_ID,
        label: 'Google Apps Script Web App URL',
        content: DEFAULT_SCRIPT_NOTE_URL,
        createdAtIso: DEFAULT_SCRIPT_NOTE_CREATED_AT,
        updatedAtIso: DEFAULT_SCRIPT_NOTE_CREATED_AT,
        source: 'local',
      };

      function getCloudBridge() {
        return (
          window.__ESIC_CLOUD_BRIDGE__ || {
            available: false,
            subscribeAuth(cb) {
              cb(null);
              return () => {};
            },
            async signInWithGoogle() {
              throw new Error('Firebase cloud sync is offline. Local browser storage is active.');
            },
            async signOutFirebase() {},
            async saveGoogleSyncSettingsToCloud() {},
            subscribeGoogleSyncSettings(_uid, onData) {
              onData(null);
              return () => {};
            },
            async addPermanentNoteToCloud(_uid, _label, _content, customId) {
              return customId || `note_${Date.now()}`;
            },
            async updatePermanentNoteInCloud() {},
            async deletePermanentNoteFromCloud() {},
            subscribePermanentNotes(_uid, onData) {
              onData([]);
              return () => {};
            },
          }
        );
      }

      function computeNextSrNo(records) {
        let maxVal = 0;
        records.forEach((rec) => {
          const parsed = Number.parseInt(rec.srNo || '', 10);
          if (Number.isFinite(parsed) && parsed > maxVal) {
            maxVal = parsed;
          }
        });
        return Math.max(maxVal, records.length) + 1;
      }

      function loadInitialRecords() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const initialized = localStorage.getItem(STORAGE_INIT_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
          if (!initialized) {
            const samples = buildSampleClaimRecords();
            localStorage.setItem(STORAGE_INIT_KEY, '1');
            localStorage.setItem(STORAGE_KEY, JSON.stringify(samples));
            return samples;
          }
        } catch {
          return buildSampleClaimRecords();
        }
        return [];
      }

      function loadCustomColumns() {
        try {
          const raw = localStorage.getItem(CUSTOM_COLUMNS_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch {
          return [];
        }
        return [];
      }

      function loadHiddenBaseKeys() {
        try {
          const raw = localStorage.getItem(HIDDEN_BASE_COLUMNS_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          }
        } catch {
          return [];
        }
        return [];
      }

      function loadSnoozedUntil() {
        try {
          const raw = localStorage.getItem(SNOOZE_KEY);
          const parsed = raw ? Number(raw) : 0;
          return Number.isFinite(parsed) ? parsed : 0;
        } catch {
          return 0;
        }
      }

      function loadLocalNotes() {
        try {
          const raw = localStorage.getItem(LOCAL_NOTES_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              const wasRemoved = localStorage.getItem(DEFAULT_SCRIPT_NOTE_REMOVED_KEY) === '1';
              if (!wasRemoved && !parsed.some((note) => note.id === DEFAULT_SCRIPT_NOTE_ID)) {
                return [DEFAULT_SCRIPT_NOTE, ...parsed];
              }
              return parsed;
            }
          }
          if (localStorage.getItem(DEFAULT_SCRIPT_NOTE_REMOVED_KEY) !== '1') {
            return [DEFAULT_SCRIPT_NOTE];
          }
        } catch {
          return [];
        }
        return [];
      }

      function App() {
        const [activeView, setActiveView] = useState('entry');
        const [records, setRecords] = useState(loadInitialRecords);
        const [customColumns, setCustomColumns] = useState(loadCustomColumns);
        const [hiddenBaseKeys, setHiddenBaseKeys] = useState(loadHiddenBaseKeys);
        const [editingId, setEditingId] = useState(null);
        const [isClaimFormOpen, setIsClaimFormOpen] = useState(false);
        const [claimStatusFilter, setClaimStatusFilter] = useState('all');
        const [viewingRecordId, setViewingRecordId] = useState(null);
        const [proformaRecordId, setProformaRecordId] = useState(null);
        const [formP2RecordId, setFormP2RecordId] = useState(null);
        const [permissionLetterRecordId, setPermissionLetterRecordId] = useState(null);
        const [permissionLetterDraft, setPermissionLetterDraft] = useState(null);
        const [isInvoiceCalculatorOpen, setIsInvoiceCalculatorOpen] = useState(false);

        const allColumns = useMemo(
          () => getAllColumns(customColumns).filter((col) => !hiddenBaseKeys.includes(col.key)),
          [customColumns, hiddenBaseKeys]
        );

        const [formData, setFormData] = useState(() =>
          createEmptyForm(computeNextSrNo(loadInitialRecords()), loadCustomColumns())
        );

        const [nowMs, setNowMs] = useState(() => Date.now());

        const [isExtensionModalOpen, setIsExtensionModalOpen] = useState(false);
        const [extensionPromptRecordId, setExtensionPromptRecordId] = useState(null);
        const [snoozedUntil, setSnoozedUntil] = useState(loadSnoozedUntil);

        const [gsWebAppUrl, setGsWebAppUrl] = useState(() => {
          try {
            return localStorage.getItem(GS_URL_KEY) || '';
          } catch {
            return '';
          }
        });
        const [gsSheetName, setGsSheetName] = useState(() => {
          try {
            return localStorage.getItem(GS_SHEET_KEY) || 'ESIC_Claims_Register';
          } catch {
            return 'ESIC_Claims_Register';
          }
        });
        const [gsLastSyncedAt, setGsLastSyncedAt] = useState(() => {
          try {
            return localStorage.getItem(GS_LAST_SYNC_KEY) || null;
          } catch {
            return null;
          }
        });
        const [gsSettingsSavedAt, setGsSettingsSavedAt] = useState(() => {
          try {
            return localStorage.getItem(GS_SAVED_AT_KEY) || null;
          } catch {
            return null;
          }
        });
        const [isSavingSettings, setIsSavingSettings] = useState(false);

        const [cloudBridgeVersion, setCloudBridgeVersion] = useState(0);
        const [authUser, setAuthUser] = useState(null);
        const [isAuthLoading, setIsAuthLoading] = useState(true);
        const [localNotes, setLocalNotes] = useState(loadLocalNotes);
        const [cloudNotes, setCloudNotes] = useState([]);
        const [isSavingNote, setIsSavingNote] = useState(false);

        const gsWebAppUrlRef = useRef(gsWebAppUrl);
        const gsSheetNameRef = useRef(gsSheetName);
        const localNotesRef = useRef(localNotes);
        gsWebAppUrlRef.current = gsWebAppUrl;
        gsSheetNameRef.current = gsSheetName;
        localNotesRef.current = localNotes;

        const [filteredSummary, setFilteredSummary] = useState(null);
        const [notice, setNotice] = useState(null);
        const formAnchorRef = useRef(null);
        const noticeTimerRef = useRef(null);

        useEffect(() => {
          const onCloudReady = () => setCloudBridgeVersion((v) => v + 1);
          window.addEventListener('esic-cloud-ready', onCloudReady);
          return () => window.removeEventListener('esic-cloud-ready', onCloudReady);
        }, []);

        useEffect(() => {
          const id = window.setInterval(() => {
            setNowMs(Date.now());
          }, 60000);
          return () => window.clearInterval(id);
        }, []);

        useEffect(() => {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(records));
            localStorage.setItem(STORAGE_INIT_KEY, '1');
          } catch {
            // Ignore storage quota errors
          }
        }, [records]);

        useEffect(() => {
          try {
            localStorage.setItem(CUSTOM_COLUMNS_KEY, JSON.stringify(customColumns));
          } catch {
            // Ignore storage quota errors
          }
        }, [customColumns]);

        useEffect(() => {
          try {
            localStorage.setItem(HIDDEN_BASE_COLUMNS_KEY, JSON.stringify(hiddenBaseKeys));
          } catch {
            // Ignore storage quota errors
          }
        }, [hiddenBaseKeys]);

        useEffect(() => {
          try {
            localStorage.setItem(GS_URL_KEY, gsWebAppUrl);
            localStorage.setItem(GS_SHEET_KEY, gsSheetName);
            if (gsLastSyncedAt) {
              localStorage.setItem(GS_LAST_SYNC_KEY, gsLastSyncedAt);
            }
            if (gsSettingsSavedAt) {
              localStorage.setItem(GS_SAVED_AT_KEY, gsSettingsSavedAt);
            }
          } catch {
            // Ignore storage quota errors
          }
        }, [gsWebAppUrl, gsSheetName, gsLastSyncedAt, gsSettingsSavedAt]);

        useEffect(() => {
          try {
            localStorage.setItem(LOCAL_NOTES_KEY, JSON.stringify(localNotes));
          } catch {
            // Ignore storage quota errors
          }
        }, [localNotes]);

        useEffect(() => {
          const bridge = getCloudBridge();
          const unsubscribe = bridge.subscribeAuth((user) => {
            setAuthUser(user);
            setIsAuthLoading(false);
          });
          return unsubscribe;
        }, [cloudBridgeVersion]);

        useEffect(() => {
          if (!authUser) {
            setCloudNotes([]);
            return;
          }

          const bridge = getCloudBridge();
          const uid = authUser.uid;
          let migratedLocalSettings = false;
          let migratedLocalNotes = false;

          const unsubSettings = bridge.subscribeGoogleSyncSettings(
            uid,
            (cloudSettings) => {
              if (cloudSettings) {
                setGsWebAppUrl(cloudSettings.webAppUrl);
                setGsSheetName(cloudSettings.sheetName);
                if (cloudSettings.updatedAtIso) {
                  setGsSettingsSavedAt(cloudSettings.updatedAtIso);
                }
              } else if (!migratedLocalSettings && gsWebAppUrlRef.current.trim()) {
                migratedLocalSettings = true;
                bridge
                  .saveGoogleSyncSettingsToCloud(
                    uid,
                    gsWebAppUrlRef.current,
                    gsSheetNameRef.current || 'ESIC_Claims_Register'
                  )
                  .catch((err) => {
                    console.error('Auto-migration of local Google Sync settings failed:', err);
                  });
              }
            },
            (err) => {
              console.error('Google Sync settings listener error:', err);
            }
          );

          const unsubNotes = bridge.subscribePermanentNotes(
            uid,
            (notesFromCloud) => {
              setCloudNotes(notesFromCloud);
              if (!migratedLocalNotes && localNotesRef.current.length > 0) {
                migratedLocalNotes = true;
                const existingIds = new Set(notesFromCloud.map((n) => n.id));
                const unsynced = localNotesRef.current.filter((n) => !existingIds.has(n.id));
                unsynced.forEach((item) => {
                  bridge
                    .addPermanentNoteToCloud(uid, item.label, item.content, item.id)
                    .catch((err) => {
                      console.error('Auto-migration of local note failed:', err);
                    });
                });
              }
            },
            (err) => {
              console.error('Permanent notes listener error:', err);
            }
          );

          return () => {
            unsubSettings();
            unsubNotes();
          };
        }, [authUser, cloudBridgeVersion]);

        const mergedNotes = useMemo(() => {
          if (!authUser) return localNotes;
          const byId = new Map();
          localNotes.forEach((n) => byId.set(n.id, n));
          cloudNotes.forEach((n) => byId.set(n.id, n));
          return Array.from(byId.values()).sort((a, b) =>
            b.createdAtIso.localeCompare(a.createdAtIso)
          );
        }, [authUser, cloudNotes, localNotes]);

        const extensionDueRecords = useMemo(
          () => records.filter((rec) => recordNeedsExtensionAlert(rec, nowMs)),
          [records, nowMs]
        );

        useEffect(() => {
          if (extensionDueRecords.length === 0) return;
          if (nowMs < snoozedUntil) return;
          if (isExtensionModalOpen) return;

          const timer = window.setTimeout(() => {
            setIsExtensionModalOpen(true);
          }, 800);
          return () => window.clearTimeout(timer);
        }, [extensionDueRecords.length, nowMs, snoozedUntil, isExtensionModalOpen]);

        const allRecordsTotals = useMemo(() => {
          return records.reduce(
            (acc, rec) => {
              acc.finalBill += parseNumericAmount(rec.finalBill || '');
              acc.settledAmount += parseNumericAmount(rec.settledAmount || '');
              acc.deductionAmount += parseNumericAmount(rec.deductionAmount || '');
              const status = (rec.status || '').trim();
              if (status === 'E-Bill Submitted') acc.eBillSubmittedCount += 1;
              if (status === 'Admitted') acc.admittedCount += 1;
              if (status === 'Discharge') acc.dischargeCount += 1;
              if (status === 'Hard-Copy Submitted') acc.hardCopySubmittedCount += 1;
              if (status === 'Query') acc.queryCount += 1;
              return acc;
            },
            {
              displayedCount: records.length,
              totalCount: records.length,
              finalBill: 0,
              settledAmount: 0,
              deductionAmount: 0,
              eBillSubmittedCount: 0,
              admittedCount: 0,
              dischargeCount: 0,
              hardCopySubmittedCount: 0,
              queryCount: 0,
            }
          );
        }, [records]);

        const topKpi =
          (activeView === 'entry' || activeView === 'register') && filteredSummary
            ? filteredSummary
            : allRecordsTotals;

        const handleDashboardStatusFilter = (status) => {
          setClaimStatusFilter(status);
          setIsClaimFormOpen(false);
          setActiveView('register');
        };

        const showNotice = useCallback((text, tone = 'success') => {
          setNotice({ text, tone });
          if (noticeTimerRef.current !== null) {
            window.clearTimeout(noticeTimerRef.current);
          }
          noticeTimerRef.current = window.setTimeout(() => {
            setNotice(null);
          }, 4200);
        }, []);

        const resetForNewEntry = useCallback(
          (currentRecords = records, currentCustom = customColumns) => {
            setEditingId(null);
            setFormData(createEmptyForm(computeNextSrNo(currentRecords), currentCustom));
          },
          [records, customColumns]
        );

        const handleStartNewEntry = () => {
          resetForNewEntry(records, customColumns);
          setIsClaimFormOpen(true);
          setActiveView('entry');
          window.requestAnimationFrame(() => {
            if (formAnchorRef.current) {
              formAnchorRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            const firstInput = document.getElementById('field-claimId');
            if (firstInput) firstInput.focus();
          });
        };

        const handleAddCustomColumn = (header, group, inputType) => {
          const trimmed = header.trim();
          if (!trimmed) {
            return { ok: false, error: 'Header name cannot be empty.' };
          }
          const normNew = normalizeHeader(trimmed);
          const duplicate = allColumns.some((c) => normalizeHeader(c.header) === normNew);
          if (duplicate) {
            return { ok: false, error: `Header "${trimmed}" already exists in the register.` };
          }

          const existingKeys = new Set(allColumns.map((c) => c.key));
          const key = createCustomColumnKey(trimmed, existingKeys);
          const newCol = {
            id: `col-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
            key,
            header: trimmed,
            group,
            inputType,
          };

          setCustomColumns((prev) => [...prev, newCol]);
          setFormData((prev) => ({ ...prev, [key]: prev[key] || '' }));
          showNotice(`Added "${trimmed}" box & header (synced with Register, Excel, and Google Sync).`);
          return { ok: true };
        };

        const handleRemoveCustomColumn = (id) => {
          const target = customColumns.find((c) => c.id === id);
          setCustomColumns((prev) => prev.filter((c) => c.id !== id));
          if (target) {
            showNotice(`Removed custom box & header "${target.header}".`);
          }
        };

        const handleRenameCustomColumn = (id, newHeader) => {
          const trimmed = newHeader.trim();
          if (!trimmed) {
            return { ok: false, error: 'Header name cannot be empty.' };
          }
          const normNew = normalizeHeader(trimmed);
          const duplicate = allColumns.some(
            (c) => c.customId !== id && normalizeHeader(c.header) === normNew
          );
          if (duplicate) {
            return { ok: false, error: `Header "${trimmed}" already exists.` };
          }
          setCustomColumns((prev) =>
            prev.map((col) => (col.id === id ? { ...col, header: trimmed } : col))
          );
          showNotice(`Renamed custom header to "${trimmed}".`);
          return { ok: true };
        };

        const handleHideBaseColumn = (key) => {
          const target = allColumns.find((c) => c.key === key);
          setHiddenBaseKeys((prev) => (prev.includes(key) ? prev : [...prev, key]));
          if (target) {
            showNotice(`Removed "${target.header}" box & header (can be restored anytime).`);
          }
        };

        const handleRestoreBaseColumn = (key) => {
          setHiddenBaseKeys((prev) => prev.filter((k) => k !== key));
        };

        const handleRestoreAllBaseColumns = () => {
          setHiddenBaseKeys([]);
          showNotice('Restored all default ESIC claim boxes & headers.');
        };

        const handleFormSubmit = (keepEntering) => {
          const now = new Date().toISOString();
          const cleanedForm = { ...formData };
          allColumns.forEach((col) => {
            cleanedForm[col.key] = (cleanedForm[col.key] || '').trim();
          });

          if (editingId) {
            const updatedRecords = records.map((rec) =>
              rec.id === editingId
                ? {
                    ...rec,
                    ...cleanedForm,
                    updatedAt: now,
                  }
                : rec
            );
            setRecords(updatedRecords);
            resetForNewEntry(updatedRecords, customColumns);
            setIsClaimFormOpen(keepEntering);
            showNotice(
              `Updated claim record ${cleanedForm.claimId || cleanedForm.patientName || `#${cleanedForm.srNo}`}.`
            );
            return;
          }

          const newRecord = {
            ...cleanedForm,
            srNo: cleanedForm.srNo || String(computeNextSrNo(records)),
            id: `esic-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            createdAt: now,
            updatedAt: now,
          };

          const nextRecords = [...records, newRecord];
          setRecords(nextRecords);
          resetForNewEntry(nextRecords, customColumns);
          setIsClaimFormOpen(keepEntering);
          showNotice(
            `Saved claim entry ${newRecord.claimId || newRecord.patientName || `#${newRecord.srNo}`}.`
          );

          if (recordNeedsExtensionAlert(newRecord, Date.now())) {
            setSnoozedUntil(0);
            try {
              localStorage.removeItem(SNOOZE_KEY);
            } catch {
              // ignore
            }
            setExtensionPromptRecordId(null);
            setIsExtensionModalOpen(true);
          }

          if (keepEntering) {
            window.requestAnimationFrame(() => {
              const firstInput = document.getElementById('field-claimId');
              if (firstInput) firstInput.focus();
            });
          }
        };

        const handleEditRecord = (record) => {
          const nextForm = createEmptyForm(computeNextSrNo(records), customColumns);
          allColumns.forEach((col) => {
            const value = record[col.key] ?? '';
            nextForm[col.key] =
              col.inputType === 'date' ? normalizeDateInputValue(value) : value;
          });
          nextForm.admissionRemark = record.admissionRemark || '';
          nextForm.admissionImplantsJson = record.admissionImplantsJson || '';
          setEditingId(record.id);
          setIsClaimFormOpen(true);
          setFormData(nextForm);
          setActiveView('entry');
          window.requestAnimationFrame(() => {
            if (formAnchorRef.current) {
              formAnchorRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
          });
        };

        const handleDuplicateRecord = (record) => {
          const now = new Date().toISOString();
          const nextSr = String(computeNextSrNo(records));
          const duplicated = {
            ...record,
            id: `esic-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            srNo: nextSr,
            claimId: record.claimId ? `${record.claimId}-COPY` : '',
            createdAt: now,
            updatedAt: now,
          };
          const nextRecords = [...records, duplicated];
          setRecords(nextRecords);
          if (!editingId) {
            setFormData((prev) => ({ ...prev, srNo: String(computeNextSrNo(nextRecords)) }));
          }
          showNotice(`Duplicated record as SR NO ${nextSr}.`);
        };

        const handleDeleteRecord = (id) => {
          const nextRecords = records.filter((rec) => rec.id !== id);
          setRecords(nextRecords);
          if (editingId === id) {
            resetForNewEntry(nextRecords, customColumns);
            setIsClaimFormOpen(false);
          }
          if (viewingRecordId === id) {
            setViewingRecordId(null);
          }
          showNotice('Deleted claim record from register.');
        };

        const handleClearAll = () => {
          setRecords([]);
          resetForNewEntry([], customColumns);
          setIsClaimFormOpen(false);
          setViewingRecordId(null);
          showNotice('Cleared all claim records.');
        };

        const handleExportCsv = () => {
          if (records.length === 0) return;
          const csv = exportClaimsToCsv(records, allColumns);
          const today = new Date().toISOString().slice(0, 10);
          triggerFileDownload(csv, `esic-claim-register-${today}.csv`, 'text/csv;charset=utf-8;');
          showNotice(`Exported ${records.length} records (${allColumns.length} headers) to CSV.`);
        };

        const handleExportExcel = () => {
          if (records.length === 0) return;
          const htmlWorkbook = exportClaimsToExcelWorkbook(records, allColumns);
          const today = new Date().toISOString().slice(0, 10);
          triggerFileDownload(
            htmlWorkbook,
            `esic-claim-register-${today}.xls`,
            'application/vnd.ms-excel;charset=utf-8;'
          );
          showNotice(`Exported ${records.length} records (${allColumns.length} headers) to Excel (.xls).`);
        };

        const handleImportCsvFile = (file) => {
          const reader = new FileReader();
          reader.onload = () => {
            const text = typeof reader.result === 'string' ? reader.result : '';
            const { records: imported, newCustomColumns } = importClaimsFromCsv(
              text,
              allColumns,
              computeNextSrNo(records)
            );
            if (imported.length === 0) {
              showNotice('No valid rows found in CSV file. Check that headers match the register.', 'error');
              return;
            }
            if (newCustomColumns.length > 0) {
              setCustomColumns((prev) => [...prev, ...newCustomColumns]);
            }
            const merged = [...records, ...imported];
            setRecords(merged);
            if (!editingId) {
              setFormData((prev) => ({ ...prev, srNo: String(computeNextSrNo(merged)) }));
            }
            showNotice(
              `Imported ${imported.length} claim ${imported.length === 1 ? 'record' : 'records'}${
                newCustomColumns.length > 0 ? ` (+${newCustomColumns.length} custom columns)` : ''
              }.`
            );
          };
          reader.onerror = () => {
            showNotice('Could not read the selected CSV file.', 'error');
          };
          reader.readAsText(file);
        };

        const handleApproveExtension = (
          recordId,
          approvedDate,
          extensionSendDate,
          approvedDays
        ) => {
          const nowIso = new Date().toISOString();
          setRecords((prev) =>
            prev.map((rec) =>
              rec.id === recordId
                ? {
                    ...rec,
                    extensionDateSned: extensionSendDate || rec.extensionDateSned || nowIso.slice(0, 10),
                    extensionApprovedUpTo: approvedDate,
                    status: 'Extension Approved',
                    updatedAt: nowIso,
                  }
                : rec
            )
          );
          showNotice(
            `Extension approved up to ${approvedDate} — Total approval granted: ${approvedDays} ${
              approvedDays === 1 ? 'day' : 'days'
            }.`
          );
        };

        const handleSnoozeExtensionAlert = () => {
          const nextTrigger = Date.now() + THREE_HOURS_MS;
          setSnoozedUntil(nextTrigger);
          try {
            localStorage.setItem(SNOOZE_KEY, String(nextTrigger));
          } catch {
            // ignore
          }
          setIsExtensionModalOpen(false);
          setExtensionPromptRecordId(null);
          showNotice('Extension reminder snoozed — will pop up again in 3 hours.');
        };

        const handleLoadFromGoogleSheet = (loadedRecords, newCustomColumns, mode) => {
          const nextCustom =
            newCustomColumns.length > 0 ? [...customColumns, ...newCustomColumns] : customColumns;
          if (newCustomColumns.length > 0) {
            setCustomColumns(nextCustom);
          }

          const nextRecords = mode === 'replace' ? loadedRecords : [...records, ...loadedRecords];
          setRecords(nextRecords);
          if (!editingId) {
            setFormData(createEmptyForm(computeNextSrNo(nextRecords), nextCustom));
          }
        };

        const handleSignInGoogle = async () => {
          try {
            const user = await getCloudBridge().signInWithGoogle();
            showNotice(`Signed in as ${(user && user.email) || 'Google user'} — cloud storage active.`);
          } catch (err) {
            showNotice(
              `Sign-in cancelled or failed: ${err instanceof Error ? err.message : String(err)}`,
              'error'
            );
          }
        };

        const handleSignOutGoogle = async () => {
          try {
            await getCloudBridge().signOutFirebase();
            showNotice('Signed out of cloud sync. Local copy remains saved in this browser.');
          } catch (err) {
            showNotice(
              `Sign-out failed: ${err instanceof Error ? err.message : String(err)}`,
              'error'
            );
          }
        };

        const handleSaveSyncSettings = async () => {
          const cleanUrl = gsWebAppUrl.trim();
          const cleanSheet = gsSheetName.trim() || 'ESIC_Claims_Register';
          setGsWebAppUrl(cleanUrl);
          setGsSheetName(cleanSheet);
          setIsSavingSettings(true);
          try {
            const nowIso = new Date().toISOString();
            localStorage.setItem(GS_URL_KEY, cleanUrl);
            localStorage.setItem(GS_SHEET_KEY, cleanSheet);
            localStorage.setItem(GS_SAVED_AT_KEY, nowIso);
            setGsSettingsSavedAt(nowIso);

            if (authUser) {
              await getCloudBridge().saveGoogleSyncSettingsToCloud(authUser.uid, cleanUrl, cleanSheet);
              showNotice('Permanently saved Web App URL & Sheet Tab Name to cloud (persists before & after publish).');
            } else {
              showNotice('Saved Web App URL & Sheet Tab Name locally. Sign in with Google to sync across publish.');
            }
          } catch (err) {
            showNotice(
              `Could not save to cloud: ${err instanceof Error ? err.message : String(err)}`,
              'error'
            );
          } finally {
            setIsSavingSettings(false);
          }
        };

        const handleSaveNewNote = async (label, content) => {
          setIsSavingNote(true);
          const nowIso = new Date().toISOString();
          const noteId = `note_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
          const localEntry = {
            id: noteId,
            label,
            content,
            createdAtIso: nowIso,
            updatedAtIso: nowIso,
            source: authUser ? 'cloud' : 'local',
          };

          try {
            setLocalNotes((prev) => [localEntry, ...prev]);
            if (authUser) {
              await getCloudBridge().addPermanentNoteToCloud(authUser.uid, label, content, noteId);
              showNotice('Saved note permanently to cloud notepad.');
            } else {
              showNotice('Saved note locally. Sign in with Google to keep it synced across publish.');
            }
          } catch (err) {
            showNotice(
              `Saved locally, but cloud sync failed: ${err instanceof Error ? err.message : String(err)}`,
              'error'
            );
          } finally {
            setIsSavingNote(false);
          }
        };

        const handleUpdateNote = async (id, label, content) => {
          const nowIso = new Date().toISOString();
          setLocalNotes((prev) =>
            prev.map((n) => (n.id === id ? { ...n, label, content, updatedAtIso: nowIso } : n))
          );
          if (authUser) {
            try {
              await getCloudBridge().updatePermanentNoteInCloud(authUser.uid, id, label, content);
              showNotice('Updated permanent notepad entry in cloud.');
            } catch (err) {
              showNotice(
                `Could not update cloud note: ${err instanceof Error ? err.message : String(err)}`,
                'error'
              );
            }
          } else {
            showNotice('Updated permanent notepad entry.');
          }
        };

        const handleDeleteNote = async (note) => {
          if (!window.confirm(`Remove "${note.label || 'Saved Note'}" from the permanent notepad?`)) return;
          if (note.id === DEFAULT_SCRIPT_NOTE_ID) {
            try {
              localStorage.setItem(DEFAULT_SCRIPT_NOTE_REMOVED_KEY, '1');
            } catch (err) {
              showNotice(
                `Could not remember removal of the default URL: ${err instanceof Error ? err.message : String(err)}`,
                'error'
              );
              return;
            }
          }
          try {
            if (authUser) {
              await getCloudBridge().deletePermanentNoteFromCloud(authUser.uid, note.id);
            }
            setLocalNotes((prev) => prev.filter((item) => item.id !== note.id));
            showNotice('Removed permanent notepad entry.');
          } catch (err) {
            showNotice(
              `Could not remove notepad entry: ${err instanceof Error ? err.message : String(err)}`,
              'error'
            );
          }
        };
