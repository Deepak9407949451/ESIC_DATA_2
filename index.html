        const editingRecord = editingId ? records.find((r) => r.id === editingId) : undefined;
        const editingLabel = editingRecord
          ? editingRecord.claimId || editingRecord.patientName || `SR NO ${editingRecord.srNo}`
          : undefined;

        const viewingRecord = viewingRecordId
          ? records.find((r) => r.id === viewingRecordId) || null
          : null;

        const proformaRecord = proformaRecordId
          ? records.find((r) => r.id === proformaRecordId) || null
          : null;

        const formP2Record = formP2RecordId
          ? records.find((r) => r.id === formP2RecordId) || null
          : null;

        const permissionLetterRecord = permissionLetterRecordId
          ? records.find((r) => r.id === permissionLetterRecordId) || null
          : null;

        const extensionModalRecords = useMemo(() => {
          if (!extensionPromptRecordId) return extensionDueRecords;
          const alreadyInList = extensionDueRecords.some((r) => r.id === extensionPromptRecordId);
          if (alreadyInList) return extensionDueRecords;
          const target = records.find((r) => r.id === extensionPromptRecordId);
          return target ? [target, ...extensionDueRecords] : extensionDueRecords;
        }, [extensionDueRecords, extensionPromptRecordId, records]);

        const mobileNavItems = [
          { id: 'entry', label: 'Entry Form' },
          { id: 'register', label: 'Claim Register' },
          { id: 'googleSync', label: 'Google Sync' },
          { id: 'html', label: 'HTML Export' },
        ];

        return (
          <div className="min-h-screen bg-slate-50 text-slate-900 flex flex-col">
            <header className="sticky top-0 z-30 border-b border-slate-200 bg-white/95 backdrop-blur-xs">
              <div className="mx-auto flex h-16 max-w-[1440px] items-center justify-between gap-8 px-4 sm:px-6 lg:px-8">
                <button
                  type="button"
                  onClick={() => {
                    setIsClaimFormOpen(true);
                    setActiveView('entry');
                  }}
                  className="font-display text-lg font-bold tracking-tight text-slate-900 whitespace-nowrap shrink-0 text-left focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700"
                >
                  ESIC Claim Register
                </button>

                <nav
                  aria-label="Primary workspace navigation"
                  className="hidden md:flex items-center gap-7 text-sm font-medium"
                >
                  <button
                    type="button"
                    onClick={() => setActiveView('entry')}
                    className={`py-1 transition-colors whitespace-nowrap shrink-0 border-b-2 ${
                      activeView === 'entry'
                        ? 'border-teal-700 text-slate-900 font-semibold'
                        : 'border-transparent text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Entry Form
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveView('register')}
                    className={`py-1 transition-colors whitespace-nowrap shrink-0 border-b-2 ${
                      activeView === 'register'
                        ? 'border-teal-700 text-slate-900 font-semibold'
                        : 'border-transparent text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Claim Register
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveView('googleSync')}
                    className={`py-1 transition-colors whitespace-nowrap shrink-0 border-b-2 ${
                      activeView === 'googleSync'
                        ? 'border-teal-700 text-slate-900 font-semibold'
                        : 'border-transparent text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Google Sync
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveView('html')}
                    className={`py-1 transition-colors whitespace-nowrap shrink-0 border-b-2 ${
                      activeView === 'html'
                        ? 'border-teal-700 text-slate-900 font-semibold'
                        : 'border-transparent text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    HTML Export
                  </button>
                  <button
                    type="button"
                    onClick={() => setIsInvoiceCalculatorOpen(true)}
                    className={`py-1 transition-colors whitespace-nowrap shrink-0 border-b-2 ${
                      isInvoiceCalculatorOpen
                        ? 'border-teal-700 text-slate-900 font-semibold'
                        : 'border-transparent text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Invoice Calculator
                  </button>
                </nav>

                <div className="flex items-center shrink-0">
                  <button
                    type="button"
                    onClick={handleStartNewEntry}
                    className="inline-flex h-9 items-center rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white transition-colors hover:bg-teal-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-teal-700 whitespace-nowrap shrink-0"
                  >
                    New Entry
                  </button>
                </div>
              </div>
            </header>

            <div className="no-print overflow-x-auto border-b border-slate-200 bg-white px-4 py-2 md:hidden">
              <div className="flex items-center gap-5 text-sm font-medium">
                {mobileNavItems.map((item) => (
                  <button
                    key={item.id}
                    type="button"
                    onClick={() => {
                      if (item.id === 'entry') setIsClaimFormOpen(true);
                      setActiveView(item.id);
                    }}
                    className={`py-1 whitespace-nowrap shrink-0 border-b-2 ${
                      activeView === item.id
                        ? 'border-teal-700 text-slate-900 font-semibold'
                        : 'border-transparent text-slate-600'
                    }`}
                  >
                    {item.label}
                  </button>
                ))}
                <button
                  type="button"
                  onClick={() => setIsInvoiceCalculatorOpen(true)}
                  className={`py-1 whitespace-nowrap shrink-0 border-b-2 ${
                    isInvoiceCalculatorOpen
                      ? 'border-teal-700 text-slate-900 font-semibold'
                      : 'border-transparent text-slate-600'
                  }`}
                >
                  Invoice Calculator
                </button>
              </div>
            </div>

            <main className="mx-auto w-full max-w-[1440px] flex-1 px-4 py-6 sm:px-6 lg:px-8">
              <div ref={formAnchorRef} className="mb-5 flex flex-wrap items-end justify-between gap-4">
                <div>
                  <h1 className="font-display text-2xl font-bold tracking-tight text-slate-900 [text-wrap:balance]">
                    {activeView === 'entry'
                      ? 'ESIC Patient & Claim Data Entry'
                      : activeView === 'register'
                        ? 'ESIC Claims Master Register'
                        : activeView === 'googleSync'
                          ? 'Google Sheets Sync & Auto-Updated Script'
                          : 'Standalone HTML Form & Table Source'}
                  </h1>
                  <div className="mt-1.5 flex flex-wrap items-center gap-2 text-xs text-slate-500">
                    <span>{allColumns.length} active ESIC headers</span>
                    <span aria-hidden="true">·</span>
                    <span className="font-mono tabular-nums">
                      {records.length} {records.length === 1 ? 'record' : 'records'} stored locally
                    </span>
                    <span aria-hidden="true">·</span>
                    <span>Excel, CSV, HTML &amp; Google Sync ready</span>
                  </div>
                </div>

                <div className="flex flex-wrap items-center gap-2.5">
                  {extensionDueRecords.length > 0 ? (
                    <button
                      type="button"
                      onClick={() => {
                        setExtensionPromptRecordId(null);
                        setIsExtensionModalOpen(true);
                      }}
                      className="no-print inline-flex h-9 items-center gap-1.5 rounded-lg border border-amber-300 bg-amber-50 px-3.5 text-xs font-semibold text-amber-900 transition-colors hover:bg-amber-100 whitespace-nowrap"
                    >
                      <AlertTriangle className="h-3.5 w-3.5 text-amber-700" aria-hidden="true" />
                      Extension Required ({extensionDueRecords.length})
                    </button>
                  ) : null}

                  {notice ? (
                    <div
                      role="status"
                      aria-live="polite"
                      className={`rounded-lg border px-3.5 py-2 text-xs font-medium ${
                        notice.tone === 'error'
                          ? 'border-red-200 bg-red-50 text-red-800'
                          : 'border-emerald-200 bg-emerald-50 text-emerald-800'
                      }`}
                    >
                      {notice.text}
                    </div>
                  ) : null}
                </div>
              </div>

              <section
                aria-label="Claims Dashboard"
                className="mb-6 grid grid-cols-2 divide-y divide-slate-200 rounded-xl border border-slate-200 bg-white sm:grid-cols-4 sm:divide-x sm:divide-y-0 xl:grid-cols-8"
              >
                <button
                  type="button"
                  onClick={() => handleDashboardStatusFilter('all')}
                  aria-pressed={claimStatusFilter === 'all'}
                  title="Show all claims in the register"
                  className={`px-6 py-4 text-left transition-colors hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-inset focus-visible:outline-teal-700 ${claimStatusFilter === 'all' ? 'bg-teal-50/60' : ''}`}
                >
                  <div className="text-xs font-medium text-slate-500">Displayed Claims</div>
                  <div className="mt-1 font-mono text-xl font-semibold text-slate-900 tabular-nums">
                    {topKpi.displayedCount}
                    {topKpi.displayedCount !== topKpi.totalCount ? (
                      <span className="ml-1.5 text-xs font-normal text-slate-400">
                        of {topKpi.totalCount}
                      </span>
                    ) : null}
                  </div>
                </button>
                <div className="min-w-0 px-6 py-4">
                  <div className="text-xs font-medium text-slate-500">Total Final Bill</div>
                  <div className="mt-1 whitespace-nowrap font-mono text-base font-semibold leading-tight tracking-tight text-slate-900 tabular-nums lg:text-lg xl:text-base 2xl:text-lg">
                    ₹{formatCurrencyValue(topKpi.finalBill)}
                  </div>
                </div>
                <div className="px-6 py-4">
                  <div className="text-xs font-medium text-slate-500">Total Settled Amount</div>
                  <div className="mt-1 font-mono text-xl font-semibold text-emerald-700 tabular-nums">
                    ₹{formatCurrencyValue(topKpi.settledAmount)}
                  </div>
                </div>
                <button
                  type="button"
                  onClick={() => handleDashboardStatusFilter('E-Bill Submitted')}
                  aria-pressed={claimStatusFilter === 'E-Bill Submitted'}
                  className={`px-6 py-4 text-left transition-colors hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-inset focus-visible:outline-teal-700 ${claimStatusFilter === 'E-Bill Submitted' ? 'bg-teal-50/60' : ''}`}
                >
                  <div className="text-xs font-medium text-slate-500">E-Bill Submitted</div>
                  <div className="mt-1 font-mono text-xl font-semibold text-teal-700 tabular-nums">
                    {topKpi.eBillSubmittedCount}
                  </div>
                </button>
                <button
                  type="button"
                  onClick={() => handleDashboardStatusFilter('Admitted')}
                  aria-pressed={claimStatusFilter === 'Admitted'}
                  className={`px-6 py-4 text-left transition-colors hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-inset focus-visible:outline-teal-700 ${claimStatusFilter === 'Admitted' ? 'bg-teal-50/60' : ''}`}
                >
                  <div className="text-xs font-medium text-slate-500">Admitted</div>
                  <div className="mt-1 font-mono text-xl font-semibold text-amber-700 tabular-nums">
                    {topKpi.admittedCount}
                  </div>
                </button>
                <button
                  type="button"
                  onClick={() => handleDashboardStatusFilter('Discharge')}
                  aria-pressed={claimStatusFilter === 'Discharge'}
                  className={`px-6 py-4 text-left transition-colors hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-inset focus-visible:outline-teal-700 ${claimStatusFilter === 'Discharge' ? 'bg-teal-50/60' : ''}`}
                >
                  <div className="text-xs font-medium text-slate-500">Discharge</div>
                  <div className="mt-1 font-mono text-xl font-semibold text-slate-700 tabular-nums">
                    {topKpi.dischargeCount}
                  </div>
                </button>
                <button
                  type="button"
                  onClick={() => handleDashboardStatusFilter('Hard-Copy Submitted')}
                  aria-pressed={claimStatusFilter === 'Hard-Copy Submitted'}
                  className={`px-6 py-4 text-left transition-colors hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-inset focus-visible:outline-teal-700 ${claimStatusFilter === 'Hard-Copy Submitted' ? 'bg-teal-50/60' : ''}`}
                >
                  <div className="text-xs font-medium text-slate-500">Hard-Copy Submitted</div>
                  <div className="mt-1 font-mono text-xl font-semibold text-teal-700 tabular-nums">
                    {topKpi.hardCopySubmittedCount}
                  </div>
                </button>
                <button
                  type="button"
                  onClick={() => handleDashboardStatusFilter('Query')}
                  aria-pressed={claimStatusFilter === 'Query'}
                  className={`px-6 py-4 text-left transition-colors hover:bg-slate-50 focus-visible:outline-2 focus-visible:outline-inset focus-visible:outline-teal-700 ${claimStatusFilter === 'Query' ? 'bg-teal-50/60' : ''}`}
                >
                  <div className="text-xs font-medium text-slate-500">Query</div>
                  <div className="mt-1 font-mono text-xl font-semibold text-amber-700 tabular-nums">
                    {topKpi.queryCount}
                  </div>
                </button>
              </section>

              {activeView === 'entry' ? (
                <div className="space-y-8">
                  {isClaimFormOpen ? (
                    <ClaimForm
                      columns={allColumns}
                      customColumns={customColumns}
                      hiddenBaseKeys={hiddenBaseKeys}
                      formData={formData}
                      isEditing={Boolean(editingId)}
                      editingLabel={editingLabel}
                      nowMs={nowMs}
                      onChange={setFormData}
                      onAddCustomColumn={handleAddCustomColumn}
                      onRemoveCustomColumn={handleRemoveCustomColumn}
                      onRenameCustomColumn={handleRenameCustomColumn}
                      onHideBaseColumn={handleHideBaseColumn}
                      onRestoreBaseColumn={handleRestoreBaseColumn}
                      onRestoreAllBaseColumns={handleRestoreAllBaseColumns}
                      onSubmit={handleFormSubmit}
                      onOpenPermissionLetter={(draft) => {
                        setPermissionLetterRecordId(null);
                        setPermissionLetterDraft({ ...draft });
                      }}
                      onReset={() => setFormData(createEmptyForm(computeNextSrNo(records), customColumns))}
                      onCancelEdit={() => {
                        resetForNewEntry(records, customColumns);
                        setIsClaimFormOpen(false);
                      }}
                    />
                  ) : null}

                  <ClaimTable
                    columns={allColumns}
                    records={records}
                    editingId={editingId}
                    nowMs={nowMs}
                    statusFilter={claimStatusFilter}
                    onStatusFilterChange={setClaimStatusFilter}
                    onView={(rec) => setViewingRecordId(rec.id)}
                    onEdit={handleEditRecord}
                    onDuplicate={handleDuplicateRecord}
                    onDelete={handleDeleteRecord}
                    onOpenExtensionProforma={(rec) => setProformaRecordId(rec.id)}
                    onOpenFormP2={(rec) => setFormP2RecordId(rec.id)}
                    onOpenPermissionLetter={(rec) => {
                      setPermissionLetterRecordId(null);
                      setPermissionLetterDraft({
                        ...rec,
                        ...(editingId === rec.id ? formData : {}),
                      });
                    }}
                    onClearAll={handleClearAll}
                    onExportCsv={handleExportCsv}
                    onExportExcel={handleExportExcel}
                    onImportCsvFile={handleImportCsvFile}
                    onStartNewEntry={handleStartNewEntry}
                    onFilteredSummaryChange={setFilteredSummary}
                    compactHeader
                  />
                </div>
              ) : activeView === 'register' ? (
                <ClaimTable
                  columns={allColumns}
                  records={records}
                  editingId={editingId}
                  nowMs={nowMs}
                  statusFilter={claimStatusFilter}
                  onStatusFilterChange={setClaimStatusFilter}
                  onView={(rec) => setViewingRecordId(rec.id)}
                  onEdit={handleEditRecord}
                  onDuplicate={handleDuplicateRecord}
                  onDelete={handleDeleteRecord}
                  onOpenExtensionProforma={(rec) => setProformaRecordId(rec.id)}
                  onOpenFormP2={(rec) => setFormP2RecordId(rec.id)}
                  onOpenPermissionLetter={(rec) => {
                    setPermissionLetterDraft(null);
                    setPermissionLetterRecordId(rec.id);
                  }}
                  onClearAll={handleClearAll}
                  onExportCsv={handleExportCsv}
                  onExportExcel={handleExportExcel}
                  onImportCsvFile={handleImportCsvFile}
                  onStartNewEntry={handleStartNewEntry}
                  onFilteredSummaryChange={setFilteredSummary}
                />
              ) : activeView === 'googleSync' ? (
                <GoogleSyncView
                  columns={allColumns}
                  records={records}
                  webAppUrl={gsWebAppUrl}
                  sheetName={gsSheetName}
                  lastSyncedAt={gsLastSyncedAt}
                  authUserEmail={(authUser && authUser.email) || null}
                  isAuthLoading={isAuthLoading}
                  isSavingSettings={isSavingSettings}
                  settingsSavedAt={gsSettingsSavedAt}
                  notes={mergedNotes}
                  isSavingNote={isSavingNote}
                  onWebAppUrlChange={setGsWebAppUrl}
                  onSheetNameChange={setGsSheetName}
                  onSaveSyncSettings={handleSaveSyncSettings}
                  onSignInGoogle={handleSignInGoogle}
                  onSignOutGoogle={handleSignOutGoogle}
                  onSaveNewNote={handleSaveNewNote}
                  onUpdateNote={handleUpdateNote}
                  onDeleteNote={handleDeleteNote}
                  onSyncComplete={(timestamp, message) => {
                    setGsLastSyncedAt(timestamp);
                    showNotice(message);
                  }}
                  onLoadFromSheet={handleLoadFromGoogleSheet}
                />
              ) : (
                <HtmlExportView columns={allColumns} records={records} />
              )}
            </main>

            <footer className="no-print mt-12 border-t border-slate-200 bg-white">
              <div className="mx-auto flex max-w-[1440px] flex-wrap items-center justify-between gap-4 px-4 py-4 text-xs text-slate-500 sm:px-6 lg:px-8">
                <span>ESIC Claim Register — {allColumns.length}-Column Hospital Billing Entry Sheet</span>
                <div className="flex items-center gap-5">
                  <button
                    type="button"
                    onClick={() => setActiveView('googleSync')}
                    className="font-medium text-teal-700 hover:text-teal-800 hover:underline whitespace-nowrap"
                  >
                    Google Sync Script
                  </button>
                  <button
                    type="button"
                    onClick={() => setActiveView('html')}
                    className="font-medium text-teal-700 hover:text-teal-800 hover:underline whitespace-nowrap"
                  >
                    Download standalone HTML
                  </button>
                </div>
              </div>
            </footer>

            <ViewRecordModal
              record={viewingRecord}
              columns={allColumns}
              nowMs={nowMs}
              onClose={() => setViewingRecordId(null)}
              onEdit={handleEditRecord}
              onSendExtension={(rec) => {
                setViewingRecordId(null);
                setExtensionPromptRecordId(rec.id);
                setIsExtensionModalOpen(true);
              }}
            />

            <ExtensionAlertModal
              isOpen={isExtensionModalOpen}
              dueRecords={extensionModalRecords}
              nowMs={nowMs}
              initialPromptRecordId={extensionPromptRecordId}
              onApproveExtension={handleApproveExtension}
              onSnoozeThreeHours={handleSnoozeExtensionAlert}
              onClose={() => {
                setIsExtensionModalOpen(false);
                setExtensionPromptRecordId(null);
              }}
            />

            <ExtensionProformaModal
              record={proformaRecord}
              columns={allColumns}
              onClose={() => setProformaRecordId(null)}
            />

            <FormP2Modal
              record={formP2Record}
              columns={allColumns}
              onClose={() => setFormP2RecordId(null)}
            />

            <PermissionLetterModal
              record={permissionLetterDraft || permissionLetterRecord}
              onClose={() => {
                setPermissionLetterRecordId(null);
                setPermissionLetterDraft(null);
              }}
            />

            <InvoiceCalculatorModal
              isOpen={isInvoiceCalculatorOpen}
              onClose={() => setIsInvoiceCalculatorOpen(false)}
            />
          </div>
        );
      }

      const rootEl = document.getElementById('root');
      if (rootEl) {
        ReactDOM.createRoot(rootEl).render(
          <ErrorBoundary>
            <App />
          </ErrorBoundary>
        );
      }
    </script>
  </body>
</html>
