      async function copyTextToClipboard(text) {
        try {
          await navigator.clipboard.writeText(text);
        } catch {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          document.body.appendChild(textarea);
          textarea.select();
          document.execCommand('copy');
          document.body.removeChild(textarea);
        }
      }

      function PermanentNotepad({ notes, isCloudSignedIn, isSavingNote, onSaveNewNote, onUpdateNote, onDeleteNote, onSignInGoogle }) {
        const [labelInput, setLabelInput] = useState('');
        const [contentInput, setContentInput] = useState('');
        const [formError, setFormError] = useState(null);
        const [copiedId, setCopiedId] = useState(null);
        const [editingNoteId, setEditingNoteId] = useState(null);
        const [editLabel, setEditLabel] = useState('');
        const [editContent, setEditContent] = useState('');

        const handleSave = async (e) => {
          e.preventDefault();
          const trimmed = contentInput.trim();
          if (!trimmed) { setFormError('Paste or enter any URL, text, or note before saving.'); return; }
          setFormError(null);
          await onSaveNewNote(labelInput.trim(), trimmed);
          setLabelInput('');
          setContentInput('');
        };

        const handleCopy = async (id, text) => {
          await copyTextToClipboard(text);
          setCopiedId(id);
          window.setTimeout(() => setCopiedId((prev) => (prev === id ? null : prev)), 2000);
        };

        const handleCopyAll = async () => {
          if (notes.length === 0) return;
          const combined = notes.map((n) => (n.label ? `${n.label}:\n${n.content}` : n.content)).join('\n\n---\n\n');
          await handleCopy('__ALL__', combined);
        };

        const handleStartEdit = (note) => { setEditingNoteId(note.id); setEditLabel(note.label); setEditContent(note.content); };
        const handleConfirmEdit = async (noteId) => {
          if (!editContent.trim()) return;
          await onUpdateNote(noteId, editLabel.trim(), editContent.trim());
          setEditingNoteId(null);
        };

        return (
          <section className="rounded-xl border border-slate-200 bg-white">
            <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">
              <div className="flex items-start gap-2.5">
                <StickyNote className="mt-0.5 h-4 w-4 text-teal-700 shrink-0" aria-hidden="true" />
                <div>
                  <h2 className="text-base font-semibold text-slate-900">Permanent Notepad (URLs, Links &amp; Text)</h2>
                  <p className="mt-0.5 text-xs text-slate-500">Paste and save URLs, scripts, or notes permanently · Saved until removed · One-click copy anytime</p>
                </div>
              </div>
              <div className="flex flex-wrap items-center gap-2">
                {!isCloudSignedIn ? (
                  <button type="button" onClick={() => void onSignInGoogle()} className="inline-flex h-8 items-center gap-1.5 rounded-lg border border-teal-700/30 bg-teal-50/70 px-3 text-xs font-semibold text-teal-900 hover:bg-teal-100/70 whitespace-nowrap">
                    Sign in with Google to persist across publish
                  </button>
                ) : (
                  <span className="inline-flex items-center gap-1 text-xs font-medium text-emerald-700">
                    <Lock className="h-3.5 w-3.5" aria-hidden="true" /> Cloud Saved Permanently
                  </span>
                )}
                {notes.length > 0 ? (
                  <button type="button" onClick={() => void handleCopyAll()} className="inline-flex h-8 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap">
                    {copiedId === '__ALL__' ? (<><Check className="h-3.5 w-3.5 text-emerald-700" aria-hidden="true" /> Copied All</>) : (<><Copy className="h-3.5 w-3.5" aria-hidden="true" /> Copy All ({notes.length})</>)}
                  </button>
                ) : null}
              </div>
            </div>

            <form onSubmit={(e) => void handleSave(e)} className="border-b border-slate-200 p-6 space-y-3">
              <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
                <div className="flex flex-col gap-1">
                  <label htmlFor="notepad-label" className="text-xs font-semibold text-slate-700">Label / Title (Optional)</label>
                  <input id="notepad-label" type="text" maxLength={MAX_NOTE_LABEL_LENGTH} value={labelInput} onChange={(e) => setLabelInput(e.target.value)} placeholder="e.g., Web App URL, Sheet Link, Backup Note" className="h-9 w-full rounded-lg border border-slate-300 bg-white px-3 text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15" />
                </div>
                <div className="flex flex-col gap-1 sm:col-span-2">
                  <label htmlFor="notepad-content" className="text-xs font-semibold text-slate-700">Paste URL, Text, or Any Content</label>
                  <textarea id="notepad-content" rows={3} maxLength={MAX_NOTE_CONTENT_LENGTH} value={contentInput} onChange={(e) => { setContentInput(e.target.value); if (formError) setFormError(null); }} placeholder="Paste your Google Apps Script URL, Google Sheet URL, passwords/IDs, or daily instructions here..." className="w-full rounded-lg border border-slate-300 bg-white px-3 py-2 font-mono text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15 resize-y" />
                </div>
              </div>
              {formError ? <p role="alert" className="text-xs font-medium text-red-700">{formError}</p> : null}
              <div className="flex flex-wrap items-center justify-between gap-3">
                <span className="text-[11px] text-slate-500">Saved items stay stored until you remove them.</span>
                <div className="flex items-center gap-2">
                  {contentInput.trim() ? (
                    <button type="button" onClick={() => void handleCopy('__DRAFT__', contentInput)} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap">
                      {copiedId === '__DRAFT__' ? (<><Check className="h-3.5 w-3.5 text-emerald-700" aria-hidden="true" /> Copied</>) : (<><Copy className="h-3.5 w-3.5" aria-hidden="true" /> Copy Draft</>)}
                    </button>
                  ) : null}
                  <button type="submit" disabled={isSavingNote} className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white hover:bg-teal-800 disabled:opacity-50 whitespace-nowrap">
                    <Save className="h-3.5 w-3.5" aria-hidden="true" /> {isSavingNote ? 'Saving...' : 'Save Permanently'}
                  </button>
                </div>
              </div>
            </form>

            <div className="divide-y divide-slate-200">
              {notes.length === 0 ? (
                <div className="px-6 py-8 text-center text-xs text-slate-500">
                  No saved notepad items yet. Paste any URL or text above and click <span className="font-semibold text-slate-700">Save Permanently</span>.
                </div>
              ) : (
                notes.map((note) => {
                  const isEditing = editingNoteId === note.id;
                  return (
                    <div key={note.id} className="px-6 py-4">
                      {isEditing ? (
                        <div className="space-y-2.5">
                          <input type="text" maxLength={MAX_NOTE_LABEL_LENGTH} value={editLabel} onChange={(e) => setEditLabel(e.target.value)} placeholder="Optional label" className="h-8 w-full max-w-sm rounded-md border border-slate-300 bg-white px-2.5 text-xs font-semibold text-slate-900 focus:border-teal-700 focus:outline-none" />
                          <textarea rows={3} maxLength={MAX_NOTE_CONTENT_LENGTH} value={editContent} onChange={(e) => setEditContent(e.target.value)} className="w-full rounded-md border border-slate-300 bg-white px-3 py-2 font-mono text-xs text-slate-900 focus:border-teal-700 focus:outline-none" />
                          <div className="flex items-center gap-2">
                            <button type="button" onClick={() => void handleConfirmEdit(note.id)} className="inline-flex h-8 items-center gap-1 rounded-md bg-teal-700 px-3 text-xs font-semibold text-white hover:bg-teal-800">
                              <Check className="h-3.5 w-3.5" aria-hidden="true" /> Update Note
                            </button>
                            <button type="button" onClick={() => setEditingNoteId(null)} className="inline-flex h-8 items-center gap-1 rounded-md border border-slate-300 bg-white px-3 text-xs font-medium text-slate-700 hover:bg-slate-50">
                              <X className="h-3.5 w-3.5" aria-hidden="true" /> Cancel
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="flex flex-col gap-2">
                          <div className="flex flex-wrap items-center justify-between gap-2">
                            <div className="flex flex-wrap items-center gap-2 text-xs">
                              <span className="font-semibold text-slate-900">{note.label || 'Saved Note'}</span>
                              <span aria-hidden="true" className="text-slate-300">·</span>
                              <span className="font-mono text-[11px] text-slate-500 tabular-nums">{new Date(note.updatedAtIso).toLocaleString()}</span>
                              <span aria-hidden="true" className="text-slate-300">·</span>
                              <span className="text-[11px] text-slate-500">{note.source === 'cloud' ? 'Cloud Permanent' : 'Local Saved'}</span>
                            </div>
                            <div className="flex items-center gap-1.5">
                              <button type="button" onClick={() => void handleCopy(note.id, note.content)} className="inline-flex h-7 items-center gap-1 rounded-md border border-slate-300 bg-white px-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap">
                                {copiedId === note.id ? (<><Check className="h-3.5 w-3.5 text-emerald-700" aria-hidden="true" /> Copied</>) : (<><Copy className="h-3.5 w-3.5" aria-hidden="true" /> Copy</>)}
                              </button>
                              <button type="button" onClick={() => handleStartEdit(note)} className="inline-flex h-7 items-center gap-1 rounded-md border border-slate-200 bg-white px-2 text-xs font-medium text-slate-600 hover:bg-slate-50 hover:text-slate-900 whitespace-nowrap">
                                <Pencil className="h-3 w-3" aria-hidden="true" /> Edit
                              </button>
                              <button type="button" onClick={() => void onDeleteNote(note)} className="inline-flex h-7 items-center gap-1 rounded-md border border-red-200 bg-white px-2 text-xs font-medium text-red-700 hover:bg-red-50 whitespace-nowrap">
                                <X className="h-3 w-3" aria-hidden="true" /> Remove
                              </button>
                            </div>
                          </div>
                          <pre className="overflow-x-auto whitespace-pre-wrap break-all rounded-lg border border-slate-200/80 bg-slate-50 px-3.5 py-2.5 font-mono text-xs text-slate-800">{note.content}</pre>
                        </div>
                      )}
                    </div>
                  );
                })
              )}
            </div>
          </section>
        );
      }

      function HtmlExportView({ columns, records }) {
        const [exportMode, setExportMode] = useState('standalone');
        const [copied, setCopied] = useState(false);

        const htmlSource = useMemo(
          () => (exportMode === 'standalone' ? generateStandaloneHtml(records, columns) : generateHtmlTableSnippet(records, columns)),
          [exportMode, records, columns]
        );

        const handleCopy = async () => {
          await copyTextToClipboard(htmlSource);
          setCopied(true);
          window.setTimeout(() => setCopied(false), 2000);
        };

        const handleDownload = () => {
          const filename = exportMode === 'standalone' ? 'esic-claim-data-entry-form.html' : 'esic-claim-table-snippet.html';
          triggerFileDownload(htmlSource, filename, 'text/html;charset=utf-8');
        };

        return (
          <section className="rounded-xl border border-slate-200 bg-white">
            <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">

                <h2 className="text-base font-semibold text-slate-900">Export Standalone HTML</h2>
                <p className="mt-0.5 text-xs text-slate-500">
                  Self-contained HTML5 source with all {columns.length} active headers (including custom boxes) and {records.length} {records.length === 1 ? 'current record' : 'current records'} embedded
                </p>
              </div>
              <div className="flex flex-wrap items-center gap-3">
                <div className="inline-flex items-center rounded-lg bg-slate-100 p-1">
                  <button type="button" onClick={() => setExportMode('standalone')} className={`rounded-md px-3 py-1.5 text-xs font-medium whitespace-nowrap shrink-0 ${exportMode === 'standalone' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>Complete HTML Form &amp; Table</button>
                  <button type="button" onClick={() => setExportMode('table')} className={`rounded-md px-3 py-1.5 text-xs font-medium whitespace-nowrap shrink-0 ${exportMode === 'table' ? 'bg-white text-slate-900 shadow-xs' : 'text-slate-600 hover:text-slate-900'}`}>HTML Table Only</button>
                </div>
                <button type="button" onClick={handleCopy} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3.5 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap shrink-0">
                  {copied ? (<><Check className="h-3.5 w-3.5 text-emerald-700" aria-hidden="true" /> Copied HTML</>) : (<><Copy className="h-3.5 w-3.5" aria-hidden="true" /> Copy HTML</>)}
                </button>
                <button type="button" onClick={handleDownload} className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-teal-700 px-3.5 text-xs font-semibold text-white hover:bg-teal-800 whitespace-nowrap shrink-0">
                  <Download className="h-3.5 w-3.5" aria-hidden="true" /> Download .html
                </button>
              </div>
            </div>
            <div className="p-6">
              <div className="overflow-hidden rounded-lg border border-slate-200 bg-slate-950">
                <div className="flex items-center justify-between border-b border-slate-800 px-4 py-2.5 text-xs text-slate-400">
                  <span className="font-mono">{exportMode === 'standalone' ? 'esic-claim-data-entry-form.html' : 'esic-claim-table-snippet.html'}</span>
                  <span className="font-mono tabular-nums">{htmlSource.split('\n').length} lines</span>
                </div>
                <pre className="register-scroll max-h-[560px] overflow-auto p-4 font-mono text-[12px] leading-relaxed text-slate-200"><code>{htmlSource}</code></pre>
              </div>
            </div>
          </section>
        );
      }

      function GoogleSyncView({
        columns, records, webAppUrl, sheetName, lastSyncedAt, authUserEmail, isAuthLoading,
        isSavingSettings, settingsSavedAt, notes, isSavingNote, onWebAppUrlChange, onSheetNameChange,
        onSaveSyncSettings, onSignInGoogle, onSignOutGoogle, onSaveNewNote, onUpdateNote, onDeleteNote,
        onSyncComplete, onLoadFromSheet,
      }) {
        const [selectedHeaderKey, setSelectedHeaderKey] = useState(null);
        const [copiedScript, setCopiedScript] = useState(false);
        const [copiedUrl, setCopiedUrl] = useState(false);
        const [isPushing, setIsPushing] = useState(false);
        const [isPulling, setIsPulling] = useState(false);
        const [syncMessage, setSyncMessage] = useState(null);

        const scriptCode = useMemo(() => generateGoogleAppsScriptCode(columns, sheetName, selectedHeaderKey), [columns, sheetName, selectedHeaderKey]);

        const handleCopyCode = () => {
          void copyTextToClipboard(scriptCode).then(() => { setCopiedScript(true); window.setTimeout(() => setCopiedScript(false), 2000); });
        };
        const handleCopySavedUrl = () => {
          if (!webAppUrl.trim()) return;
          void copyTextToClipboard(webAppUrl.trim()).then(() => { setCopiedUrl(true); window.setTimeout(() => setCopiedUrl(false), 2000); });
        };
        const handleDownloadScript = () => triggerFileDownload(scriptCode, 'Code.gs', 'text/plain;charset=utf-8');

        const handlePushToGoogleSheet = async () => {
          const trimmedUrl = webAppUrl.trim();
          if (!trimmedUrl) {
            setSyncMessage({ text: 'Paste your deployed Google Apps Script Web App URL before syncing.', tone: 'error' });
            return;
          }
          setIsPushing(true);
          setSyncMessage(null);
          try {
            const implantRows = collectGoogleImplantRows(records);
            const payload = {
              action: 'sync',
              sheetName: sheetName.trim() || 'ESIC_Claims_Register',
              columns: columns.map((c) => ({ key: c.key, header: c.header, type: c.inputType })),
              rows: records.map((rec) => {
                const cleanRow = {};
                columns.forEach((col) => { cleanRow[col.key] = rec[col.key] ?? ''; });
                return cleanRow;
              }),
              implantRows,
            };
            const res = await fetch(trimmedUrl, {
              method: 'POST',
              headers: { 'Content-Type': 'text/plain;charset=utf-8' },
              body: JSON.stringify(payload),
            });
            const text = await res.text();
            let parsed = null;
            try { parsed = JSON.parse(text); } catch { parsed = null; }
            if (!res.ok || (parsed && parsed.ok === false)) {
              throw new Error(parsed?.error || `HTTP ${res.status}: Unable to reach deployed Web App.`);
            }
            const nowIso = new Date().toISOString();
            const implantsSheetName = getGoogleImplantsSheetName(sheetName);
            const msg = `Synced ${records.length} claim rows and ${implantRows.length} remark/implant rows to "${sheetName.trim() || 'ESIC_Claims_Register'}" and "${implantsSheetName}".`;
            setSyncMessage({ text: msg, tone: 'success' });
            onSyncComplete(nowIso, msg);
          } catch (err) {
            setSyncMessage({
              text: `Sync failed: ${err instanceof Error ? err.message : String(err)}. Verify the Web App is deployed with "Who has access: Anyone".`,
              tone: 'error',
            });
          } finally {
            setIsPushing(false);
          }
        };

        const handlePullFromGoogleSheet = async (mode) => {
          const trimmedUrl = webAppUrl.trim();
          if (!trimmedUrl) {
            setSyncMessage({ text: 'Paste your deployed Google Apps Script Web App URL before loading.', tone: 'error' });
            return;
          }
          setIsPulling(true);
          setSyncMessage(null);
          try {
            const separator = trimmedUrl.includes('?') ? '&' : '?';
            const url = `${trimmedUrl}${separator}action=load&sheetName=${encodeURIComponent(sheetName.trim() || 'ESIC_Claims_Register')}`;
            const res = await fetch(url, { method: 'GET' });
            const text = await res.text();
            const data = JSON.parse(text);
            if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);

            const sheetHeaders = Array.isArray(data.headers) ? data.headers : [];
            const rawRows = Array.isArray(data.rows) ? data.rows : [];
            const existingKeys = new Set(columns.map((c) => c.key));
            const discoveredCustom = [];
            const headerToKey = new Map();

            sheetHeaders.forEach((hdr) => {
              const trimmed = (hdr || '').trim();
              if (!trimmed) return;
              const norm = normalizeHeader(trimmed);
              if (norm === 'time') return;
              const match = columns.find((c) => normalizeHeader(c.header) === norm);
              if (match) {
                headerToKey.set(trimmed, match.key);
              } else {
                const newKey = createCustomColumnKey(trimmed, existingKeys);
                existingKeys.add(newKey);
                discoveredCustom.push({
                  id: `gs-col-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                  key: newKey,
                  header: trimmed,
                  group: 'identity',
                  inputType: 'text',
                });
                headerToKey.set(trimmed, newKey);
              }
            });

            const allKeys = [...columns.map((c) => c.key), ...discoveredCustom.map((c) => c.key)];
            const nowIso = new Date().toISOString();
            const loadedRecords = rawRows.map((rawRow, idx) => {
              const rec = {};
              allKeys.forEach((k) => { rec[k] = ''; });
              Object.entries(rawRow).forEach(([k, v]) => {
                const strVal = v === null || v === undefined ? '' : String(v).trim();
                if (allKeys.includes(k)) rec[k] = strVal;
                else if (headerToKey.has(k)) rec[headerToKey.get(k)] = strVal;
              });
              if (!rec.srNo) rec.srNo = String(idx + 1);
              return { ...rec, id: `gs-${Date.now()}-${idx}-${Math.random().toString(36).slice(2, 6)}`, createdAt: nowIso, updatedAt: nowIso };
            });

            const implantGroups = new Map();
            (Array.isArray(data.implantRows) ? data.implantRows : []).forEach((row) => {
              const recordKey = String(row.recordKey ?? '');
              if (!recordKey) return;
              let group = implantGroups.get(recordKey);
              if (!group) {
                group = {
                  remark: '',
                  implants: [],
                  claimSrNo: '',
                  claimId: '',
                  ipNoEsic: '',
                  patientName: '',
                };
                implantGroups.set(recordKey, group);
              }
              group.claimSrNo = group.claimSrNo || String(row.claimSrNo ?? '').trim();
              group.claimId = group.claimId || String(row.claimId ?? '').trim();
              group.ipNoEsic = group.ipNoEsic || String(row.ipNoEsic ?? '').trim();
              group.patientName = group.patientName || String(row.patientName ?? '').trim();
              if (!group.remark && row.remark) group.remark = String(row.remark).trim();
              if (row.srNo || row.name || row.amount) {
                group.implants.push({
                  id: `gs-implant-${group.implants.length + 1}`,
                  srNo: String(row.srNo ?? '').trim(),
                  name: String(row.name ?? '').trim(),
                  amount: String(row.amount ?? '').trim(),
                });
              }
            });
            loadedRecords.forEach((record) => {
              let implantGroup = implantGroups.get(getRecordImplantKey(record));
              if (!implantGroup) {
                const identifierPairs = [
                  ['srNo', 'claimSrNo'],
                  ['claimId', 'claimId'],
                  ['ipNoEsic', 'ipNoEsic'],
                  ['patientName', 'patientName'],
                ];
                const matches = [...implantGroups.values()].filter((group) => {
                  const availablePairs = identifierPairs.filter(([recordKey, groupKey]) =>
                    String(record[recordKey] ?? '').trim() && group[groupKey]
                  );
                  return availablePairs.length > 0 && availablePairs.every(([recordKey, groupKey]) =>
                    String(record[recordKey]).trim() === group[groupKey]
                  );
                });
                if (matches.length === 1) [implantGroup] = matches;
              }
              if (!implantGroup) return;
              record.admissionRemark = implantGroup.remark;
              record.admissionImplantsJson = serializeImplantRows(implantGroup.implants);
              record.remarkAndImplants = formatRemarkAndImplantsSummary(
                record.admissionRemark,
                implantGroup.implants
              );
            });

            onLoadFromSheet(loadedRecords, discoveredCustom, mode);
            const actionWord = mode === 'replace' ? 'Loaded and replaced' : 'Merged';
            const msg = `${actionWord} ${loadedRecords.length} records from Google Sheet${discoveredCustom.length > 0 ? ` (+${discoveredCustom.length} new custom columns)` : ''}.`;
            setSyncMessage({ text: msg, tone: 'success' });
            onSyncComplete(nowIso, msg);
          } catch (err) {
            setSyncMessage({
              text: `Load failed: ${err instanceof Error ? err.message : String(err)}. Check that the script is deployed as a Web App accessible to Anyone.`,
              tone: 'error',
            });
          } finally {
            setIsPulling(false);
          }
        };

        return (
          <div className="space-y-6">
            <section className="rounded-xl border border-slate-200 bg-white">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">
                <div>
                  <h2 className="text-base font-semibold text-slate-900">Google Sheets Live Sync</h2>
                  <p className="mt-0.5 text-xs text-slate-500">Permanently store your Web App URL and Sheet Tab Name before &amp; after publishing, then push or load exact register rows</p>
                </div>
                <div className="flex flex-wrap items-center gap-3">
                  {isAuthLoading ? (
                    <span className="text-xs text-slate-500">Checking cloud session...</span>
                  ) : authUserEmail ? (
                    <div className="flex flex-wrap items-center gap-2.5 text-xs">
                      <span className="inline-flex items-center gap-1.5 font-medium text-emerald-700">
                        <Lock className="h-3.5 w-3.5" aria-hidden="true" /> Permanent Cloud Sync ({authUserEmail})
                      </span>
                      <button type="button" onClick={() => void onSignOutGoogle()} className="inline-flex h-8 items-center gap-1 rounded-lg border border-slate-300 bg-white px-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap">
                        <LogOut className="h-3.5 w-3.5" aria-hidden="true" /> Sign Out
                      </button>
                    </div>
                  ) : (
                    <button type="button" onClick={() => void onSignInGoogle()} className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-slate-900 px-3.5 text-xs font-semibold text-white hover:bg-slate-800 whitespace-nowrap">
                      <LogIn className="h-3.5 w-3.5" aria-hidden="true" /> Sign in with Google (Permanent Cloud Save)
                    </button>
                  )}
                </div>
              </div>

              <div className="p-6 space-y-5">
                {!authUserEmail ? (
                  <div className="rounded-lg border border-slate-200 bg-slate-50 px-4 py-3 text-xs text-slate-600">
                    Your URL, Sheet Tab Name, and Notepad entries save locally right away. Sign in with Google above (when hosted online) to also save them permanently in Firebase Firestore so they stay stored both <span className="font-semibold text-slate-800">before and after publishing</span>.
                  </div>
                ) : null}

                <div className="grid grid-cols-1 gap-4 lg:grid-cols-3">
                  <div className="flex flex-col gap-1.5 lg:col-span-2">
                    <div className="flex items-center justify-between gap-2">
                      <label htmlFor="gs-webapp-url" className="text-xs font-semibold text-slate-700">Deployed Google Apps Script Web App URL</label>
                      {webAppUrl.trim() ? (
                        <button type="button" onClick={handleCopySavedUrl} className="inline-flex items-center gap-1 text-[11px] font-medium text-teal-700 hover:underline whitespace-nowrap">
                          {copiedUrl ? (<><Check className="h-3 w-3 text-emerald-700" aria-hidden="true" /> Copied URL</>) : (<><Copy className="h-3 w-3" aria-hidden="true" /> Copy URL</>)}
                        </button>
                      ) : null}
                    </div>
                    <input id="gs-webapp-url" type="url" maxLength={MAX_WEB_APP_URL_LENGTH} value={webAppUrl} onChange={(e) => onWebAppUrlChange(e.target.value)} placeholder="https://script.google.com/macros/s/AKfycb.../exec" className="h-10 w-full rounded-lg border border-slate-300 bg-white px-3 font-mono text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15" />
                  </div>
                  <div className="flex flex-col gap-1.5">
                    <label htmlFor="gs-sheet-name" className="text-xs font-semibold text-slate-700">Google Sheet Tab Name</label>
                    <input id="gs-sheet-name" type="text" maxLength={MAX_SHEET_NAME_LENGTH} value={sheetName} onChange={(e) => onSheetNameChange(e.target.value)} placeholder="ESIC_Claims_Register" className="h-10 w-full rounded-lg border border-slate-300 bg-white px-3 font-mono text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15" />
                  </div>
                </div>

                <div className="flex flex-wrap items-center justify-between gap-3 rounded-lg border border-slate-200 bg-slate-50/70 px-4 py-3">
                  <div className="text-xs text-slate-600">
                    {settingsSavedAt ? (
                      <span>Permanently saved on <span className="font-mono tabular-nums text-slate-800">{new Date(settingsSavedAt).toLocaleString()}</span></span>
                    ) : (
                      <span>Click Save URL &amp; Tab Name to permanently lock both fields.</span>
                    )}
                    {lastSyncedAt ? <span className="ml-2 text-slate-500">· Last sheet sync: {new Date(lastSyncedAt).toLocaleString()}</span> : null}
                  </div>
                  <button type="button" onClick={() => void onSaveSyncSettings()} disabled={isSavingSettings} className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-slate-900 px-4 text-xs font-semibold text-white hover:bg-slate-800 disabled:opacity-50 whitespace-nowrap shrink-0">
                    <Save className="h-3.5 w-3.5" aria-hidden="true" /> {isSavingSettings ? 'Saving...' : 'Save URL & Tab Name Permanently'}
                  </button>
                </div>

                {syncMessage ? (
                  <div role="status" className={`rounded-lg border px-4 py-3 text-xs font-medium ${syncMessage.tone === 'error' ? 'border-red-200 bg-red-50 text-red-800' : 'border-emerald-200 bg-emerald-50 text-emerald-800'}`}>
                    {syncMessage.text}
                  </div>
                ) : null}

                <div className="flex flex-wrap items-center gap-3 border-t border-slate-200 pt-4">
                  <button type="button" onClick={handlePushToGoogleSheet} disabled={isPushing || isPulling} className="inline-flex h-10 items-center gap-2 rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white hover:bg-teal-800 disabled:opacity-50 whitespace-nowrap shrink-0">
                    {isPushing ? <RefreshCw className="h-4 w-4 animate-spin" aria-hidden="true" /> : <CloudUpload className="h-4 w-4" aria-hidden="true" />}
                    Sync to Google Sheet ({records.length} Rows)
                  </button>
                  <button type="button" onClick={() => handlePullFromGoogleSheet('replace')} disabled={isPushing || isPulling} className="inline-flex h-10 items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 text-xs font-semibold text-slate-800 hover:bg-slate-50 disabled:opacity-50 whitespace-nowrap shrink-0">
                    {isPulling ? <RefreshCw className="h-4 w-4 animate-spin" aria-hidden="true" /> : <CloudDownload className="h-4 w-4" aria-hidden="true" />}
                    Load from Sheet (Replace Local)
                  </button>
                  <button type="button" onClick={() => handlePullFromGoogleSheet('merge')} disabled={isPushing || isPulling} className="inline-flex h-10 items-center gap-2 rounded-lg border border-slate-300 bg-white px-4 text-xs font-medium text-slate-700 hover:bg-slate-50 disabled:opacity-50 whitespace-nowrap shrink-0">
                    <CloudDownload className="h-4 w-4" aria-hidden="true" /> Load &amp; Append Rows
                  </button>
                </div>
              </div>
            </section>

            <PermanentNotepad notes={notes} isCloudSignedIn={Boolean(authUserEmail)} isSavingNote={isSavingNote} onSaveNewNote={onSaveNewNote} onUpdateNote={onUpdateNote} onDeleteNote={onDeleteNote} onSignInGoogle={onSignInGoogle} />

            <section className="rounded-xl border border-slate-200 bg-white">
              <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">
                <div>
                  <h2 className="text-base font-semibold text-slate-900">Auto-Updating Google Apps Script (Code.gs)</h2>
                  <p className="mt-0.5 text-xs text-slate-500">Generated code maps {columns.length} claim columns and syncs Remark plus each implant row to a separate “_Implants” tab whenever you push records.</p>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <button type="button" onClick={handleCopyCode} className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-teal-700 px-3.5 text-xs font-semibold text-white hover:bg-teal-800 whitespace-nowrap shrink-0">
                    {copiedScript ? (<><Check className="h-3.5 w-3.5" aria-hidden="true" /> Copied Code.gs</>) : (<><Copy className="h-3.5 w-3.5" aria-hidden="true" /> Copy Apps Script</>)}
                  </button>
                  <button type="button" onClick={handleDownloadScript} className="inline-flex h-9 items-center gap-1.5 rounded-lg border border-slate-300 bg-white px-3.5 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap shrink-0">
                    <Download className="h-3.5 w-3.5" aria-hidden="true" /> Download Code.gs
                  </button>
                </div>
              </div>

              <div className="border-b border-slate-200 bg-slate-50/70 px-6 py-4">
                <div className="mb-2 flex items-center justify-between gap-2">
                  <span className="text-xs font-semibold text-slate-700">Click any header to inspect &amp; highlight its exact Google Sheet column mapping</span>
                  {selectedHeaderKey ? <button type="button" onClick={() => setSelectedHeaderKey(null)} className="text-xs font-medium text-teal-700 hover:underline">Clear highlight</button> : null}
                </div>
                <div className="flex flex-wrap gap-1.5">
                  {columns.map((col, idx) => {
                    const isSelected = selectedHeaderKey === col.key;
                    return (
                      <button key={col.key} type="button" onClick={() => setSelectedHeaderKey(isSelected ? null : col.key)} className={`inline-flex items-center gap-1.5 rounded-md border px-2.5 py-1 text-xs whitespace-nowrap ${isSelected ? 'border-teal-700 bg-teal-700 text-white font-semibold' : col.isCustom ? 'border-teal-200 bg-teal-50/60 text-teal-900 hover:border-teal-400' : 'border-slate-200 bg-white text-slate-700 hover:border-slate-400'}`}>
                        <span className="font-mono text-[10px] opacity-75">{columnIndexToLetter(idx)}</span>
                        <span>{col.header}{col.formContext ? ` (${col.formContext})` : ''}</span>
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="p-6 space-y-5">
                <ol className="grid grid-cols-1 gap-3 text-xs text-slate-600 sm:grid-cols-2 lg:grid-cols-4">
                  <li className="rounded-lg border border-slate-200 p-3"><div className="font-semibold text-slate-900">1. Open Apps Script</div><p className="mt-1">In Google Sheets, click Extensions → Apps Script.</p></li>
                  <li className="rounded-lg border border-slate-200 p-3"><div className="font-semibold text-slate-900">2. Paste &amp; Save</div><p className="mt-1">Replace Code.gs with the script below and press Ctrl+S.</p></li>
                  <li className="rounded-lg border border-slate-200 p-3"><div className="font-semibold text-slate-900">3. Deploy Web App</div><p className="mt-1">Deploy → New deployment → Web app → Execute as Me → Access: Anyone.</p></li>
                  <li className="rounded-lg border border-slate-200 p-3"><div className="font-semibold text-slate-900">4. Paste, Save &amp; Sync</div><p className="mt-1">Paste the Web App URL above, click Save Permanently, and push records. Remark/implant rows sync to a separate tab.</p></li>
                </ol>
                <div className="overflow-hidden rounded-lg border border-slate-200 bg-slate-950">
                  <div className="flex items-center justify-between border-b border-slate-800 px-4 py-2.5 text-xs text-slate-400">
                    <span className="font-mono">Code.gs — {sheetName || 'ESIC_Claims_Register'}</span>
                    <span className="font-mono tabular-nums">{columns.length} columns · {scriptCode.split('\n').length} lines</span>
                  </div>
                  <pre className="register-scroll max-h-[500px] overflow-auto p-4 font-mono text-[12px] leading-relaxed text-slate-200"><code>{scriptCode}</code></pre>
                </div>
              </div>
            </section>
          </div>
        );
      }

      // =========================================================================
      // CLAIM FORM COMPONENT
      // =========================================================================
      const MANUAL_SELECT_SENTINEL = '__MANUAL_ENTRY__';

      function ClaimForm({
        columns,
        customColumns,
        hiddenBaseKeys,
        formData,
        isEditing,
        editingLabel,
        nowMs,
        onChange,
        onAddCustomColumn,
        onRemoveCustomColumn,
        onRenameCustomColumn,
        onHideBaseColumn,
        onRestoreBaseColumn,
        onRestoreAllBaseColumns,
        onSubmit,
        onOpenPermissionLetter,
        onReset,
        onCancelEdit,
      }) {
        const [layoutMode, setLayoutMode] = useState('grouped');
        const [validationError, setValidationError] = useState(null);

        const [showAddBoxBuilder, setShowAddBoxBuilder] = useState(false);
        const [selectedBuilderSection, setSelectedBuilderSection] = useState('identity');
        const [customHeaderInput, setCustomHeaderInput] = useState('');
        const [customTypeInput, setCustomTypeInput] = useState('text');
        const [builderFeedback, setBuilderFeedback] = useState(null);
        const manualHeaderInputRef = useRef(null);

        const [renamingCustomId, setRenamingCustomId] = useState(null);
        const [renameDraft, setRenameDraft] = useState('');

        const [manualSelectKeys, setManualSelectKeys] = useState({});

        const [showInlineApprovePrompt, setShowInlineApprovePrompt] = useState(false);
        const [inlineApprovedDate, setInlineApprovedDate] = useState('');
        const [inlineApproveError, setInlineApproveError] = useState(null);

        const [isRemarkImplantsOpen, setIsRemarkImplantsOpen] = useState(false);
        const [remarkImplantsMode, setRemarkImplantsMode] = useState('choose');

        const parsedImplants = useMemo(
          () => parseImplantRows(formData.admissionImplantsJson),
          [formData.admissionImplantsJson]
        );

        const implantsTotalAmount = useMemo(
          () => parsedImplants.reduce((sum, row) => sum + parseNumericAmount(row.amount), 0),
          [parsedImplants]
        );

        const columnMap = useMemo(() => {
          const map = new Map();
          columns.forEach((col) => map.set(col.key, col));
          return map;
        }, [columns]);

        const existingNormalizedHeaders = useMemo(() => {
          const set = new Set();
          columns.forEach((c) => set.add(c.header.trim().toLowerCase()));
          return set;
        }, [columns]);

        const activeColumnsInSelectedSection = useMemo(
          () => columns.filter((col) => col.group === selectedBuilderSection),
          [columns, selectedBuilderSection]
        );

        const hiddenBaseColumns = useMemo(
          () => BASE_CLAIM_COLUMNS.filter((col) => hiddenBaseKeys.includes(col.key)),
          [hiddenBaseKeys]
        );

        const liveDuration = useMemo(
          () => calculateAdmissionDuration(formData.doa || '', formData.doaTime || '', nowMs),
          [formData.doa, formData.doaTime, nowMs]
        );

        const approvedExtensionDays = useMemo(
          () => calculateApprovedExtensionDays(formData.doa || '', formData.extensionApprovedUpTo || ''),
          [formData.doa, formData.extensionApprovedUpTo]
        );

        const inlinePreviewDays = useMemo(
          () =>
            inlineApprovedDate
              ? calculateApprovedExtensionDays(formData.doa || '', inlineApprovedDate)
              : null,
          [formData.doa, inlineApprovedDate]
        );

        const handleFieldChange = (key, value) => {
          if (validationError) setValidationError(null);
          const updated = { ...formData, [key]: value };

          if (key === 'dob') {
            const computedAge = calculateAgeFromDob(value);
            if (computedAge) {
              updated.age = computedAge;
            }
          }

          if (key === 'finalBill' || key === 'settledAmount') {
            const finalStr = key === 'finalBill' ? value : updated.finalBill || '';
            const settledStr = key === 'settledAmount' ? value : updated.settledAmount || '';
            if (finalStr.trim() !== '' && settledStr.trim() !== '') {
              const diff = Math.max(0, parseNumericAmount(finalStr) - parseNumericAmount(settledStr));
              updated.deductionAmount = Number.isInteger(diff) ? String(diff) : diff.toFixed(2);
            } else if (settledStr.trim() === '') {
              updated.deductionAmount = '';
            }
          }

          onChange(updated);
        };

        const handleSaveRemarkAndImplants = (remark, implants) => {
          const serializedImplants = serializeImplantRows(implants);
          const summary = formatRemarkAndImplantsSummary(remark, implants);
          onChange({
            ...formData,
            admissionRemark: remark,
            admissionImplantsJson: serializedImplants,
            remarkAndImplants: summary,
          });
        };

        const handleQuickAddPreset = (header, inputType, group) => {
          const result = onAddCustomColumn(header, group, inputType);
          if (result.ok) {
            const sectionTitle =
              (SECTION_DEFINITIONS.find((s) => s.group === group) || {}).title || group;
            setBuilderFeedback({
              text: `Added "${header}" to ${sectionTitle}, Entered Records Register, Excel export, and Google Sync.`,
              tone: 'success',
            });
          } else {
            setBuilderFeedback({
              text: result.error || 'Could not add header.',
              tone: 'error',
            });
          }
        };

        const handleAddCustomHeaderSubmit = () => {
          const trimmed = customHeaderInput.trim();
          if (!trimmed) {
            setBuilderFeedback({ text: 'Enter a manual header name first.', tone: 'error' });
            if (manualHeaderInputRef.current) manualHeaderInputRef.current.focus();
            return;
          }
          const result = onAddCustomColumn(trimmed, selectedBuilderSection, customTypeInput);
          if (result.ok) {
            const sectionTitle =
              (SECTION_DEFINITIONS.find((s) => s.group === selectedBuilderSection) || {}).title ||
              selectedBuilderSection;
            setCustomHeaderInput('');
            setBuilderFeedback({
              text: `Created box & header "${trimmed}" inside ${sectionTitle} (synced to Excel & Google Sync).`,
              tone: 'success',
            });
          } else {
            setBuilderFeedback({
              text: result.error || 'Could not add header.',
              tone: 'error',
            });
          }
        };

        const handleSaveRename = (customId) => {
          const res = onRenameCustomColumn(customId, renameDraft);
          if (res.ok) {
            setRenamingCustomId(null);
            setRenameDraft('');
            setBuilderFeedback({ text: 'Updated custom header name.', tone: 'success' });
          } else {
            setBuilderFeedback({ text: res.error || 'Could not rename header.', tone: 'error' });
          }
        };

        const handleRemoveField = (col) => {
          if (columns.length <= 1) {
            setBuilderFeedback({
              text: 'At least one column must remain in the register.',
              tone: 'error',
            });
            return;
          }
          if (col.isCustom && col.customId) {
            onRemoveCustomColumn(col.customId);
            setBuilderFeedback({
              text: `Removed custom box & header "${col.header}" (updated in Register, Excel & Google Sync).`,
              tone: 'success',
            });
          } else {
            onHideBaseColumn(col.key);
            setBuilderFeedback({
              text: `Removed ESIC box & header "${col.header}". You can restore it anytime below.`,
              tone: 'success',
            });
          }
        };

        const handleApplyInlineExtensionApproval = () => {
          if (!inlineApprovedDate) {
            setInlineApproveError('Please select an Approved Date (validity end date).');
            return;
          }
          const days = calculateApprovedExtensionDays(formData.doa || '', inlineApprovedDate);
          if (days === null) {
            setInlineApproveError('Approved Date must be on or after the Date of Admission (DOA).');
            return;
          }
          setInlineApproveError(null);
          onChange({
            ...formData,
            extensionDateSned: formData.extensionDateSned || getTodayIso(),
            extensionApprovedUpTo: inlineApprovedDate,
            status: 'Extension Approved',
          });
          setShowInlineApprovePrompt(false);
        };

        const validateAndSubmit = (keepEntering) => {
          if (!(formData.patientName || '').trim() && !(formData.claimId || '').trim()) {
            setValidationError('Enter at least a Patient Name or Claim ID before saving this record.');
            return;
          }
          setValidationError(null);
          onSubmit(keepEntering);
        };

        const handleFormSubmit = (e) => {
          e.preventDefault();
          validateAndSubmit(false);
        };

        const renderField = (col, colSpanClass = '') => {
          const inputId = `field-${col.key}`;
          const value = formData[col.key] || '';
          const isRequiredHint = col.key === 'patientName' || col.key === 'claimId';
          const isManualSelectActive = Boolean(manualSelectKeys[col.key]);
          const isRenamingThis = Boolean(col.isCustom && col.customId && renamingCustomId === col.customId);

          const baseInputClass = `w-full rounded-lg border border-slate-300 bg-white px-3 text-sm text-slate-900 placeholder:text-slate-400 transition-colors focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15 ${
            col.mono ? 'font-mono tabular-nums text-[13px]' : ''
          } ${col.align === 'right' ? 'text-right' : ''}`;

          const selectOptions =
            col.inputType === 'select' && col.options
              ? value && !col.options.includes(value)
                ? [...col.options, value]
                : col.options
              : [];

          return (
            <div key={col.key} className={`flex flex-col gap-1.5 ${colSpanClass}`}>
              <div className="flex items-center justify-between gap-2">
                {isRenamingThis && col.customId ? (
                  <div className="flex flex-1 items-center gap-1">
                    <input
                      type="text"
                      value={renameDraft}
                      onChange={(e) => setRenameDraft(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          handleSaveRename(col.customId);
                        } else if (e.key === 'Escape') {
                          setRenamingCustomId(null);
                        }
                      }}
                      aria-label="Manual custom header name"
                      className="h-7 flex-1 rounded border border-teal-600 bg-white px-2 text-xs font-semibold text-slate-900 focus:outline-none"
                      autoFocus
                    />
                    <button
                      type="button"
                      onClick={() => handleSaveRename(col.customId)}
                      className="inline-flex h-7 items-center rounded bg-teal-700 px-2 text-[11px] font-semibold text-white hover:bg-teal-800"
                    >
                      Save
                    </button>
                    <button
                      type="button"
                      onClick={() => setRenamingCustomId(null)}
                      className="inline-flex h-7 items-center rounded border border-slate-300 bg-white px-1.5 text-[11px] text-slate-600 hover:bg-slate-50"
                    >
                      <X className="h-3 w-3" aria-hidden="true" />
                    </button>
                  </div>
                ) : (
                  <label
                    htmlFor={inputId}
                    className="flex min-w-0 items-baseline gap-1 text-xs font-semibold text-slate-700"
                  >
                    <span className="truncate">
                      {col.header}
                      {col.formContext ? (
                        <span className="ml-1 font-normal text-slate-500">({col.formContext})</span>
                      ) : null}
                      {isRequiredHint ? <span className="ml-0.5 text-teal-700">*</span> : null}
                    </span>
                  </label>
                )}

                {!isRenamingThis ? (
                  <div className="flex items-center gap-1.5 whitespace-nowrap shrink-0">
                    {col.key === 'deductionAmount' ? (
                      <span className="text-[11px] font-normal text-slate-400">Auto-calc</span>
                    ) : null}

                    {col.key === 'extensionApprovedUpTo' && approvedExtensionDays !== null ? (
                      <span className="font-mono text-[11px] font-semibold text-teal-700 tabular-nums">
                        {approvedExtensionDays} {approvedExtensionDays === 1 ? 'day' : 'days'} approved
                      </span>
                    ) : null}

                    {col.isCustom && col.customId ? (
                      <>
                        <span className="text-[11px] font-normal text-teal-700">Custom</span>
                        <button
                          type="button"
                          onClick={() => {
                            setRenamingCustomId(col.customId);
                            setRenameDraft(col.header);
                          }}
                          title={`Rename ${col.header}`}
                          aria-label={`Rename ${col.header}`}
                          className="inline-flex items-center gap-0.5 rounded px-1 py-0.5 text-[11px] font-medium text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900"
                        >
                          <Pencil className="h-3 w-3" aria-hidden="true" />
                          <span>Rename</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => handleRemoveField(col)}
                          title={`Remove ${col.header} box & header`}
                          aria-label={`Remove ${col.header}`}
                          className="inline-flex items-center gap-0.5 rounded px-1 py-0.5 text-[11px] font-medium text-red-700 transition-colors hover:bg-red-50"
                        >
                          <X className="h-3 w-3" aria-hidden="true" />
                          <span>Remove</span>
                        </button>
                      </>
                    ) : showAddBoxBuilder ? (
                      <button
                        type="button"
                        onClick={() => handleRemoveField(col)}
                        title={`Remove ${col.header} box & header`}
                        aria-label={`Remove ${col.header}`}
                        className="inline-flex items-center gap-0.5 rounded px-1 py-0.5 text-[11px] font-medium text-red-700 transition-colors hover:bg-red-50"
                      >
                        <X className="h-3 w-3" aria-hidden="true" />
                        <span>Remove</span>
                      </button>
                    ) : null}
                  </div>
                ) : null}
              </div>

              {col.key === 'remarkAndImplants' ? (
                <div className="flex items-center gap-2">
                  <button
                    id={inputId}
                    type="button"
                    onClick={() => {
                      setRemarkImplantsMode('choose');
                      setIsRemarkImplantsOpen(true);
                    }}
                    className="flex h-10 flex-1 min-w-0 items-center justify-between gap-2 rounded-lg border border-slate-300 bg-white px-3 text-left text-sm transition-colors hover:border-teal-700 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15"
                  >
                    <span
                      className={`truncate ${
                        value || (formData.admissionRemark || '').trim() || parsedImplants.length > 0
                          ? 'font-medium text-slate-900'
                          : 'text-slate-400'
                      }`}
                    >
                      {parsedImplants.length > 0 || (formData.admissionRemark || '').trim()
                        ? [
                            (formData.admissionRemark || '').trim()
                              ? `Remark: ${(formData.admissionRemark || '').trim()}`
                              : '',
                            parsedImplants.length > 0
                              ? `Implants (${parsedImplants.length}) · ₹${formatCurrencyValue(implantsTotalAmount)}`
                              : '',
                          ]
                            .filter(Boolean)
                            .join(' | ')
                        : value || 'Click to choose Remark or Implants...'}
                    </span>
                    <span className="text-[11px] font-semibold text-teal-700 whitespace-nowrap shrink-0">
                      Open
                    </span>
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      setRemarkImplantsMode('preview');
                      setIsRemarkImplantsOpen(true);
                    }}
                    title="Preview Remark & Implants Table"
                    className="inline-flex h-10 items-center gap-1.5 rounded-lg border border-teal-700/30 bg-teal-50/70 px-3 text-xs font-semibold text-teal-900 transition-colors hover:bg-teal-100 whitespace-nowrap shrink-0"
                  >
                    <Eye className="h-3.5 w-3.5" aria-hidden="true" />
                    Preview
                  </button>
                  <button
                    type="button"
                    onClick={() => onOpenPermissionLetter(formData)}
                    title="Open a Permission Letter using this entry's current implants"
                    className="inline-flex h-10 items-center gap-1.5 rounded-lg border border-teal-700 bg-white px-3 text-xs font-semibold text-teal-800 transition-colors hover:bg-teal-50 whitespace-nowrap shrink-0"
                  >
                    <FileCheck2 className="h-3.5 w-3.5" aria-hidden="true" />
                    Permission Letter
                  </button>
                </div>
              ) : col.inputType === 'select' ? (
                isManualSelectActive ? (
                  <div className="flex items-center gap-1.5">
                    <input
                      id={inputId}
                      name={col.key}
                      type="text"
                      value={value}
                      onChange={(e) => handleFieldChange(col.key, e.target.value)}
                      placeholder={`Type ${col.header} manually...`}
                      className={`${baseInputClass} h-10`}
                    />
                    <button
                      type="button"
                      onClick={() =>
                        setManualSelectKeys((prev) => ({ ...prev, [col.key]: false }))
                      }
                      title="Switch back to dropdown options"
                      className="h-10 rounded-lg border border-slate-300 bg-white px-2.5 text-xs font-medium text-slate-700 hover:bg-slate-50 whitespace-nowrap shrink-0"
                    >
                      List
                    </button>
                  </div>
                ) : (
                  <select
                    id={inputId}
                    name={col.key}
                    value={value}
                    onChange={(e) => {
                      if (e.target.value === MANUAL_SELECT_SENTINEL) {
                        setManualSelectKeys((prev) => ({ ...prev, [col.key]: true }));
                        return;
                      }
                      handleFieldChange(col.key, e.target.value);
                    }}
                    className={`${baseInputClass} h-10`}
                  >
                    <option value="">Select {col.header}...</option>
                    {selectOptions.map((opt) => (
                      <option key={opt} value={opt}>
                        {opt}
                      </option>
                    ))}
                    <option value={MANUAL_SELECT_SENTINEL}>+ Manual Name Entry...</option>
                  </select>
                )
              ) : col.inputType === 'textarea' ? (
                <textarea
                  id={inputId}
                  name={col.key}
                  rows={2}
                  value={value}
                  onChange={(e) => handleFieldChange(col.key, e.target.value)}
                  placeholder={col.placeholder}
                  className={`${baseInputClass} py-2 leading-snug resize-y min-h-[42px]`}
                />
              ) : (
                <input
                  id={inputId}
                  name={col.key}
                  type={col.inputType}
                  step={col.inputType === 'number' ? '0.01' : undefined}
                  min={col.inputType === 'number' ? '0' : undefined}
                  list={col.datalistId}
                  value={value}
                  onChange={(e) => handleFieldChange(col.key, e.target.value)}
                  placeholder={col.placeholder}
                  className={`${baseInputClass} h-10`}
                />
              )}
            </div>
          );
        };

        return (
          <section className="rounded-xl border border-slate-200 bg-white">
            <div className="flex flex-wrap items-center justify-between gap-4 border-b border-slate-200 px-6 py-4">
              <div>
                <h2 className="text-base font-semibold text-slate-900">
                  {isEditing
                    ? `Edit Claim Record${editingLabel ? ` — ${editingLabel}` : ''}`
                    : 'New ESIC Claim Entry'}
                </h2>
                <p className="mt-0.5 text-xs text-slate-500">
                  {columns.length} active register columns · Age derives from DOB · Deduction computes automatically
                </p>
              </div>

              <div className="flex flex-wrap items-center gap-3">
                <label className="inline-flex h-9 cursor-pointer items-center gap-2 rounded-lg border border-slate-300 bg-white px-3 text-xs font-semibold text-slate-800 transition-colors hover:bg-slate-50 whitespace-nowrap shrink-0">
                  <input
                    type="checkbox"
                    checked={showAddBoxBuilder}
                    onChange={(e) => {
                      setShowAddBoxBuilder(e.target.checked);
                      setBuilderFeedback(null);
                    }}
                    className="h-4 w-4 rounded border-slate-300 accent-teal-700"
                  />
                  <span>Add / Remove Box &amp; Header Name</span>
                </label>

                <div
                  className="inline-flex items-center rounded-lg bg-slate-100 p-1"
                  role="group"
                  aria-label="Form layout order"
                >
                  <button
                    type="button"
                    onClick={() => setLayoutMode('grouped')}
                    className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors whitespace-nowrap shrink-0 ${
                      layoutMode === 'grouped'
                        ? 'bg-white text-slate-900 shadow-xs'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Grouped Sections
                  </button>
                  <button
                    type="button"
                    onClick={() => setLayoutMode('sequential')}
                    className={`px-3 py-1.5 text-xs font-medium rounded-md transition-colors whitespace-nowrap shrink-0 ${
                      layoutMode === 'sequential'
                        ? 'bg-white text-slate-900 shadow-xs'
                        : 'text-slate-600 hover:text-slate-900'
                    }`}
                  >
                    Exact Header Order (1–{columns.length})
                  </button>
                </div>
              </div>
            </div>

            {showAddBoxBuilder ? (
              <div className="border-b border-slate-200 bg-slate-50/90 px-6 py-5 space-y-5">
                <div>
                  <h3 className="text-sm font-semibold text-slate-900">
                    Add / Remove ESIC Claim Entry Box &amp; Header Name
                  </h3>
                  <p className="mt-0.5 text-xs text-slate-500">
                    Select a section below to add quick headers, enter a manual header name, or remove any ESIC / Custom box. Changes update the Register Table, Excel export, and Google Sync automatically.
                  </p>
                </div>

                <div className="flex flex-wrap gap-2" role="tablist" aria-label="Select target section">
                  {SECTION_DEFINITIONS.map((sec) => {
                    const isSelected = selectedBuilderSection === sec.group;
                    return (
                      <button
                        key={sec.group}
                        type="button"
                        role="tab"
                        aria-selected={isSelected}
                        onClick={() => {
                          setSelectedBuilderSection(sec.group);
                          setBuilderFeedback(null);
                        }}
                        className={`rounded-lg border px-3 py-2 text-xs font-medium transition-colors whitespace-nowrap ${
                          isSelected
                            ? 'border-teal-700 bg-teal-700 text-white'
                            : 'border-slate-300 bg-white text-slate-700 hover:border-slate-400 hover:text-slate-900'
                        }`}
                      >
                        {sec.title}
                      </button>
                    );
                  })}
                </div>

                <div className="space-y-2">
                  <div className="text-xs font-medium text-slate-600">
                    Options for{' '}
                    <span className="font-semibold text-slate-900">
                      {(SECTION_DEFINITIONS.find((s) => s.group === selectedBuilderSection) || {}).title}
                    </span>{' '}
                    (click to add box &amp; header, or use Manual Name Entry):
                  </div>
                  <div className="flex flex-wrap gap-2">
                    {SECTION_PRESET_HEADERS[selectedBuilderSection].map((preset) => {
                      const alreadyAdded = existingNormalizedHeaders.has(
                        preset.header.trim().toLowerCase()
                      );
                      return (
                        <button
                          key={preset.header}
                          type="button"
                          disabled={alreadyAdded}
                          onClick={() =>
                            handleQuickAddPreset(
                              preset.header,
                              preset.inputType,
                              selectedBuilderSection
                            )
                          }
                          className={`inline-flex h-8 items-center gap-1.5 rounded-md border px-3 text-xs font-medium transition-colors whitespace-nowrap ${
                            alreadyAdded
                              ? 'border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed'
                              : 'border-slate-300 bg-white text-slate-800 hover:border-teal-700 hover:text-teal-800'
                          }`}
                        >
                          {alreadyAdded ? (
                            <Check className="h-3.5 w-3.5 text-emerald-600" aria-hidden="true" />
                          ) : (
                            <Plus className="h-3.5 w-3.5 text-teal-700" aria-hidden="true" />
                          )}
                          {preset.header}
                        </button>
                      );
                    })}

                    <button
                      type="button"
                      onClick={() => {
                        if (manualHeaderInputRef.current) manualHeaderInputRef.current.focus();
                      }}
                      className="inline-flex h-8 items-center gap-1.5 rounded-md border border-teal-700/40 bg-teal-50/70 px-3 text-xs font-semibold text-teal-900 transition-colors hover:bg-teal-100/70 whitespace-nowrap"
                    >
                      <Pencil className="h-3 w-3" aria-hidden="true" />
                      Manual Name Entry
                    </button>
                  </div>
                </div>

                <div className="flex flex-wrap items-end gap-3 border-t border-slate-200 pt-4">
                  <div className="flex flex-1 min-w-[240px] flex-col gap-1">
                    <label htmlFor="custom-header-name" className="text-xs font-semibold text-slate-700">
                      Manual Header Name Entry (adds new box &amp; column inside selected section)
                    </label>
                    <input
                      ref={manualHeaderInputRef}
                      id="custom-header-name"
                      type="text"
                      value={customHeaderInput}
                      onChange={(e) => setCustomHeaderInput(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          handleAddCustomHeaderSubmit();
                        }
                      }}
                      placeholder="Type any manual header name (e.g., Ward No., TPA Name, Doctor Remark)..."
                      className="h-9 w-full rounded-lg border border-slate-300 bg-white px-3 text-xs text-slate-900 placeholder:text-slate-400 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15"
                    />
                  </div>

                  <div className="flex flex-col gap-1">
                    <label htmlFor="custom-header-type" className="text-xs font-semibold text-slate-700">
                      Box Type
                    </label>
                    <select
                      id="custom-header-type"
                      value={customTypeInput}
                      onChange={(e) => setCustomTypeInput(e.target.value)}
                      className="h-9 rounded-lg border border-slate-300 bg-white px-3 text-xs text-slate-900 focus:border-teal-700 focus:outline-none focus:ring-2 focus:ring-teal-700/15"
                    >
                      <option value="text">Text</option>
                      <option value="number">Number / Amount</option>
                      <option value="date">Date</option>
                      <option value="time">Time</option>
                      <option value="tel">Phone / Mobile</option>
                    </select>
                  </div>

                  <button
                    type="button"
                    onClick={handleAddCustomHeaderSubmit}
                    className="inline-flex h-9 items-center gap-1.5 rounded-lg bg-teal-700 px-4 text-xs font-semibold text-white transition-colors hover:bg-teal-800 whitespace-nowrap shrink-0"
                  >
                    <Plus className="h-3.5 w-3.5" aria-hidden="true" />
                    Add Header &amp; Box
                  </button>
                </div>

                {builderFeedback ? (
                  <div
                    role="status"
                    className={`rounded-lg border px-3.5 py-2 text-xs font-medium ${
                      builderFeedback.tone === 'error'
                        ? 'border-red-200 bg-red-50 text-red-800'
                        : 'border-emerald-200 bg-emerald-50 text-emerald-800'
                    }`}
                  >
                    {builderFeedback.text}
                  </div>
                ) : null}

                <div className="border-t border-slate-200 pt-4 space-y-2.5">
                  <div className="flex flex-wrap items-center justify-between gap-2">
                    <div className="text-xs font-semibold text-slate-700">
                      Remove ESIC Claim Entry Box &amp; Header Name — Active in{' '}
                      {(SECTION_DEFINITIONS.find((s) => s.group === selectedBuilderSection) || {}).title} (
                      {activeColumnsInSelectedSection.length})
                    </div>
                    {hiddenBaseColumns.length > 0 ? (
                      <button
                        type="button"
                        onClick={() => {
                          onRestoreAllBaseColumns();
                          setBuilderFeedback({
                            text: 'Restored all removed default ESIC headers.',
                            tone: 'success',
                          });
                        }}
                        className="text-xs font-medium text-teal-700 hover:underline whitespace-nowrap"
                      >
                        Restore all removed defaults ({hiddenBaseColumns.length})
                      </button>
                    ) : null}
                  </div>

                  <div className="flex flex-wrap gap-2">
                    {activeColumnsInSelectedSection.map((col) => (
                      <div
                        key={col.key}
                        className={`inline-flex items-center gap-2 rounded-md border px-2.5 py-1 text-xs ${
                          col.isCustom
                            ? 'border-teal-200 bg-teal-50/50 text-slate-900'
                            : 'border-slate-200 bg-white text-slate-800'
                        }`}
                      >
                        <span className="font-medium">
                          {col.header}
                          {col.formContext ? ` (${col.formContext})` : ''}
                        </span>
                        {col.isCustom ? (
                          <span className="text-[10px] font-medium text-teal-700">Custom</span>
                        ) : null}
                        <button
                          type="button"
                          onClick={() => handleRemoveField(col)}
                          title={`Remove ${col.header}`}
                          aria-label={`Remove ${col.header}`}
                          className="inline-flex items-center gap-0.5 rounded px-1 py-0.5 text-[11px] font-medium text-red-700 transition-colors hover:bg-red-100/80"
                        >
                          <Trash2 className="h-3 w-3" aria-hidden="true" />
                          <span>Remove</span>
                        </button>
                      </div>
                    ))}
                  </div>

                  {hiddenBaseColumns.length > 0 ? (
                    <div className="pt-2">
                      <div className="mb-1.5 text-[11px] font-medium text-slate-500">
                        Removed default ESIC headers (click to restore):
                      </div>
                      <div className="flex flex-wrap gap-1.5">
                        {hiddenBaseColumns.map((col) => (
                          <button
                            key={col.key}
                            type="button"
                            onClick={() => {
                              onRestoreBaseColumn(col.key);
                              setBuilderFeedback({
                                text: `Restored "${col.header}" box & header.`,
                                tone: 'success',
                              });
                            }}
                            className="inline-flex items-center gap-1 rounded-md border border-dashed border-slate-300 bg-white px-2.5 py-1 text-xs text-slate-600 transition-colors hover:border-teal-600 hover:text-teal-800"
                          >
                            <Plus className="h-3 w-3" aria-hidden="true" />
                            <span>
                              {col.header}
                              {col.formContext ? ` (${col.formContext})` : ''}
                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  ) : null}
                </div>
              </div>
            ) : null}

            <form onSubmit={handleFormSubmit} noValidate>
              {validationError ? (
                <div
                  role="alert"
                  className="mx-6 mt-5 rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-800"
                >
                  {validationError}
                </div>
              ) : null}

              {layoutMode === 'grouped' ? (
                <div className="divide-y divide-slate-200/80">
                  {SECTION_DEFINITIONS.map((section) => {
                    const sectionCustomCols = customColumns.filter((c) => c.group === section.group);
                    const orderedKeys = [
                      ...section.baseOrder.filter((k) => !hiddenBaseKeys.includes(k)),
                      ...sectionCustomCols.map((c) => c.key),
                    ];

                    return (
                      <fieldset key={section.group} className="px-6 py-6">
                        <div className="mb-4 flex flex-wrap items-start justify-between gap-3">
                          <div>
                            <legend className="text-sm font-semibold text-slate-900">
                              {section.title}
                            </legend>
                            <p className="mt-0.5 text-xs text-slate-500">{section.subtitle}</p>
                          </div>

                          {showAddBoxBuilder ? (
                            <button
                              type="button"
                              onClick={() => {
                                setSelectedBuilderSection(section.group);
                                if (manualHeaderInputRef.current) manualHeaderInputRef.current.focus();
                              }}
                              className="text-xs font-medium text-teal-700 hover:underline whitespace-nowrap"
                            >
                              + Add / remove box in this section
                            </button>
                          ) : null}
                        </div>
